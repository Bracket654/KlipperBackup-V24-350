
[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
#    default_parameter_BED: 60 #target bed temperature
#    default_parameter_EXTRUDER: 210 #target extruder temperature

    ## To test:
    #Nozzle diameter = {machine_nozzle_size}
    #Filament type = {material_type}
    #Filament name = {material_name}
    #Filament weight = {filament_weight}
    #M190 S{material_bed_temperature_layer_0}
    #M109 S{material_print_temperature_layer_0}

    {% set bedtemp = params.BED|int %}
    {% set hotendtemp = params.HOTEND|int %}
    # {% set chambertemp = params.CHAMBER|default(0)|int %}

    ################################################################# CAT_COLLECT_PRINTER_STATUS_VAR                           ; Caterpillar - Park Position

    SAVE_GCODE_STATE NAME=start
    CLEAR_PAUSE                                              ; https://www.klipper3d.org/G-Codes.html#clear_pause
    SET_PIN PIN=caselight VALUE=1.00
    
    M117 Starting Pre-Print Preperation
    
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0       ; ERCF - The filament sensor is turn OFF
    
    CG28                                                     ; home all axes - X Y Z - if not done already
    # G28                                                    ; home all axes - X Y Z
    
    #PURGE_BUCKET_POSITION
    CAT_TRANSIT_PARK_POSITION_XYZ                            ; Caterpillar - Park Position
    
    
    M117 Starting Bed warmup
    M190 S{bedtemp}                                          ; set & wait for bed temp
    # M117 Wait for Chamber Temp
    # TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={chambertemp}   ; wait for chamber temp
    # M117 Chamber Temp Reached
    
    M117 Starting Tool warmup
    M109 S{hotendtemp}                                       ; set & wait for hotend temp
    
    # M140 S80                                               ; set bed temp
    # M109 S222                                              ; set extruder temp and wait
    #M117 Cleaning Nozzle
    
    #CLEAN_NOZZLE
    #CG32                                                     ; home all axes - X Y Z + Gantry_Level the go to purge bucket
    #CALIBRATE_Z
    #CLEAN_NOZZLE

    CAT_CLEAN_NOZZLE                                         ; Caterpillar - Brush Nozzle
    CG32                                                     ; home all axes - X Y Z + Gantry_Level the go to purge bucket
    #CALIBRATE_Z
    CAT_CLEAN_NOZZLE                                         ; Caterpillar - Brush Nozzle
    
    BED_MESH_PROFILE LOAD=default
    #BED_MESH_CLEAR
    #BED_MESH_CALIBRATE PROFILE="default"

    #SET_GCODE_OFFSET Z=0.0

    M83                                                      ; Make the E relative independant of other axis
    
    CHAMBER_OP_TEMP                                          ; HVAC System set for Enclosure Print
    # M141 S36                                               ; set enclosure temp - eventually wait to reach temp
    # SET_FAN_SPEED FAN=exhaust_fan SPEED=0.8
    # M117 Purging Filament
    
    ### PURGE_FILAMENT                                       ; Disabled For ERCF Use
    # G28 Z                                                  ; home Z only
    ### MOVE_CENTER_BED_NOZZLE                               ; Disabled For ERCF Use     ; move nozzle to center of bed
    ### G1 E2 F1500 # unretract                              ; Disabled For ERCF Use
    ### M117 Starting Print                                  ; Disabled For ERCF Use

    ####################################### CAT_INITIAL_PURGE_FILAMENT                               ; Caterpillar - Park Position

    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1       ; ERCF - The filament sensor is turn ON
    RESTORE_GCODE_STATE NAME=start


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
  TURN_OFF_HEATERS                                                                 # ERCF
  CLEAR_PAUSE                                                                      # ERCF
  SDCARD_RESET_FILE                                                                # ERCF
  {% set x_park = printer.toolhead.axis_minimum.x|float + 5.0 %}                   # ERCF
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}                   # ERCF
  {% set max_z = printer.toolhead.axis_maximum.z|float %}                          # ERCF
  {% set act_z = printer.toolhead.position.z|float %}                              # ERCF
  {% if act_z < (max_z - 20.0) %}                                                  # ERCF
      {% set z_safe = 20.0 %}                                                      # ERCF
  {% else %}                                                                       # ERCF
      {% set z_safe = max_z - act_z %}                                             # ERCF
  {% endif %}                                                                      # ERCF
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0                               # added for ERCF
  G91                                                                              # ERCF
  G1 Z{z_safe} F900                                                                # ERCF
  G90                                                                              # ERCF
  G0 X{x_park} Y{y_park} F6000                                                     # ERCF
  BASE_CANCEL_PRINT                                                                # ERCF


[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  {% set x_park = printer.toolhead.axis_minimum.x|float + 5.0 %}                    # ERCF
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}                    # ERCF
  {% set max_z = printer.toolhead.axis_maximum.z|float %}                           # ERCF
  {% set act_z = printer.toolhead.position.z|float %}                               # ERCF
  {% if act_z < (max_z - 5.0) %}                                                    # ERCF
      {% set z_safe = 5.0 %}                                                        # ERCF
  {% else %}                                                                        # ERCF
      {% set z_safe = max_z - act_z %}                                              # ERCF 
  {% endif %}                                                                       # ERCF
  G92 E0                                                                            # ERCF
  G1 E-1.0 F1500.0                                                                  # ERCF
  G90                                                                               # ERCF
  SAVE_GCODE_STATE NAME=PAUSE_state                                                 # ERCF
  BASE_PAUSE                                                                        # ERCF
  G91                                                                               # ERCF
  G1 Z{z_safe} F900                                                                 # ERCF
  G90                                                                               # ERCF
  G0 X{x_park} Y{y_park} F6000                                                      # ERCF


[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% if printer.ercf.is_paused|int == 1 %}                                        # 
        M118 You can't resume the print without unlocking the ERCF first.           # 
        M118 Run ERCF_UNLOCK and solve any issue before hitting Resume again        # 
    {% else %}                                                                      # 
        RESTORE_GCODE_STATE NAME=PAUSE_state                                        # 
        G90                                                                         # 
        {% if printer.ercf.clog_detection|int == 1 %}                               # 
            SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1                      # 
        {% endif %}                                                                 # 
        BASE_RESUME                                                                 # 
    {% endif %}


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:   
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    {% set unload = params.UNLOAD_AT_END|default(0)|int %}                              # ERCF
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0                                  # ERCF
    M117 End of Print Process
    SET_PIN PIN=caselight VALUE=1.00
    M400                                                      ; wait for buffer to clear
    G92 E0                                                    ; zero the extruder
    M83                                                       ; E axis relative position
    # G1 E-5.0 F1800                                          ; retract filament - Default
    G1 E-10.0 F3600                                           ; retract filament - For ERCF
    G91                                                       ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000                               ; move nozzle to remove stringing
    M117 Park Tool at rear
    G1 Z2 F3000                                               ; move nozzle up 2mm
    G90                                                       ; absolute positioning
    PURGE_BUCKET_POSITION_X_Y                                 ; park nozzle at rear
    {% if unload|int == 1%}                                                              # ERCF
      ERCF_EJECT                                                                         # ERCF
    {% endif %}                                                                          # ERCF
    TURN_OFF_HEATERS
    M117 Turn Off Heaters
    BED_MESH_CLEAR
    #SET_GCODE_OFFSET Z=0.0
    VENT_CHAMBER
    M117 Print Completed Venting Enclosure
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
