## This file contains common pin mappings for

[manual_stepper gear_stepper]
# Carrot Feeder 5mm D-cut shaft
step_pin: ercf:gpio7
dir_pin: !ercf:gpio8 
enable_pin: !ercf:gpio6
#rotation_distance: 23.020269314055	 # Bondtech 5mm Drive Gears
rotation_distance: 22.79006662091445	 # Bondtech 5mm Drive Gears
gear_ratio: 80:20
microsteps: 16                      # Please do not go higher than 16, this can cause 'MCU Timer too close' issues under Klipper
full_steps_per_rotation: 200	    # 200 for 1.8 degree, 400 for 0.9 degree
velocity: 35
accel: 150
# Right now no pin is used for the endstop, but we need to define one for klipper. So just use a random, not used pin
endstop_pin: ^ercf:gpio13           # unused pin on the MCU

[tmc2209 manual_stepper gear_stepper]
# Adapt accordingly to your setup and desires
# The default values are tested with the BOM NEMA14 motor
# Please adapt those values to the motor you are using
# Example : for NEMA17 motors, you'll usually set the stealthchop_threshold to 0
# and use higher current
uart_pin: ercf:gpio9
#uart_address: 0                    # Default: 0 
interpolate: True                  # Default: True
run_current: 0.4                   # Default: 0.4 
hold_current: 0.15      
sense_resistor: 0.110              # Default: 0.110 
stealthchop_threshold: 500
# diag_pin: ercf:gpio23

# [tmc5160 manual_stepper gear_stepper]
# cs_pin: ercf:gpio9
#spi_software_sclk_pin: ercf:gpio19
#spi_software_mosi_pin: ercf:gpio18
#spi_software_miso_pin: ercf:gpio16
# interpolate: True
# run_current: 0.40
# hold_current: 0.1
# stealthchop_threshold: 500
# diag0_pin: ercf:gpio23


# Carrot Feeder selector
[manual_stepper selector_stepper]
step_pin: ercf:gpio2
dir_pin: !ercf:gpio1
enable_pin: !ercf:gpio3        
rotation_distance: 40
microsteps: 16                  # Please do not go higher than 16, this can cause 'MCU Timer too close' issues under Klipper
full_steps_per_rotation: 200	# 200 for 1.8 degree, 400 for 0.9 degree
velocity: 200
accel: 600
#endstop_pin: ^!ercf:PB9
# Select the endstop you want depending if you are using sensorless homing for the selector or not
endstop_pin: ercf:gpio20
#endstop_pin: tmc2209_selector_stepper:virtual_endstop

#endstop_pin: tmc5160_selector_stepper:virtual_endstop


[tmc2209 manual_stepper selector_stepper]
uart_pin: ercf:gpio0
#uart_address: 1
run_current: 0.55
## Originally the hold current wasn't specified for the gear and selector motors (which is indeed the recommendation by Klipper for your critical toolhead motors).  
## I added a recommended hold current of 0.1 or 0.15 (think think they should have both been 0.1) with Happy Hare based on the fact that these aren't at all critical motors.  
## The gear motor would probably even be turned off between use.  The selector motor just needs to maintain it's position and not move.  
## Having a little current gives it a high degree of "knock resistance".   I can't see any reason for more as it, as already pointed out, is just going to heat your room and electronics.
hold_current: 0.15
interpolate: True
sense_resistor: 0.110
#stealthchop_threshold: 5000
stealthchop_threshold: 500
# Uncomment the lines below if you want to use sensorless homing for the selector
#diag_pin: ^ercf:gpio22      # Set to MCU pin connected to TMC DIAG pin
#driver_SGTHRS: 75  # 255 is most sensitive value, 0 is least sensitive

