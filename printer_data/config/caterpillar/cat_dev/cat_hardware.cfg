# CATERPILLAR MCU  -----------------------------------------------------------------------------------------------------
# CAT - fly Can v1.2 - CAN BUS
# Caterpillar - Ejection Assisted Purge System: CAT - fly Can v1.2 - CAN BUS
# https://mellow-3d.github.io/fly_ercf_v1.1_pins.html#sample-configuration-file-fly-ercf-easy-brd-v11cfg
# https://mellow-3d.github.io/fly_ercf_v1.1_pins.html#xt30-22-wiring


[force_move]
enable_force_move: True


# CATERPILLAR FILAMENT PURGE BELT - DRIVE GEAR STEPPER  ----------------------------------------------------------------
# 
# 
[extruder_stepper caterpillar_track]
extruder:                           # Default: <No Value>  ### Configuration For Sync Caterpillar Stepper Motor with Extruder
step_pin: caterpillar:gpio7  
dir_pin: !caterpillar:gpio8    
enable_pin: !caterpillar:gpio6  
rotation_distance: 45               # Default: 45  ### Tune conveyor belt for synch operation with the Extruder
gear_ratio: 40:20                   # Default: 40:20 
microsteps: 16                      # Please do not go higher than 16, this can cause 'MCU Timer too close' issues under Klipper
full_steps_per_rotation: 200	    # 200 for 1.8 degree, 400 for 0.9 degree


# Caterpillar Track Stepper Driver
# CAT - fly Can v1.2 - CAN BUS
[tmc2209 extruder_stepper caterpillar_track]
# NEMA17 motors, you'll usually set the stealthchop_threshold to 0
# and use higher current
uart_pin: caterpillar:gpio9        # Default: caterpillar:gpio9
interpolate: True                  # Default: True
run_current: 0.5                   # Default: 0.5 
hold_current: 0.1                  # Default: 0.1
sense_resistor: 0.110              # Default: 0.110 
stealthchop_threshold: 0           # Default: 0
#
# HOMING CAPABLE EXTRUDER (VERY ADVANCED) -----------------------------------------------------------------------------
# With Happy Hare installed even the extruder can be homed. You will find the usual 'endstop' parameters can be added                    <----- Review This
# to your '[extruder]' section.  Useless you have some clever load cell attached to your nozzle it only really makes
# sense to configure stallguard style "touch" homing. To do this add lines similar to this to your existing
# '[extruder]' definition in printer.cfg.
#
#    [extruder]
#    endstop_pin: tmc2209_extruder:virtual_endstop
#
# Also be sure to add the appropriate stallguard config to the TMC section, e.g.
#
#    [tmc2209 extruder]
#    diag_pin: E_DIAG		# Set to MCU pin connected to TMC DIAG pin for extruder
#    driver_SGTHRS: 100		# 255 is most sensitive value, 0 is least sensitive
#
# Happy Hare will take care of the rest and add a 'mmu_ext_touch' endstop automatically
#
# Uncomment the two lines below to enable filament "touch" homing option with gear motor                                                    <----- Review This
#extra_endstop_pins: tmc2209_stepper_mmu_gear:virtual_endstop
#extra_endstop_names: mmu_gear_touch


# PURGED FILAMENT CONVEYOR BELT - DRIVE GEAR STEPPER  ----------------------------------------------------------------
# 
# 
[extruder_stepper caterpillar_conveyor_belt]
extruder:                           # Default: <No Value>  ### Configuration For Sync conveyor belt Stepper Motor with Extruder
step_pin: caterpillar:gpio2 
dir_pin: caterpillar:gpio1 
enable_pin: !caterpillar:gpio3 
rotation_distance: 5                # Default: 5  ### Tune conveyor belt for synch operation with the Caterpillar filament extraction         <----- Review This
gear_ratio: 40:20                   # Default: 40:20                                                                                          <----- Review This - Should be 40:40
microsteps: 16                      # Please do not go higher than 16, this can cause 'MCU Timer too close' issues under Klipper
full_steps_per_rotation: 200	    # 200 for 1.8 degree, 400 for 0.9 degree


# Convoyer Track Stepper Driver
# CAT - fly Can v1.2 - CAN BUS
[tmc2209 extruder_stepper caterpillar_conveyor_belt]
# NEMA17 motors, you'll usually set the stealthchop_threshold to 0
# and use higher current
uart_pin: caterpillar:gpio0
interpolate: True                  # Default: True
run_current: 1.2                  # Default: 0.4 
hold_current: 0.01                  # Default: 0.1
sense_resistor: 0.110              # Default: 0.110 
stealthchop_threshold: 0           # Default: 0


# https://www.klipper3d.org/Config_Reference.html#neopixel
#[neopixel sb_leds]
#pin: EBBCan:PD3        #PB0
#   The pin connected to the neopixel. This parameter must be provided.
#chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
#color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
#initial_RED: 1.0
#initial_GREEN: 0.0
#initial_BLUE: 1.0
#initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.#

# Most configuration for the macros can be done by modifying the variables in the _sb_vars macro
# at the start of this file.


