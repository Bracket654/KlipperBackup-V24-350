#####################################################################################
# _CAT_DIRECT_PURGE - BlaBla
# 
[gcode_macro _CAT_DIRECT_PURGE]
variable_short_purge: False
variable_short_purge_qty: 1
description: _CAT_DIRECT_PURGE - BlaBla
gcode:
   {% set strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_dist|float %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Lenght
   {% set strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_velo|float %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Velocity
   {% set exit_strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_dist|float %}        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Lenght
   {% set exit_strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_velo|float %}        # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Velocity 
   {% set strip_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo|float %}                          # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity 
   {% set strip_velo_slow = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo_slow|float %}                # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity Slow
   {% set retract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_dist|float %}                      # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance
   {% set retract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_velo|float %}                      # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity
   {% set z_purge_belt = printer["gcode_macro _CAT_PARAMETERS"].cat_z_purge_belt|float %}                      # (mm) From Parameters - Toolhead Purge Position Z - The Toolhead resting on the Surface of the Caterpillar Track (GT2 Belt) - Also see: variable_cat_z_tool_gap_dist
   {% set z_tool_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_z_tool_gap_dist|float %}                # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Gap Toolhead to Track(GT2 Belt)
   {% set z_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_z_purge_velo|float %}                      # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position
   {% set unretract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_dist|float %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Distance 
   {% set unretract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_velo|float %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity 
   {% set zhop_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_dist|float %}                            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Distance  
   {% set zhop_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_velo|float %}                            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Velocity
   {% set retract_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_dist|float %}            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance Exit
   {% set retract_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_velo|float %}            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Exit
   {% set zhop_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_dist|float %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Distance 
   {% set zhop_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_velo|float %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Velocity
   {% set part_fan_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_part_fan_velo|float %}                    # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Part Fan Velocity 
   {% set strip_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_exit_dist_min|float %}            # (mm) Lenght Of Each Individual Strip
   {% set print_in_progress = printer["gcode_macro _CAT_PRINT_MODE"].direct_purge_print_in_progress %}         # Enable/Disable - Purge Exit Mode 
   {% set skip_initial_load = printer["gcode_macro _CAT_PRINT_MODE"].slicer_pre_tool_swap_skip_initial_load %}       # 
   
   {% set strip_dist = printer["gcode_macro _CAT_PURGE_PRE_CAL"].cat_strip_dist|int %}                         # (mm) Lenght Of Each Individual Strip
   {% set strip_qty = printer["gcode_macro _CAT_PURGE_PRE_CAL"].cat_strip_qty|int %}                           # (Qty) Total Number Of Purge Strips

   M118 _CAT_DIRECT_PURGE

   SET_NOZZLE_LEDS_ON

   {% if short_purge %}
      {% set strip_qty = short_purge_qty %}
      SET_GCODE_VARIABLE MACRO=_CAT_DIRECT_PURGE VARIABLE=short_purge VALUE={ False }                          # 
   {% endif %}

   M118 Total Number Of Strip to Caterpillar: {strip_qty}

   SAVE_GCODE_STATE NAME=_CAT_PURGE_FILAMENT   
   
   G90                                                               # Absolute Positioning 

   {% set strip_qty = (strip_qty - 1)|int %}                         # (Qty) Of Purge 

   # x Number Standard Purge Strip
   {% for i in range(strip_qty) %}

      _CAT_ENABLE_TRACK_SYNC
      _CAT_ENABLE_CONVEYOR_BELT_SYNC

      _CAT_PURGE_Z_OFFSET
   
      G92 E0                                                         # Zero Extruder 
      M83                                                            # Extruder - Relative Positioning
      G1 E{unretract_dist} F{unretract_velo}                         # Unretract Filament

      G1 E{strip_dist} F{strip_velo}                                 # Purge Initial Filament Strip - Standard Speed

      _CAT_DISABLE_TRACK_SYNC
      _CAT_DISABLE_CONVEYOR_BELT_SYNC

      G92 E0                                                         # Zero Extruder 
      M83                                                            # Extruder - Relative Positioning
      G1 E-{retract_dist} F{retract_velo}                            # Retract
      M82                                                            # Extruder - absolute Positioning
      G90                                                            # Absolute Positioning

      G91                                                            # Relative Positioning
      G1 Z{zhop_dist} F{zhop_velo}                                   # Caterpillar Z Hop
   
      G90
      FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={strip_gap_dist} VELOCITY={strip_gap_velo}    # Caterpillar Track UnSync - Move Gap       
   {% endfor %}

   ####################################################################### Exit Strip #######################################################################
 
   {% if print_in_progress %}
      M118 Print Mode

      _CAT_ENABLE_TRACK_SYNC
      _CAT_ENABLE_CONVEYOR_BELT_SYNC

      _CAT_PURGE_Z_OFFSET
   
      G92 E0                                                         # Zero Extruder 
      M83                                                            # Extruder - Relative Positioning
      G1 E{unretract_dist} F{unretract_velo}                         # Unretract Filament

      G1 E{strip_exit_dist * 0.25} F{strip_velo_slow}                        # Purge Initial Filament Strip - Standard Speed

      M106 S255

      #G91                                                            # Relative Positioning
      #G1 Z-0.5 F{zhop_velo}                                   # Caterpillar Z Hop
      #G90                                                            # Absolute Positioning

      G1 E{strip_exit_dist * 0.75} F{strip_velo_slow}                        # Purge Initial Filament Strip - Standard Speed

      #M106 S0

      _CAT_DISABLE_TRACK_SYNC
      _CAT_DISABLE_CONVEYOR_BELT_SYNC      
      
      G92 E0                                                         # Zero Extruder
      M83                                                            # Extruder - Relative Positioning
      G1 E-{retract_exit_dist} F{retract_exit_velo}                  # Retract
      M82                                                            # Extruder - absolute Positioning
      G90                                                            # Absolute Positioning

      #G91                                                            # Relative Positioning
      #G1 Z{zhop_exit_dist} F{zhop_exit_velo}                         # Caterpillar Z Hop
      #G90  

      #G91                                                            # Relative Positioning
      #G1 Z1 F{zhop_velo}                                   # Caterpillar Z Hop
      #G90    
   
      G90                                                            # Absolute Positioning
      FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={exit_strip_gap_dist} VELOCITY={exit_strip_gap_velo}    # Caterpillar Track UnSync - Move Gap  

      G92 E0                                                         # Zero Extruder 

      {% if skip_initial_load == False %}
         _CAT_MM_TIMELAPSE TAKE_FRAME_SWAPS=True
         _CAT_DIRECT_BRUSH
      {% endif %}
      
   {% else %} 
      M118 Offprint Mode

      _CAT_ENABLE_TRACK_SYNC
      _CAT_ENABLE_CONVEYOR_BELT_SYNC

      _CAT_PURGE_Z_OFFSET
   
      G92 E0                                                         # Zero Extruder 
      M83                                                            # Extruder - Relative Positioning
      G1 E{unretract_dist} F{unretract_velo}                         # Unretract Filament

      G1 E{strip_exit_dist * 0.25} F{strip_velo_slow}                        # Purge Initial Filament Strip - Standard Speed

      M106 S255

      #G91                                                            # Relative Positioning
      #G1 Z-0.5 F{zhop_velo}                                   # Caterpillar Z Hop
      #G90                                                            # Absolute Positioning

      G1 E{strip_exit_dist * 0.75} F{strip_velo_slow}                        # Purge Initial Filament Strip - Standard Speed

      M106 S0

      _CAT_DISABLE_TRACK_SYNC
      _CAT_DISABLE_CONVEYOR_BELT_SYNC      
      
      G92 E0                                                         # Zero Extruder
   
      M83                                                            # Extruder - Relative Positioning
      G1 E-2 F{retract_velo}                                         # Retract
      M82                                                            # Extruder - absolute Positioning
      G90                                                            # Absolute Positioning

      #G91                                                            # Relative Positioning
      #G1 Z{zhop_dist} F{zhop_velo}                                   # Caterpillar Z Hop
      #G90                                                            # Absolute Positioning

      G90                                                            # Absolute Positioning
      FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={strip_gap_dist} VELOCITY={strip_gap_velo}    # Caterpillar Track UnSync - Move Gap  
      
      G92 E0                                                         # Zero Extruder 

   {% endif %}

   RESTORE_GCODE_STATE NAME=_CAT_PURGE_FILAMENT                      #   


#####################################################################################
# _CAT_DIRECT_PRE_PRINT_PURGE - BlaBla
# 
[gcode_macro _CAT_DIRECT_PRE_PRINT_PURGE]
variable_short_purge_qty: 1
description: _CAT_DIRECT_PRE_PRINT_PURGE - BlaBla
gcode:
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions

   #Make If Then for Initial Tool Loaded Or Not
   #MMU_START_LOAD_INITIAL_TOOL
   
   _CAT_DIRECT_OVER_TRACK                     # 

   SET_NOZZLE_LEDS_ON                         # 
   _CAT_PART_FAN_SAFE_STATE                   # 
   _CAT_EXTRUSION_FACTOR_SAFE_STATE           # 
   _CAT_SPEED_FACTOR_SAFE_STATE               # 
   G4 P2000                                   # Dwell for 2 second  -  Whait For Part Fan to Stop Blowing

   SET_GCODE_VARIABLE MACRO=_CAT_DIRECT_PURGE VARIABLE=short_purge VALUE={ True }                            #
   SET_GCODE_VARIABLE MACRO=_CAT_DIRECT_PURGE VARIABLE=short_purge_qty VALUE={ short_purge_qty }             #

   _CAT_DIRECT_PURGE                          # 

   _CAT_MM_TIMELAPSE PRINT_INT_PURGE=True

   _CAT_DIRECT_BRUSH

   _CAT_SPEED_FACTOR_RESUME_STATE             # 
   _CAT_EXTRUSION_FACTOR_RESUME_STATE         # 
   _CAT_PART_FAN_RESUME_STATE                 #  

   G91
   G1 X50 Y-58 F4000                        # 
   G90                                      # use absolute coordinates

   _MMU_UPDATE_HEIGHT HEIGHT={cat_safe_z_min}                                           # Does it Work?


#####################################################################################
# _CAT_DIRECT_PARK - BlaBla
#
[gcode_macro _CAT_DIRECT_PARK]
description: _CAT_DIRECT_PARK - BlaBla
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions
   {% set cat_safe_z_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_velo %}            # (mm/sec) From Parameters - Gantry Velocity Z Transition
   {% set x_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_zt_zone_limit %}            # (mm) X - safe Z Transit Zone - X Limit
   {% set y_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_zt_zone_limit %}            # (mm) Y - safe Z Transit Zone - Y Limit   
   {% set x_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_gantry_zone_limit %}    # (mm) X - safe Z Transit Zone - X Limit   
   {% set y_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_gantry_zone_limit %}    # (mm) Y - safe Z Transit Zone - Y Limit     
   {% set x_park = printer["gcode_macro _CAT_PARAMETERS"].x_park %}                              # (mm) From Parameters - Toolhead Park Position X
   {% set y_park = printer["gcode_macro _CAT_PARAMETERS"].y_park %}                              # (mm) From Parameters - Toolhead Park Position Y
   {% set z_park = printer["gcode_macro _CAT_PARAMETERS"].z_park %}                              # (mm) From Parameters - Toolhead Park Position Z 
   {% set xy_park_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_velo %}                  # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position
   {% set z_park_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_velo %}                    # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position

   {% set act_z_offset = printer.gcode_move.homing_origin.z|float %}                             # Actual GCode Z Offset
   {% set act_z = act_z - act_z_offset %}                                                        # Actual Z w/out Z Offset

   {% if act_z < cat_safe_z_min %}
      M118 Toolhead under Safe Z Gantry Transit
      #M118 Direct Park Move
      G90                                                          # absolute positioning
      G0 Z{cat_safe_z_min} F{z_park_velo}                          # 
      G0 X{x_park} Y{y_park} F{xy_park_velo}                       # XY Park Position
   {% else %}
      #M118 Toolhead above Safe Z Gantry Transit
      #M118 Direct Park Move
      G90                                                          # absolute positioning
      G0 X{x_park} Y{y_park} Z{cat_safe_z_min} F{xy_park_velo}     # XYZ Park Position
   {% endif %}
   
   #M118 Direct Park Move
   G90                                                             # absolute positioning
   G0 Z{z_park} F{z_park_velo}                                     # Sit On Park Position To Block Dripping Flow Of Plastic


#####################################################################################
# _CAT_DIRECT_OVER_TRACK - BlaBla
#
[gcode_macro _CAT_DIRECT_OVER_TRACK]
description: _CAT_DIRECT_OVER_TRACK - BlaBla
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions
   {% set cat_safe_z_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_velo %}            # (mm/sec) From Parameters - Gantry Velocity Z Transition
   {% set x_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_zt_zone_limit %}            # (mm) X - safe Z Transit Zone - X Limit
   {% set y_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_zt_zone_limit %}            # (mm) Y - safe Z Transit Zone - Y Limit   
   {% set x_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_gantry_zone_limit %}    # (mm) X - safe Z Transit Zone - X Limit   
   {% set y_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_gantry_zone_limit %}    # (mm) Y - safe Z Transit Zone - Y Limit  
   {% set x_park_purge = printer["gcode_macro _CAT_PARAMETERS"].x_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position X
   {% set y_park_purge = printer["gcode_macro _CAT_PARAMETERS"].y_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position Y
   {% set z_park_purge = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge %}                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Z 
   {% set xy_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_purge_velo %}      # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position
   {% set xy_park_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_velo %}                  # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position
   {% set z_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge_velo %}        # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position  
   {% set z_park_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_velo %}                    # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position

   {% set act_z_offset = printer.gcode_move.homing_origin.z|float %}                             # Actual GCode Z Offset
   {% set act_z = act_z - act_z_offset %}                                                        # Actual Z w/out Z Offset

   {% if z_park_purge < cat_safe_z_min %}
      {% set z_park_purge = cat_safe_z_min %}
   {% endif %}
   
   {% if act_z < z_park_purge %}
      M118 Toolhead under Safe Z Gantry Transit
      #M118 Direct Park Purge Move
      G90                                                                         # absolute positioning
      G0 Z{z_park_purge} F{z_park_purge_velo}                                     # 
      G0 X{x_park_purge} Y{y_park_purge} F{xy_park_purge_velo}                    # XY Park Position
   {% else %}
      #M118 Toolhead above Safe Z Gantry Transit
      #M118 Direct Park Purge Move
      G90                                                                         # absolute positioning
      G0 X{x_park_purge} Y{y_park_purge} Z{z_park_purge} F{z_park_purge_velo}     # XYZ Park Position
   {% endif %}


###################################################################################
# Bla Bla 
#
[gcode_macro _CAT_DIRECT_PARK_BUCKET]
description: Bla Bla
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions
   {% set cat_safe_z_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_velo %}            # (mm/sec) From Parameters - Gantry Velocity Z Transition
   {% set x_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_zt_zone_limit %}            # (mm) X - safe Z Transit Zone - X Limit
   {% set y_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_zt_zone_limit %}            # (mm) Y - safe Z Transit Zone - Y Limit   
   {% set x_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_gantry_zone_limit %}    # (mm) X - safe Z Transit Zone - X Limit   
   {% set y_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_gantry_zone_limit %}    # (mm) Y - safe Z Transit Zone - Y Limit   
   {% set x_bucket = printer["gcode_macro _CAT_PARAMETERS"].x_bucket %}                          # (mm) From Parameters - Bucket Position X
   {% set y_bucket = printer["gcode_macro _CAT_PARAMETERS"].y_bucket %}                          # (mm) From Parameters - Bucket Position Y
   {% set z_bucket = printer["gcode_macro _CAT_PARAMETERS"].z_bucket %}                          # (mm) From Parameters - Bucket Position Z 
   {% set xy_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_purge_velo %}      # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position
   {% set xy_brush_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_brush_velo %}                # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Brush Position
   {% set xy_park_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_velo %}                  # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position
   {% set z_park_purge = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge %}                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Z 
   {% set z_brush_velo = printer["gcode_macro _CAT_PARAMETERS"].z_brush_velo %}                  # (mm/sec) From Parameters - Toolhead Brush Position Z 
   {% set z_park_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_velo %}                    # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position

   {% set act_z_offset = printer.gcode_move.homing_origin.z|float %}                             # Actual GCode Z Offset
   {% set act_z = act_z - act_z_offset %}                                                        # Actual Z w/out Z Offset

   {% if z_bucket < cat_safe_z_min %}
      {% set z_bucket = cat_safe_z_min %}
   {% endif %}   

   {% if act_z < z_bucket %}
      M118 Toolhead under Safe Z Gantry Transit
      #M118 Direct Park Purge Move
      G90                                                              # absolute positioning
      G0 Z{z_bucket} F{z_brush_velo}                                   # 
      G0 X{x_bucket} Y{y_bucket} F{xy_brush_velo}                      # XY Park Position
   {% else %}
      #M118 Toolhead above Safe Z Gantry Transit
      #M118 Direct Park Purge Move
      G90                                                              # absolute positioning
      G0 X{x_bucket} Y{y_bucket} Z{z_bucket} F{z_brush_velo}           # XYZ
   {% endif %} 


###################################################################################
# _CAT_DIRECT_BRUSH - Bla Bla
#
[gcode_macro _CAT_DIRECT_BRUSH]
description: _CAT_DIRECT_BRUSH - Bla Bla
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions
   {% set cat_safe_z_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_velo %}            # (mm/sec) From Parameters - Gantry Velocity Z Transition
   {% set x_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_zt_zone_limit %}            # (mm) X - safe Z Transit Zone - X Limit
   {% set y_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_zt_zone_limit %}            # (mm) Y - safe Z Transit Zone - Y Limit  
   {% set x_bucket = printer["gcode_macro _CAT_PARAMETERS"].x_bucket %}                          # (mm) From Parameters - Bucket Position X
   {% set y_bucket = printer["gcode_macro _CAT_PARAMETERS"].y_bucket %}                          # (mm) From Parameters - Bucket Position Y
   {% set z_bucket = printer["gcode_macro _CAT_PARAMETERS"].z_bucket %}                          # (mm) From Parameters - Bucket Position Z 
   {% set z_park_purge = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge %}                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Z 
   {% set y_brush = printer["gcode_macro _CAT_PARAMETERS"].y_brush %}                            # (mm) From Parameters - Toolhead Brush Position Y 
   {% set z_brush = printer["gcode_macro _CAT_PARAMETERS"].z_brush %}                            # (mm) From Parameters - Toolhead Brush Position Z 
   {% set xy_brush_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_brush_velo %}                # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Brush Position
   {% set z_brush_velo = printer["gcode_macro _CAT_PARAMETERS"].z_brush_velo %}                  # (mm/sec) From Parameters - Toolhead Brush Position Z  
   {% set x_brush_start = printer["gcode_macro _CAT_PARAMETERS"].x_brush_start %}                # (mm) From Parameters - Toolhead Brush Start Position X 
   {% set x_brush_end = printer["gcode_macro _CAT_PARAMETERS"].x_brush_end %}                    # (mm) From Parameters - Toolhead Brush End Position X 

   {% set act_z_offset = printer.gcode_move.homing_origin.z|float %}                             # Actual GCode Z Offset
   {% set act_z = act_z - act_z_offset %}                                                        # Actual Z w/out Z Offset

   {% if z_brush < cat_safe_z_min %}
      {% set z_brush = cat_safe_z_min %}
   {% endif %}   

   {% if act_z < z_brush %}
      M118 Toolhead under Safe Z Gantry Transit
      #M118 Direct Park Purge Move
      G90                                                              # absolute positioning
      G0 Z{z_brush} F{z_brush_velo}                                    # 
      G0 X{x_brush_start} Y{y_brush} F{xy_brush_velo}                  # XY Park Position
   {% else %}
      #M118 Toolhead above Safe Z Gantry Transit
      #M118 Direct Park Purge Move
      G90                                                              # absolute positioning
      G0 X{x_brush_start} Y{y_brush} Z{z_brush} F{z_brush_velo}        # XYZ
   {% endif %} 

   G90                                                                 # absolute positioning
   G0 X{x_brush_end} Y{y_brush} F{xy_brush_velo}                       # Brush End Position XY
   G0 X{x_brush_start} Y{y_brush} F{xy_brush_velo}                     # Brush Position XY
   G0 X{x_brush_end} Y{y_brush} F{xy_brush_velo}                       # Brush End Position XY
   G0 X{x_brush_start} Y{y_brush} F{xy_brush_velo}                     # Brush Position XY
   G0 X{x_brush_end} Y{y_brush} F{xy_brush_velo}                       # Brush End Position XY
   G0 X{x_brush_start} Y{y_brush} F{xy_brush_velo}                     # Brush Position XY

