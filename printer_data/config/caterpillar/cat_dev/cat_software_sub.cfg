####################################################################################
# Caterpillar Clear Track of all Strips
#
[gcode_macro _CAT_CLEAR_CATERPILLAR_TRACK]
description: Caterpillar Clear Track of all Strips
gcode:
   {% set velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_clear_track_velo %}        # (mm) Strip Clear Out Lenght
   {% set dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_clear_track_dist %}        # (mm/sec) Strip Clear Out Velocity

   #M118 Caterpillar: Clear Purge Track
   _CAT_DISABLE_CONVEYOR_BELT_SYNC
   _CAT_DISABLE_TRACK_SYNC
   G90                                                                                       # absolute positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={dist} VELOCITY={velo}   # Caterpillar Track UnSync - Move Gap


#####################################################################################
# Caterpillar Clear Conveyor Belt of all Strips
#
[gcode_macro _CAT_CLEAR_CONVEYOR_BELT_TRACK]
description: Caterpillar Clear Conveyor Belt of all Strips
gcode:
   {% set velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_clear_conveyor_velo %}            # (mm) From Strip Clear Out Lenght
   {% set dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_clear_conveyor_dist %}            # (mm/sec) Strip Clear Out Velocity

   #M118 Caterpillar: Clear Convyor Track
   _CAT_DISABLE_TRACK_SYNC
   _CAT_DISABLE_CONVEYOR_BELT_SYNC
   G90                                                                                               # absolute positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_conveyor_belt" DISTANCE={dist} VELOCITY={velo}   # 


#####################################################################################
# Engage Caterpillar Track
#
[gcode_macro _CAT_ENABLE_TRACK_SYNC]
description: Engage Caterpillar Track
gcode:
   SYNC_EXTRUDER_MOTION EXTRUDER="caterpillar_track" MOTION_QUEUE=extruder
   

#####################################################################################
# Disengage Caterpillar Track
