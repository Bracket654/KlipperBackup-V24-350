###############################################################################################################
#  _CAT_MM_TIMELAPSE_TEST                                                                                         
#                                                                                                             
[gcode_macro _CAT_MM_TIMELAPSE_TEST]
description: _CAT_MM_TIMELAPSE_TEST 
gcode:


###############################################################################################################
#  _CAT_MM_TIMELAPSE_LAYER_PAUSE                                                                                          
#                                                                                                             
[gcode_macro _CAT_MM_TIMELAPSE_LAYER_PAUSE]
description: _CAT_MM_TIMELAPSE_LAYER_PAUSE
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set x_park = printer["gcode_macro _CAT_PARAMETERS"].x_park|float %}                  # (mm) From Parameters - Toolhead Park Position X
   {% set y_park = printer["gcode_macro _CAT_PARAMETERS"].y_park|float %}                  # (mm) From Parameters - Toolhead Park Position Y
   {% set z_park = printer["gcode_macro _CAT_PARAMETERS"].z_park|float %}                  # (mm) From Parameters - Toolhead Park Position Z 

   {% set park_vars = printer['gcode_macro _MMU_PARK'] %}
   {% set mmu_z_safe_floor = park_vars.min_lifted_z %}

   M118 _CAT_MM_TIMELAPSE_LAYER_PAUSE
   M118 MMU Park Minimum Safe Lift: {mmu_z_safe_floor}
   
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions
   {% set cat_safe_z_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_velo %}            # (mm/sec) From Parameters - Gantry Velocity Z Transition
   {% set x_park_purge = printer["gcode_macro _CAT_PARAMETERS"].x_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position X
   {% set y_park_purge = printer["gcode_macro _CAT_PARAMETERS"].y_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position Y
   {% set z_park_purge = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge %}                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Z 
   {% set xy_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_purge_velo %}      # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position
   {% set xy_park_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_velo %}                  # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position
   {% set z_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge_velo %}        # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position  
   {% set z_park_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_velo %}                    # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position

   {% set print_in_progress = printer["gcode_macro _CAT_PRINT_MODE"].slicer_pre_tool_swap_print_in_progress %}       # 
   {% set timelapse = printer["gcode_macro TIMELAPSE_TAKE_FRAME"].enable %}                      # 

   {% if print_in_progress %}
      #M118 Cat MM Timelapse - Print Enable
      {% if timelapse %}
         #M118 Cat MM Timelapse - Timelapse Enable
         {% set snap_x = 20 %}
         {% if act_x < (max_x / 2) %}
            {% if (act_x + snap_x) > max_x %}
               {% set snap_x = max_x - act_x %}
            {% endif %}
         {% else %}
            {% if (act_x - snap_x) < 0 %}
               {% set snap_x = 0 - act_x %}
            {% endif %}
         {% endif %}

         {% set snap_y = 20 %}
         {% if act_y < (max_y / 2) %}
            {% if (act_y + snap_y) > max_y %}
               {% set snap_y = max_y - act_y %}
            {% endif %}
         {% else %}
            {% if (act_y - snap_y) < 0 %}
               {% set snap_y = 0 - act_y %}
            {% endif %}
         {% endif %}

         {% set snap_z = 20 %}
         {% if (act_z + snap_z) > max_z %}
            {% set snap_z = max_z - act_z %}
         {% endif %}
   
         SAVE_GCODE_STATE NAME=PAUSE                   # save current print position for resume
         BASE_PAUSE                                    # pause print
   
         G91
         M83                                           # relative extruder positioning
         G1 E-0.5 F1500                                # G1 E-0.2 F2000 
         G1 X{snap_x} Y{snap_y} Z{snap_z} F4000        # G1 X20 Y20 Z20 F3000
         G90                                           # use absolute coordinates
         M83                                           # use relative distances for extrusion

         {% set return_x = printer.toolhead.position.x|float %}
         {% set return_y = printer.toolhead.position.y|float %}
         {% set act_z = printer.toolhead.position.z|float %}
         
         {% if z_park_purge < cat_safe_z_min %}
            {% set z_park_purge = cat_safe_z_min %}
         {% endif %}

         {% if z_park_purge < mmu_z_safe_floor %}
            {% set z_park_purge = mmu_z_safe_floor %}
         {% endif %}

         {% if z_park_purge > max_z %}
            {% set z_park_purge = max_z %}
         {% endif %}

         {% if act_z < z_park_purge %}
            M118 Toolhead under Safe Z Gantry Transit
            #M118 Direct Park Purge Move
            G90                                                                         # absolute positioning
            G0 Z{z_park_purge} F{z_park_purge_velo}                                     # 
            G0 X{x_park_purge} Y{y_park_purge} F{xy_park_purge_velo}                    # XY Park Position
         {% else %}
            #M118 Toolhead above Safe Z Gantry Transit
            #M118 Direct Park Purge Move
            G90                                                                         # absolute positioning
            G0 X{x_park_purge} Y{y_park_purge} F{xy_park_purge_velo}                    # XY Park Position
         {% endif %}

         SAVE_GCODE_STATE NAME=PAUSEPARK               # save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
         _CAT_DIRECT_OVER_TRACK
         
         G4 P1000                                      # Dwell
         M118 --------> Cat MM Timelapse - Layers - Take Frame!!!!!!!!
         TIMELAPSE_TAKE_FRAME
         G4 P3000                                       # Dwell
         
         RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
         
         #Move back to XY
         G90                                                                         # absolute positioning
         G0 X{return_x} Y{return_y} F{xy_park_purge_velo}                            # XY Return To Print Position
         
         RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
         BASE_RESUME                                                                  ; resume print
      {% else %}
         #M118 Cat MM Timelapse - Timelapse Disable
      {% endif %}
   {% else %}
      #M118 Cat MM Timelapse - Print Disable
   {% endif %}


###############################################################################################################
#  _CAT_MM_TIMELAPSE                                                                                           
#                                                                                                              
[gcode_macro _CAT_MM_TIMELAPSE]
description: _CAT_MM_TIMELAPSE
variable_skip_init: False
variable_set_state: False
variable_reset_state: True
variable_swaps_state: False
variable_layers_state: False
variable_parts_state: False
variable_start_state: False
variable_init_purge: False
variable_capture_active: False
gcode:
   {% set print_in_progress = printer["gcode_macro _CAT_PRINT_MODE"].cat_timelapse_state_print_in_progress %}       # 
   {% set timelapse = printer["gcode_macro TIMELAPSE_TAKE_FRAME"].enable %}                                         # 

   {% set cat_param_swaps_mode = printer["gcode_macro _CAT_PARAMETERS"].cat_take_frame_swaps_mode %}          # 
   {% set cat_param_layers_mode = printer["gcode_macro _CAT_PARAMETERS"].cat_take_frame_layers_mode %}        # 
   {% set cat_param_parts_mode = printer["gcode_macro _CAT_PARAMETERS"].cat_take_frame_parts_mode %}          # 

   #{% set print_in_progress = True %}       # 
   #{% set timelapse = True %}             

   {% set cat_param_swaps_mode = True %}          # 
   {% set cat_param_layers_mode = True %}         # 
   {% set cat_param_parts_mode = True %}          # 

   {% if print_in_progress %}
      #M118 Cat MM Timelapse - Print Enable
      {% if timelapse %}
         #M118 Cat MM Timelapse - Timelapse Enable
         {% if params.PRINT_START %}
            #M118 --------> Cat MM Timelapse - Start Macro Enable
         {% elif params.PRINT_INT_PURGE %}
            M118 --------> Cat MM Timelapse - Initial Purge - Take Frame!!!!!!!!
            _CAT_DIRECT_OVER_TRACK                         # 
            SAVE_GCODE_STATE NAME=_CAT_TAKE_INIT_FRAME 
            G4 P300                                      # Dwell 
            TIMELAPSE_TAKE_FRAME                           # 
            G4 P300                                     # Dwell 
            RESTORE_GCODE_STATE NAME=_CAT_TAKE_INIT_FRAME
         {% elif params.TAKE_FRAME_SWAPS %}
            M118 --------> Cat MM Timelapse - Swaps - Take Frame!!!!!!!!
            #_CAT_DIRECT_OVER_TRACK                         # 
            #SAVE_GCODE_STATE NAME=_CAT_TAKE_SWAP_FRAME 
            #G4 P300                                      # Dwell 
            #TIMELAPSE_TAKE_FRAME                           # 
            #G4 P300                                       # Dwell 
            #RESTORE_GCODE_STATE NAME=_CAT_TAKE_SWAP_FRAME
         {% elif params.TAKE_FRAME_LAYERS %}
            {% if skip_init %}
               M118 --------> Cat MM Timelapse - Layers - Take Frame!!!!!!!!
               ##PAUSE
               #SAVE_GCODE_STATE NAME=_CAT_TAKE_LAYERS_FRAME 
               #CLEAR_PAUSE   ?
               ##_CAT_DIRECT_OVER_TRACK                         # 
               #TIMELAPSE_TAKE_FRAME                          # 
               #SET_GCODE_VARIABLE MACRO=_CAT_MMU_USER_PAUSE_EXT VARIABLE=take_frame VALUE={ True }
               #SET_GCODE_VARIABLE MACRO=_CAT_MMU_USER_RESUME_EXT VARIABLE=take_frame VALUE={ True }
               #RESTORE_GCODE_STATE NAME=_CAT_TAKE_LAYERS_FRAME
               _CAT_MM_TIMELAPSE_LAYER_PAUSE
            {% else %}
               #M118 --------> Cat MM Timelapse - Skip First Frame!!!!!!!!
               #SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=skip_init VALUE={ True }
            {% endif %}
         {% elif params.TAKE_FRAME_PARTS %}
            #M118 --------> Cat MM Timelapse - Parts - Take Frame!!!!!!!!
            #PAUSE
            #_CAT_DIRECT_OVER_TRACK                         # 
            #TIMELAPSE_TAKE_FRAME                           #  
            #RESUME
         {% elif params.TAKE_FRAME_USER %}
            #M118 --------> Cat MM Timelapse - Requested By User - Take Frame!!!!!!!!
            #PAUSE
            #_CAT_DIRECT_OVER_TRACK                         # 
            #TIMELAPSE_TAKE_FRAME                           #  
            #RESUME
         {% elif params.PRINT_CANCEL %}
            M118 --------> Cat MM Timelapse - Cancel!!!!!!!!
            SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=skip_init VALUE={ False }
            _CAT_DIRECT_OVER_TRACK                         # 
            TIMELAPSE_TAKE_FRAME                           #   
            TIMELAPSE_RENDER
         {% elif params.PRINT_END %}
            M118 --------> Cat MM Timelapse - End!!!!!!!!
            SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=skip_init VALUE={ False }
            _CAT_DIRECT_OVER_TRACK                         # 
            G4 P1000                                      # Dwell 
            TIMELAPSE_TAKE_FRAME                           # 
            G4 P2000                                     # Dwell 
            TIMELAPSE_RENDER
         {% elif params.PRINT_RESET_STATE %}
            #M118 --------> Cat MM Timelapse - Reset
         {% elif params.PRINT_SET_STATE %}
            #M118 --------> Cat MM Timelapse - Set
         {% elif params.SWAPS %}
            #M118 --------> Cat MM Timelapse - Mode: Swaps
         {% elif params.LAYERS %}
            #M118 --------> Cat MM Timelapse - Mode: Layers
         {% elif params.PARTS %}
            #M118 --------> Cat MM Timelapse - Mode: Parts
         {% endif %}
      {% else %}
         #M118 Cat MM Timelapse - Timelapse Disable
      {% endif %}
   {% else %}
      #M118 Cat MM Timelapse - Print Disable
   {% endif %}


###############################################################################################################
#  _CAT_MM_TIMELAPSE                                                                                           
#                                                                                                              
# Use _CAT_MM_TIMELAPSE [_CAT_MM_TIMELAPSE PRINT_RESET_STATE=True] [_CAT_MM_TIMELAPSE PRINT_SET_STATE=True]  
#                       [_CAT_MM_TIMELAPSE SWAPS=True] [_CAT_MM_TIMELAPSE LAYERS=True]                        
#                       [_CAT_MM_TIMELAPSE TAKE_FRAME_PARTS=True] [_CAT_MM_TIMELAPSE PRINT_START=True]         
#                       [_CAT_MM_TIMELAPSE PRINT_INT_PURGE=True] [_CAT_MM_TIMELAPSE TAKE_FRAME_SWAPS=True]     
#                       [_CAT_MM_TIMELAPSE TAKE_FRAME_LAYERS=True] [_CAT_MM_TIMELAPSE TAKE_FRAME_PARTS=True]   
#                       [_CAT_MM_TIMELAPSE PRINT_END=True] [_CAT_MM_TIMELAPSE PRINT_CANCEL=True]  
#
# Take Frame State Mode Select:
#     SWAPS MODE:       [_CAT_MM_TIMELAPSE SWAPS=True] [_CAT_MM_TIMELAPSE SWAPS=False]
#     LAYERS MODE:      [_CAT_MM_TIMELAPSE LAYERS=True] [_CAT_MM_TIMELAPSE LAYERS=False]
#     PARTS MODE:       [_CAT_MM_TIMELAPSE PARTS=True] [_CAT_MM_TIMELAPSE PARTS=False] 
# 
# Macro State Control:
#    START PRINT MACRO (Default State):  [_CAT_MM_TIMELAPSE PRINT_START=True]
#    START PRINT MACRO (Actual State):   [_CAT_MM_TIMELAPSE PRINT_START=True]
#    END PRINT MACRO:                    [_CAT_MM_TIMELAPSE PRINT_END=True]
#    CANCEL PRINT MACRO:                 [_CAT_MM_TIMELAPSE PRINT_CANCEL=True]
#    LAST PURGE BEFORE PRINT START:      [_CAT_MM_TIMELAPSE PRINT_INT_PURGE=True]
#    IN PRINT PURGE FOLLOWING SWAPS:     [_CAT_MM_TIMELAPSE TAKE_FRAME_SWAPS=True]
#    User Request CMD:                   [_CAT_MM_TIMELAPSE TAKE_FRAME_USER=True]
#
# Slicer Options:
#    After Layer change G-code:                  _CAT_MM_TIMELAPSE TAKE_FRAME_LAYERS=True
#    Post Processing Script  (Filament Swaps):   _CAT_MM_TIMELAPSE TAKE_FRAME_SWAPS=True
#    Post Processing Script  (Parts Hops):       _CAT_MM_TIMELAPSE TAKE_FRAME_PARTS=True
# 
[gcode_macro _CAT_MM_TIMELAPSE_]
description: _CAT_MM_TIMELAPSE
variable_set_state: False
variable_reset_state: True
variable_swaps_state: False
variable_layers_state: False
variable_parts_state: False
variable_start_state: False
variable_init_purge: False
variable_capture_active: False
gcode:
   {% set print_in_progress = printer["gcode_macro _CAT_PRINT_MODE"].cat_timelapse_state_print_in_progress %}       # 
   {% set timelapse = printer["gcode_macro TIMELAPSE_TAKE_FRAME"].enable %}                                         # 
   {% set skip_initial_load = printer["gcode_macro _CAT_PRINT_MODE"].slicer_pre_tool_swap_skip_initial_load %}       # 

   {% set cat_param_swaps_mode = printer["gcode_macro _CAT_PARAMETERS"].cat_take_frame_swaps_mode %}          # 
   {% set cat_param_layers_mode = printer["gcode_macro _CAT_PARAMETERS"].cat_take_frame_layers_mode %}        # 
   {% set cat_param_parts_mode = printer["gcode_macro _CAT_PARAMETERS"].cat_take_frame_parts_mode %}          # 

   {% set cat_param_swaps_mode = True %}          # 
   {% set cat_param_layers_mode = True %}         # 
   {% set cat_param_parts_mode = True %}          # 

   {% if reset_state or params.PRINT_RESET_STATE %}
      M118 --------> Cat MM Timelapse - Reset
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=swaps_state VALUE={ cat_param_swaps_mode }          # 
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=layers_state VALUE={ cat_param_layers_mode }        # 
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=parts_state VALUE={ cat_param_parts_mode }          # 
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=reset_state VALUE={ False }                         # 
      {% set set_state = True %}
   {% endif %}

   {% if set_state or params.PRINT_SET_STATE %}
      M118 --------> Cat MM Timelapse - Set
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=start_state VALUE={ False }        # 
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=init_purge VALUE={ False }         # 
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=set_state VALUE={ False }          #
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=capture_active VALUE={ False }     # 
   {% endif %}

   {% if params.SWAPS %}
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=swaps_state VALUE={ params.SWAPS }         # 
   {% endif %}
   {% if params.LAYERS %}
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=layers_state VALUE={ params.LAYERS }       # 
   {% endif %}
   {% if params.PARTS %}
      SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=parts_state VALUE={ params.PARTS }         # 
   {% endif %}

   {% if print_in_progress %}
      #M118 Cat MM Timelapse - Print Enable
      {% if timelapse %}
         #M118 Cat MM Timelapse - Timelapse Enable
         {% if params.PRINT_START %}
            SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=start_state VALUE={ True }                         # 
            M118 --------> Cat MM Timelapse - Start Macro Enable
         {% endif %}
         {% if params.PRINT_INT_PURGE and start_state %}
            M118 --------> Cat MM Timelapse - Initial Purge Completed!!!!!!!!
            SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=capture_active VALUE={ True }                      # 
            #SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=init_purge VALUE={ params.PRINT_INT_PURGE }        # 
            SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=init_purge VALUE={ True }        # 
            #_CAT_DIRECT_OVER_TRACK                         # 
            #TIMELAPSE_TAKE_FRAME                           # 
         {% endif %}
         {% if params.TAKE_FRAME_SWAPS and swaps_state and capture_active %}
            M118 --------> Cat MM Timelapse - Swaps - Take Frame!!!!!!!!
            _CAT_DIRECT_OVER_TRACK                         # 
            TIMELAPSE_TAKE_FRAME                           # 
         {% endif %}
         {% if params.TAKE_FRAME_LAYERS and layers_state and capture_active %}
            {% if skip_initial_load == False %}
               #M118 --------> Cat MM Timelapse - Layers - Take Frame!!!!!!!!
               #PAUSE
               #_CAT_DIRECT_OVER_TRACK                         # 
               #TIMELAPSE_TAKE_FRAME                           # 
               #RESUME
            {% endif %}
         {% endif %}
         {% if params.TAKE_FRAME_PARTS and parts_state and capture_active %}
            M118 --------> Cat MM Timelapse - Parts - Take Frame!!!!!!!!
            PAUSE
            _CAT_DIRECT_OVER_TRACK                         # 
            TIMELAPSE_TAKE_FRAME                           #  
            RESUME
         {% endif %}
            {% if params.TAKE_FRAME_USER and capture_active %}
            M118 --------> Cat MM Timelapse - Requested By User - Take Frame!!!!!!!!
            PAUSE
            _CAT_DIRECT_OVER_TRACK                         # 
            TIMELAPSE_TAKE_FRAME                           #  
            RESUME
         {% endif %}
         {% if (params.PRINT_CANCEL or params.PRINT_END) and start_state %}
            M118 --------> Cat MM Timelapse - Cancel or End!!!!!!!!
            SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=start_state VALUE={ False }        # 
            SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=init_purge VALUE={ False }         # 
            SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=set_state VALUE={ False }          #
            SET_GCODE_VARIABLE MACRO=_CAT_MM_TIMELAPSE VARIABLE=capture_active VALUE={ False }     # 
            _CAT_DIRECT_OVER_TRACK                         # 
            TIMELAPSE_TAKE_FRAME                           #   
            TIMELAPSE_RENDER
         {% endif %}
      {% else %}
         #M118 Cat MM Timelapse - Timelapse Disable
      {% endif %}
   {% else %}
      #M118 Cat MM Timelapse - Print Disable
   {% endif %}


#####################################################################################
# _CAT_PRINT_MODE
# 
# 
[gcode_macro _CAT_PRINT_MODE]
description: _CAT_PRINT_MODE
variable_print_in_progress: False
variable_slicer_pre_tool_swap_print_in_progress: False
variable_slicer_pre_tool_swap_skip_initial_load: True
variable_direct_purge_print_in_progress: False
variable_mmu_user_pre_load_print_in_progress: False
variable_mmu_user_pre_load_skip_initial_load: True
variable_mmu_user_post_load_print_in_progress: False
variable_cat_timelapse_state_print_in_progress: False
gcode:
   {% if print_in_progress %}
      M118 Print Mode: print_in_progress
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=slicer_pre_tool_swap_print_in_progress VALUE={ True }     # Enable Print In Progress - (Stop Gap Macro)
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=slicer_pre_tool_swap_skip_initial_load VALUE={ True }     # Enable Skip Hop on Initial Tool Load (Stop Gap Macro)
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=direct_purge_print_in_progress VALUE={ True }             # Enable Print In Progress - Purge Exit Mode
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=mmu_user_pre_load_print_in_progress VALUE={ True }        # Enable Print In Progress - Purge Calculation Setting
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=mmu_user_pre_load_skip_initial_load VALUE={ True }        # Enable Print In Progress
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=mmu_user_post_load_print_in_progress VALUE={ True }       # Enable Print In Progress
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=cat_timelapse_state_print_in_progress VALUE={ True }      # Enable Timelapse - Print In Progress
   {% else %} 
      M118 Print Mode: Print Completed or Cancel
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=slicer_pre_tool_swap_print_in_progress VALUE={ False }    # Disable Print In Progress - (Stop Gap Macro)
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=slicer_pre_tool_swap_skip_initial_load VALUE={ True }     # Reset Skip Hop on Initial Tool Load (Stop Gap Macro) 
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=direct_purge_print_in_progress VALUE={ False }            # Disable Print In Progress - Purge Exit Mode
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=mmu_user_pre_load_print_in_progress VALUE={ False }       # Disable Print In Progress - Purge Calculation Setting
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=mmu_user_pre_load_skip_initial_load VALUE={ True }        # Disable Print In Progress
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=mmu_user_post_load_print_in_progress VALUE={ False }      # Disable Print In Progress
      SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=cat_timelapse_state_print_in_progress VALUE={ False }     # Enable Print In Progress
   {% endif %}


#####################################################################################
# _CAT_SLICER_PRE_TOOL_SWAP
# Insert This Macro just before Tool Swap cmd into your slicer
# 
[gcode_macro _CAT_SLICER_PRE_TOOL_SWAP]
description: _CAT_SLICER_PRE_TOOL_SWAP
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set x_park = printer["gcode_macro _CAT_PARAMETERS"].x_park|float %}                  # (mm) From Parameters - Toolhead Park Position X
   {% set y_park = printer["gcode_macro _CAT_PARAMETERS"].y_park|float %}                  # (mm) From Parameters - Toolhead Park Position Y
   {% set z_park = printer["gcode_macro _CAT_PARAMETERS"].z_park|float %}                  # (mm) From Parameters - Toolhead Park Position Z 
   {% set xy_brush_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_brush_velo %}                # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Brush Position   
   {% set x_brush_start = printer["gcode_macro _CAT_PARAMETERS"].x_brush_start %}                # (mm) From Parameters - Toolhead Brush Start Position X 
   {% set x_brush_end = printer["gcode_macro _CAT_PARAMETERS"].x_brush_end %}                    # (mm) From Parameters - Toolhead Brush End Position X 
   
   {% set print_in_progress = printer["gcode_macro _CAT_PRINT_MODE"].slicer_pre_tool_swap_print_in_progress %}       # 
   {% set skip_initial_load = printer["gcode_macro _CAT_PRINT_MODE"].slicer_pre_tool_swap_skip_initial_load %}       # 
   
   M118 skip_initial_Load: {skip_initial_load}

   {% set snap_x = 20 %}
   {% if act_x < (max_x / 2) %}
      {% if (act_x + snap_x) > max_x %}
         {% set snap_x = max_x - act_x %}
      {% endif %}
   {% else %}
      {% if (act_x - snap_x) < 0 %}
         {% set snap_x = 0 - act_x %}
      {% endif %}
   {% endif %}

   {% set snap_y = 20 %}
   {% if act_y < (max_y / 2) %}
      {% if (act_y + snap_y) > max_y %}
         {% set snap_y = max_y - act_y %}
      {% endif %}
   {% else %}
      {% if (act_y - snap_y) < 0 %}
         {% set snap_y = 0 - act_y %}
      {% endif %}
   {% endif %}

   {% set snap_z = 20 %}
   {% if (act_z + snap_z) > max_z %}
      {% set snap_z = max_z - act_z %}
   {% endif %}

   {% if print_in_progress %}
      {% if skip_initial_load %}
         M118 Skip Hop on Initial Tool Load
         SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=slicer_pre_tool_swap_skip_initial_load VALUE={ False }    # Disable Skip Hop on Initial Tool Load (Stop Gap Macro) 
      {% else %} 
         M118 Cat Hop Tool Swap!!!!!!!!!!!!!!!!!!!!!!!!!!!!
         G91
         G1 E-0.5 F1500                           # G1 E-0.2 F2000 
         G1 X{snap_x} Y{snap_y} Z{snap_z} F4000   # G1 X20 Y20 Z20 F3000
         G90                                      # use absolute coordinates
         M83                                      # use relative distances for extrusion
      {% endif %}
   {% endif %}


