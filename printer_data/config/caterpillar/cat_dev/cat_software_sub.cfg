   M118 Timelapse: _CAT_MM_TIMELAPSE_TAKE_FRAME_PURGE


#####################################################################################
# _CAT_PURGE_PRE_CAL
#
# https://github.com/AndrewEllis93/Print-Tuning-Guide/blob/main/articles/determining_max_volumetric_flow_rate.md
# mm3 = mm * 2.4    (Or, inversely)   mm = mm^3 / 2.4
#
[gcode_macro _CAT_PURGE_PRE_CAL]
description: _CAT_PURGE_PRE_CAL
variable_purge_length_minimum: 30
variable_purge_length_maximum: 150
variable_purge_length: 150
variable_purge_length_modifier: 1.5
variable_purge_length_addition: 0

variable_cat_strip_dist: 35
variable_cat_strip_qty: 11
variable_cat_strip_max_qty: 15
variable_cat_strip_min_qty: 2
variable_cat_purge_volume_adj: 1.0
gcode:
   {% set park_vars = printer['gcode_macro _MMU_PARK'] %}
   {% set filament_diameter = printer.configfile.config.extruder.filament_diameter|float %}
   {% set filament_cross_section = (filament_diameter/2) ** 2 * 3.1415 %}
   {% set from_tool = printer.mmu.last_tool %}
   {% set to_tool = printer.mmu.tool %}
   {% set pos = printer.gcode_move.gcode_position %}
   {% set safe = printer['gcode_macro _BLOBIFIER_SAFE_DESCEND'] %}

   ###########################################################   
   {% set strip_dist = cat_strip_dist|float %}
   {% set strip_qty = cat_strip_qty|int %}
   {% set strip_min_qty = cat_strip_min_qty|int %}
   {% set strip_max_qty = cat_strip_max_qty|int %}
   {% set purge_volume_adj = cat_purge_volume_adj|float %}
   {% set purge_volume_to_cat = 0 %}


   #MMU_CALC_PURGE_VOLUMES SOURCE=gatemap MULTIPLIER=1.1
   #MMU_SLICER_TOOL_MAP PURGE_MAP=1

   #{% set from_tool = 3 %}
   #M118 from_tool: {from_tool}
   #{% set to_tool = 1 %}
   #M118 to_tool: {to_tool}
   
   M118 MMU Purge Calculation:
   ###########################################################  Get Purge Volume From MMU   ############################################# <-------------------------------------------------------------------------------------------------   
   # Get purge volumes from the slicer (if set up right. see 
   # https://github.com/moggieuk/Happy-Hare/wiki/Gcode-Preprocessing)
   {% set pv = printer.mmu.slicer_tool_map.purge_volumes %}
    
   # ======================================================================================
   # ==================== DETERMINE PURGE LENGTH ==========================================
   # ======================================================================================

   {% if params.PURGE_LENGTH %} # =============== PARAM PURGE LENGTH ======================
      {action_respond_info("BLOBIFIER: param PURGE_LENGTH provided")}
      {% set purge_len = params.PURGE_LENGTH|float %}
   {% elif from_tool == to_tool and to_tool >= 0 %} # ==== TOOL DIDN'T CHANGE =============
      {action_respond_info("BLOBIFIER: Tool didn't change (T%s > T%s), %s" % (from_tool, to_tool, "priming" if purge_length_minimum else "skipping"))}
      {% set purge_len = 0 %}

   {% elif pv %} # ============== FETCH FROM HAPPY HARE (LIKELY FROM SLICER) ==============
      {% if from_tool < 0 and to_tool >= 0%}
         {action_respond_info("BLOBIFIER: from tool unknown. Finding largest value for T? > T%d" % to_tool)}
         {% set purge_vol = pv|map(attribute=to_tool)|max %}
      {% elif to_tool < 0 %}
         {action_respond_info("BLOBIFIER: tool(s) unknown. Finding largest value")}
         {% set purge_vol = pv|map('max')|max %}
      {% else %}
         {% set purge_vol = pv[from_tool][to_tool]|float * purge_length_modifier %}
         {action_respond_info("BLOBIFIER: Swapped T%s > T%s" % (from_tool, to_tool))}
      {% endif %}
      {% set purge_len = purge_vol / filament_cross_section %}

      {% set purge_len = purge_len + printer.mmu.extruder_filament_remaining + park_vars.retracted_length + purge_length_addition %}

   {% else %} # ========================= USE CONFIG VARIABLE =============================
      {action_respond_info("BLOBIFIER: No toolmap or PURGE_LENGTH. Using default")}
      {% set purge_len = purge_length|float + printer.mmu.extruder_filament_remaining + park_vars.retracted_length %}
   {% endif %}

   # ==================================== APPLY PURGE MINIMUM =============================
   {% set purge_len = [purge_len,purge_length_minimum]|max|round(0, 'ceil')|int %}
   {action_respond_info("BLOBIFIER: Purging %dmm of filament" % (purge_len))}   

   {% set purge_volume_req = (purge_len * 2.4)|round(3) %}
   M118 From MMU: Individual Strip Lenght: {purge_len} mm   Individual Lenght Volume: {purge_volume_req} mm^3

   #######################################################################################################################################################

   M118 Caterpillar Purge Calculation:

   {% set purge_volume = purge_volume_req|float %}
   {% set strip_qty = ((purge_volume / 2.4) / strip_dist) %}
   {% set strip_qty = ((purge_volume / 2.4) / strip_dist)|round|int %}
   M118 Purge Volume Requested: {purge_volume|round(3)} mm^3   Total Purge Lenght: {(purge_volume / 2.4)|round(3)} mm    Number Of Strip for Requested Volume: {strip_qty}
   
   {% set purge_volume = (purge_volume * purge_volume_adj)|float %}
   {% set strip_qty = ((purge_volume / 2.4) / strip_dist) %}
   {% set strip_qty = ((purge_volume / 2.4) / strip_dist)|round|int %}
   M118 Purge Volume Requested: {purge_volume|round(3)} mm^3   Total Purge Lenght: {(purge_volume / 2.4)|round(3)} mm    Number Of Strip for Requested Volume: {strip_qty}
   {% set strip_qty_req = strip_qty %}

   M118 Strip Requested Number: {strip_qty_req}  Minimum Volume: {(strip_qty_req * (strip_dist * 2.4))|round(3)} mm^3
   M118 Strip Minimum Number: {strip_min_qty}  Minimum Volume: {(strip_min_qty * (strip_dist * 2.4))|round(3)} mm^3
   M118 Strip Maximum Number: {strip_max_qty}  Maximum Volume: {(strip_max_qty * (strip_dist * 2.4))|round(3)} mm^3

   {% set purge_volume_to_cat = 0 %}
   {% if strip_qty < strip_min_qty %}
      {% set strip_qty = strip_min_qty %}
      {% set purge_volume_to_cat = (strip_qty * (strip_dist * 2.4))|float %}
      M118 Number Of Strip: {strip_qty}    Lenght To Caterpillar: {(strip_qty * strip_dist)|round(3)}   Volume To Caterpillar: {(strip_qty * (strip_dist * 2.4))|round(3)} mm^3
   {% elif strip_qty > strip_max_qty %}
      {% set strip_qty = strip_max_qty %}
      {% set purge_volume_to_cat = (strip_qty * (strip_dist * 2.4))|float %}
      M118 Number Of Strip: {strip_qty}    Lenght To Caterpillar: {(strip_qty * strip_dist)|round(3)}   Volume To Caterpillar: {(strip_qty * (strip_dist * 2.4))|round(3)} mm^3
   {% else %}
      {% set purge_volume_to_cat = (strip_qty * (strip_dist * 2.4))|float %}
      M118 Number Of Strip: {strip_qty}    Lenght To Caterpillar: {(strip_qty * strip_dist)|round(3)}   Volume To Caterpillar: {(strip_qty * (strip_dist * 2.4))|round(3)} mm^3
   {% endif %}

   {% set strip_qty = (strip_qty + 0) %}

   M118 Number Of Strip Requested: {strip_qty_req}       Number Of Strip Calculated: {strip_qty}

   SET_GCODE_VARIABLE MACRO=_CAT_PURGE_PRE_CAL VARIABLE=cat_strip_qty VALUE={strip_qty}              # 
   {% set purge_volume_to_cat = (strip_qty * (strip_dist * 2.4))|float %}
   M118 Total Number Of Strip to Caterpillar: {strip_qty}    Total Lenght To Caterpillar: {(strip_qty * strip_dist)|round(3)}   Total Volume To Caterpillar: {(strip_qty * (strip_dist * 2.4))|round(3)} mm^3


#####################################################################################
# Homing XYZ
#
[gcode_macro _CAT_HOMING]
description: BlaBla
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions
   {% set cat_safe_z_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_velo %}            # (mm/sec) From Parameters - Gantry Velocity Z Transition
   {% set x_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_zt_zone_limit %}            # (mm) X - safe Z Transit Zone - X Limit
   {% set y_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_zt_zone_limit %}            # (mm) Y - safe Z Transit Zone - Y Limit   
   {% set x_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_gantry_zone_limit %}    # (mm) X - safe Z Transit Zone - X Limit   
   {% set y_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_gantry_zone_limit %}    # (mm) Y - safe Z Transit Zone - Y Limit     
   {% set x_park = printer["gcode_macro _CAT_PARAMETERS"].x_park %}                              # (mm) From Parameters - Toolhead Park Position X
   {% set y_park = printer["gcode_macro _CAT_PARAMETERS"].y_park %}                              # (mm) From Parameters - Toolhead Park Position Y
   {% set z_park = printer["gcode_macro _CAT_PARAMETERS"].z_park %}                              # (mm) From Parameters - Toolhead Park Position Z 
   {% set xy_park_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_velo %}                  # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position
   {% set z_park_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_velo %}                    # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position
 
   {% if "z" not in printer.toolhead.homed_axes %}            # Conditional G28 Z (home if not already homed)
      G28                                                     # 
   {% else %}
      M118 Z Already Homed
      {% if act_z < cat_safe_z_min %}
         M118 Toolhead under Safe Z Gantry Transit            # 
         G91                                                  # 
         G1 Z{cat_safe_z_min} F{z_park_velo}                  # 
         G90                                                  # 
         G28                                                  # 
      {% else %}
         #M118 Toolhead above Safe Z Gantry Transit
         G28                                                  # 
      {% endif %}
   {% endif %}  


#####################################################################################
# Conditional Homing XYZ
#
[gcode_macro _CAT_C_HOMING]
description: BlaBla
gcode:
   {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}  # Conditional G28 (home if not already homed)
      _CAT_HOMING
   {% else %}
      M118 Already Fully Homed
   {% endif %}


#####################################################################################
# CALIBRATE_Z
#
[gcode_macro _CAT_CALIBRATE_Z]
description: BlaBla
gcode:
   {% set act_z = printer.toolhead.position.z|float %}
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions
   {% set z_park_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_velo %}                    # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position

   _CAT_C_HOMING
   _CAT_C_QGL
   
   {% if "z" not in printer.toolhead.homed_axes %}            # Conditional G28 Z (home if not already homed)
      G28                                                     # 
   {% else %}
      M118 Z Already Homed
      {% if act_z < cat_safe_z_min %}
         M118 Toolhead under Safe Z Gantry Transit            # 
         G91                                                  # 
         G1 Z{cat_safe_z_min} F{z_park_velo}                  # 
         G90                                                  # 
         G0 X175.5 Y175.5 F3000                               # Move Center of Bed
      {% else %}
         #M118 Toolhead above Safe Z Gantry Transit
         G0 X175.5 Y175.5 F3000                               # Move Center of Bed
      {% endif %}
   {% endif %}  

   #PROBE_CALIBRATE
   PROBE_ACCURACY
   #G28 Z


#####################################################################################
# Conditional CALIBRATE_Z (CALIBRATE_Z if Z not calibrated)
#
[gcode_macro _CAT_C_CALIBRATE_Z]
description: BlaBla
gcode:
   {% if printer.z_calibration.last_query != True %}
      _CAT_CALIBRATE_Z
   {% else %}
      M118 Calibrate Z Already Completed
   {% endif %}


#####################################################################################
# Quad Gantry Level
#
[gcode_macro _CAT_QGL]
description: BlaBla
gcode:
   _CAT_C_HOMING
   QUAD_GANTRY_LEVEL
   G28 Z
   

#####################################################################################
# Conditional Quad Gantry Level
#
[gcode_macro _CAT_C_QGL]
description: BlaBla
gcode:
    {% if printer.quad_gantry_level.applied == False %}
       _CAT_QGL
    {% else %}
       M118 Quad Gantry Level Already Completed
    {% endif %}


#####################################################################################
# Minimum Caterpillar Conditional Status
#
[gcode_macro _CAT_C_MIN_STATE]
description: _CAT_C_MIN_STATE
gcode:
   {% if (printer.quad_gantry_level.applied == False) or ("x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes)   %}
      {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
         _CAT_HOMING
      {% endif %}
      {% if printer.quad_gantry_level.applied == False %}
         _CAT_QGL
      {% endif %}
   {% endif %}


#####################################################################################
# _CAT_PURGE_Z_OFFSET
#
#
[gcode_macro _CAT_PURGE_Z_OFFSET]
description: _CAT_PURGE_Z_OFFSET
gcode:
   {% set strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_dist|float %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Lenght
   {% set strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_velo|float %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Velocity
   {% set exit_strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_dist|float %}        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Lenght
   {% set exit_strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_velo|float %}        # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Velocity 
   {% set strip_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo|float %}                          # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity 
   {% set strip_velo_slow = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo_slow|float %}                # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity Slow
   {% set retract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_dist|float %}                      # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance
   {% set retract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_velo|float %}                      # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity
   {% set z_purge_belt = printer["gcode_macro _CAT_PARAMETERS"].cat_z_purge_belt|float %}                      # (mm) From Parameters - Toolhead Purge Position Z - The Toolhead resting on the Surface of the Caterpillar Track (GT2 Belt) - Also see: variable_cat_z_tool_gap_dist
   {% set z_tool_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_z_tool_gap_dist|float %}                # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Gap Toolhead to Track(GT2 Belt)
   {% set z_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_z_purge_velo|float %}                      # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position
   {% set unretract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_dist|float %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Distance 
   {% set unretract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_velo|float %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity 
   {% set zhop_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_dist|float %}                            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Distance  
   {% set zhop_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_velo|float %}                            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Velocity
   {% set retract_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_dist|float %}            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance Exit
   {% set retract_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_velo|float %}            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Exit
   {% set zhop_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_dist|float %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Distance 
   {% set zhop_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_velo|float %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Velocity
   {% set part_fan_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_part_fan_velo|float %}                    # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Part Fan Velocity 
   
   ##### Set Relative Position for Purge Considering Gcode Z Offset #####
   {% set act_z_offset = printer.gcode_move.homing_origin.z|float %}                                           # Actual GCode Z Offset
   {% set z_purge = ((z_purge_belt + z_tool_gap_dist) - act_z_offset)|round(3) %}                              # 

   G90
   G0 Z{z_purge} F{z_purge_velo}                                                                               # Z Purge distance from Track (GT2 Timing Belt)
   M118 Purge Z-Offset: {z_purge}mm


#####################################################################################
# _CAT_PART_FAN_SAFE_STATE
# 
#
[gcode_macro _CAT_PART_FAN_SAFE_STATE]
description: _CAT_PART_FAN_SAFE_STATE
gcode:
   {% set part_fan_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_part_fan_velo|float %}                    # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Part Fan Velocity 

   SET_GCODE_VARIABLE MACRO=_CAT_PARAMETERS VARIABLE=cat_op_backup_part_fan_velo VALUE={printer.fan.speed}     # 
   M118 Save Print Fan Flow: {(printer.fan.speed * 100)|round(0)}%                                             # 
   M106 S{part_fan_velo * 255}                                                                                 # 
   M118 Set Purge Fan Flow to: {(part_fan_velo * 100)|round(0)}%                                               # 


#####################################################################################
# _CAT_PART_FAN_RESUME_STATE
#
#
[gcode_macro _CAT_PART_FAN_RESUME_STATE]
description: _CAT_PART_FAN_RESUME_STATE
gcode:
   {% set part_fan_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_op_backup_part_fan_velo %}                # 
   
   M106 S{(part_fan_velo * 255)|int}                                                                           # 
   M118 Set Print Part Fan Flow to: {(part_fan_velo * 100)|round(0)}%                                          # 


#####################################################################################
# _CAT_EXTRUSION_FACTOR_SAFE_STATE
# M221 - Set Flow Percentage
#
[gcode_macro _CAT_EXTRUSION_FACTOR_SAFE_STATE]
description: _CAT_EXTRUSION_FACTOR_SAFE_STATE
gcode:
   {% set op_backup_extrusion_factor = printer.gcode_move.extrude_factor %}                                                                  # 
   
   M118 Save Extrusion Factor State to: {(op_backup_extrusion_factor * 100)|int}%
   SET_GCODE_VARIABLE MACRO=_CAT_EXTRUSION_FACTOR_RESUME_STATE VARIABLE=op_backup_extrusion_factor VALUE={op_backup_extrusion_factor}        #    
   M221 S100                                                                                                                                 #
   M118 Set Extrusion Factor to: 100%                                                                                                        #


#####################################################################################
# _CAT_EXTRUSION_FACTOR_RESUME_STATE
# M221 - Set Flow Percentage
#
[gcode_macro _CAT_EXTRUSION_FACTOR_RESUME_STATE]
description: _CAT_EXTRUSION_FACTOR_RESUME_STATE
variable_op_backup_extrusion_factor: 100
gcode:
   ##### Reset Extrusion Factor To Pre-Purge Setting #####
   M221 S{(op_backup_extrusion_factor * 100)|int}                                                                 #
   M118 Set Extrusion Factor to: {(op_backup_extrusion_factor * 100)|int}%                                        # 
   {% set op_backup_extrusion_factor = 100 %}                                                                     #


