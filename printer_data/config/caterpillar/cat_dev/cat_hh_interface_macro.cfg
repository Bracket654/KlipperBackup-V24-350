#####################################################################################
# mmu_macro_vars.cfg
# MOVEMENT
# user_pre_load_extension
# 
# _CAT_MMU_USER_PRE_LOAD_EXT
# 
[gcode_macro _CAT_MMU_USER_PRE_LOAD_EXT]
description: mmu_macro_vars.cfg - MOVEMENT - user_pre_load_extension
gcode: 
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set x_park = printer["gcode_macro _CAT_PARAMETERS"].x_park %}                              # (mm) From Parameters - Toolhead Park Position X
   {% set y_park = printer["gcode_macro _CAT_PARAMETERS"].y_park %}                              # (mm) From Parameters - Toolhead Park Position Y
   {% set z_park = printer["gcode_macro _CAT_PARAMETERS"].z_park %}                              # (mm) From Parameters - Toolhead Park Position Z 
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions
   {% set x_park_purge = printer["gcode_macro _CAT_PARAMETERS"].x_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position X
   {% set y_park_purge = printer["gcode_macro _CAT_PARAMETERS"].y_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position Y
   {% set z_park_purge = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge %}                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Z 
   {% set xy_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_purge_velo %}      # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position
   {% set xy_park_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_velo %}                  # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position
   {% set z_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge_velo %}        # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position 

   {% set print_in_progress = printer["gcode_macro _CAT_PRINT_MODE"].mmu_user_pre_load_print_in_progress %}       # 
   {% set skip_initial_load = printer["gcode_macro _CAT_PRINT_MODE"].mmu_user_pre_load_skip_initial_load %}       # 

   M118 mmu_macro_vars.cfg - MOVEMENT - user_pre_load_extension
   M118 _CAT_MMU_USER_PRE_LOAD_EXT

   {% if z_park_purge < cat_safe_z_min %}
      {% set z_park_purge = cat_safe_z_min %}
   {% endif %}

   {% set act_z_offset = printer.gcode_move.homing_origin.z|float %}                             # Actual GCode Z Offset
   {% set act_z = act_z - act_z_offset %}                                                        # Actual Z w/out Z Offset

   {% if act_x == x_park_purge and act_y == y_park_purge and act_z == z_park_purge %}            # Toolhead Already in Park Purge Position?     
      M118 Toolhead is Already Park Over Track
   {% else %}
      _CAT_DIRECT_OVER_TRACK
   {% endif %}
   
   _CAT_PART_FAN_SAFE_STATE
   _CAT_EXTRUSION_FACTOR_SAFE_STATE
   _CAT_SPEED_FACTOR_SAFE_STATE

   {% if print_in_progress %}
      M118 Print In Progress
      {% if skip_initial_load %}
         M118 skip initial load CAT MMU USER PRE LOAD EXT
         #SET_GCODE_VARIABLE MACRO=_MMU_PARK VARIABLE=min_lifted_z VALUE=0
         #_MMU_UPDATE_HEIGHT
         #_MMU_SAVE_POSITION
         SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=mmu_user_pre_load_skip_initial_load VALUE={ False }        # Disable Skip Initial Load
      {% endif %}
      MMU_SLICER_TOOL_MAP PURGE_MAP=1
   {% else %}
      M118 Print Not In Progress
      M118 MMU Purge Volume Calculations From MMU
      MMU_CALC_PURGE_VOLUMES SOURCE=gatemap MULTIPLIER=1.6
      MMU_SLICER_TOOL_MAP PURGE_MAP=1
   {% endif %}

   _CAT_PURGE_PRE_CAL                                                                           # 


