#####################################################################################
# mmu_macro_vars.cfg
# Print Start
# user_pre_initialize_extension
# 
# _CAT_MMU_START
# 
[gcode_macro _CAT_MMU_START]
description: mmu_macro_vars.cfg - Print Start - user_pre_initialize_extension
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set x_park = printer["gcode_macro _CAT_PARAMETERS"].x_park|float %}                  # (mm) From Parameters - Toolhead Park Position X
   {% set y_park = printer["gcode_macro _CAT_PARAMETERS"].y_park|float %}                  # (mm) From Parameters - Toolhead Park Position Y
   {% set z_park = printer["gcode_macro _CAT_PARAMETERS"].z_park|float %}                  # (mm) From Parameters - Toolhead Park Position Z

   M118 mmu_macro_vars.cfg - Print Start - user_pre_initialize_extension
   M118 _CAT_MMU_START

   _CAT_C_MIN_STATE

   {% set act_z_offset = printer.gcode_move.homing_origin.z|float %}                                 # Actual GCode Z Offset
   {% set act_z = act_z - act_z_offset %}                                                            # Actual Z w/out Z Offset

   {% if act_x == x_park and act_y == y_park and act_z == z_park %}                                  # Toolhead Already in Park Position?     
      M118 Toolhead is Already Parked
   {% else %} 
      M118 Move To Park Position
      _CAT_DIRECT_PARK
   {% endif %}

   M118 MMU Purge Volume Calculations From MMU
   MMU_CALC_PURGE_VOLUMES SOURCE=gatemap MULTIPLIER=1.6
   MMU_SLICER_TOOL_MAP PURGE_MAP=1

   SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=print_in_progress VALUE={ True }                # 
   _CAT_PRINT_MODE

   _CAT_MM_TIMELAPSE PRINT_SET_STATE=True PRINT_START=True

   BED_MESH_PROFILE LOAD=default

   CHAMBER_OP_TEMP                                                                                  # HVAC Ready To Print   

   #MMU_START_LOAD_INITIAL_TOOL

   _CAT_DIRECT_PRE_PRINT_PURGE


#####################################################################################
# mmu_macro_vars.cfg
# Print End
# user_print_end_extension
# 
# _CAT_MMU_END
# 
[gcode_macro _CAT_MMU_END]
description: mmu_macro_vars.cfg - Print End - user_print_end_extension
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set x_park = printer["gcode_macro _CAT_PARAMETERS"].x_park|float %}                  # (mm) From Parameters - Toolhead Park Position X
   {% set y_park = printer["gcode_macro _CAT_PARAMETERS"].y_park|float %}                  # (mm) From Parameters - Toolhead Park Position Y
   {% set z_park = printer["gcode_macro _CAT_PARAMETERS"].z_park|float %}                  # (mm) From Parameters - Toolhead Park Position Z 
   {% set xy_brush_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_brush_velo %}                # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Brush Position  
   {% set y_brush = printer["gcode_macro _CAT_PARAMETERS"].y_brush %}                            # (mm) From Parameters - Toolhead Brush Position Y 
   {% set x_brush_start = printer["gcode_macro _CAT_PARAMETERS"].x_brush_start %}                # (mm) From Parameters - Toolhead Brush Start Position X 
   {% set x_brush_end = printer["gcode_macro _CAT_PARAMETERS"].x_brush_end %}                    # (mm) From Parameters - Toolhead Brush End Position X 

   M118 mmu_macro_vars.cfg - Print End - user_print_end_extension
   M118 _CAT_MMU_END

   {% set act_z_offset = printer.gcode_move.homing_origin.z|float %}                       # Actual GCode Z Offset
   {% set act_z = act_z - act_z_offset %}                                                  # Actual Z w/out Z Offset

   {% set snap_x = 10 %}
   {% if act_x < (max_x / 2) %}
      {% if (act_x + snap_x) > max_x %}
         {% set snap_x = max_x - act_x %}
      {% endif %}
   {% else %}
      {% if (act_x - snap_x) < 0 %}
         {% set snap_x = 0 - act_x %}
      {% endif %}
   {% endif %}

   {% set snap_y = 10 %}
   {% if act_y < (max_y / 2) %}
      {% if (act_y + snap_y) > max_y %}
         {% set snap_y = max_y - act_y %}
      {% endif %}
   {% else %}
      {% if (act_y - snap_y) < 0 %}
         {% set snap_y = 0 - act_y %}
      {% endif %}
   {% endif %}

   {% set snap_z = 10 %}
   {% if (act_z + snap_z) > max_z %}
      {% set snap_z = max_z - act_z %}
   {% endif %}

   {% if act_x == x_park and act_y == y_park and act_z == z_park %}                        # Toolhead Already in Park Position?     
      M118 Toolhead is Already Parked
   {% else %} 
      M118 Brush and Park Position
      G91
      G1 E-0.5 F1500                                  # G1 E-0.2 F2000 
      G1 X{snap_x} Y{snap_y} Z{snap_z} F4000          # G1 X20 Y20 Z20 F3000
      G90                                             # use absolute coordinates
      M83                                             # use relative distances for extrusion

      G90 
      G0 X{x_brush_start} Y{y_brush} F{xy_brush_velo}                  # XY Park Brush Position
      _CAT_DIRECT_BRUSH
   {% endif %}

   _CAT_MM_TIMELAPSE PRINT_END=True

   SET_GCODE_VARIABLE MACRO=_CAT_PRINT_MODE VARIABLE=print_in_progress VALUE={ False }             # 
   _CAT_PRINT_MODE

   VENT_CHAMBER                                                                                    # HVAC Venting Chamber

   G90                                                                                             # Absolute Positioning


