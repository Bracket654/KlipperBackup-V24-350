[gcode_macro CAT_PURGE_BUCKET_POSITION_X_Y]
# Comment
gcode:
    G90                              ; absolute positioning
    G0 X60 Y358 F3600                ; Move to the left of the brush - Purge Bucket



[gcode_macro PURGE_BUCKET_POSITION]
# Comment
gcode:
    CAT_SAFE_XY_TRANSIT_Z
    CAT_PURGE_BUCKET_POSITION_X_Y                     ; Move to the left of the brush - Purge Bucket



