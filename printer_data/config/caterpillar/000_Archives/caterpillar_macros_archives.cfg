[gcode_macro CATERPILLAR_PURGE_FILAMENT_TEST]
# Comment
gcode:
    SAVE_GCODE_STATE NAME=CUF
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0                                   ; ERCF - The filament sensor is turn OFF
    #SET_NOZZLE_LEDS_OFF
    #set_nozzle_leds_on
    #SET_PIN PIN=caselight VALUE=0.10
    
    PURGE_TRAP_OPEN
    
    G90                                ; absolute positioning
    G0 Z10 F3600                                   
    BRUSH_POSITION_X_Y_TEST
    #G0 Z1.5 F3600
    G0 Z8 F3600
    BRUSH_POSITION_END_X_Y_TEST
    BRUSH_POSITION_X_Y_TEST   
    BRUSH_POSITION_END_X_Y_TEST
    BRUSH_POSITION_X_Y_TEST  
    BRUSH_POSITION_END_X_Y_TEST
    BRUSH_POSITION_X_Y_TEST 
    G90                                ; absolute positioning
    G0 Z10 F3600
    G0 X33.5 Y358 F3600
    G0 Z8 F3600
    
    G90                                ; absolute positioning
    #G0 Z10 F3600
    G0 X0 Y358 F3600
    G0 Z3.8 F3600                      ; G0 Z4 F3600
    
    ENABLE_TREADMILL
    G92 E0                             ; Zero Extruder
    G1 E30 F400                        # extrude xmm of Filament
    DISABLE_TREADMILL
    G91                                ; incremental positioning
    G1 E-1.5 F1500                                     ; retract
    FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE=5 VELOCITY=20
    
    G1 E1.5 F1500                      ; unretract                                        ; unretract  
    ENABLE_TREADMILL
    G92 E0                             ; Zero Extruder
    G1 E30 F400                        # extrude xmm of Filament
    DISABLE_TREADMILL
    G91                                ; incremental positioning
    G1 E-1.5 F1500                                     ; retract
    FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE=5 VELOCITY=20
    
    G1 E1.5 F1500                      ; unretract 
    ENABLE_TREADMILL
    G92 E0                             ; Zero Extruder
    G1 E30 F400                        # extrude xmm of Filament
    DISABLE_TREADMILL
    G91                                ; incremental positioning
    G1 E-1.5 F1500                                     ; retract
    FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE=5 VELOCITY=20
    
    G90                                ; absolute positioning
    G0 Z10 F3600                                   
    BRUSH_POSITION_X_Y_TEST
    #G0 Z1.5 F3600
    G0 Z8 F3600
    BRUSH_POSITION_END_X_Y_TEST
    BRUSH_POSITION_X_Y_TEST   
    BRUSH_POSITION_END_X_Y_TEST
    BRUSH_POSITION_X_Y_TEST  
    BRUSH_POSITION_END_X_Y_TEST
    BRUSH_POSITION_X_Y_TEST 
    G90                                ; absolute positioning
    G0 Z10 F3600
    G0 X33.5 Y358 F3600
    G0 Z8 F3600
    G91                                ; incremental positioning
    #G1 E1.5 F1500                      ; unretract
    G91                                ; incremental positioning
    FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE=5 VELOCITY=20
    G92 E0                             ; Zero Extruder
    PURGE_TRAP_CLOSE
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1                                ; ERCF - The filament sensor is turn ON
    #SET_PIN PIN=caselight VALUE=1
    #set_nozzle_leds_on
    RESTORE_GCODE_STATE NAME=CUF


[gcode_macro CATERPILLAR_BRUSH_FILAMENT_TEST]
# Comment
gcode:
    G90                                ; absolute positioning
    G0 Z10 F3600                                   
    BRUSH_POSITION_X_Y_TEST
    #SET_NOZZLE_LEDS_ON
    G0 Z6 F3600
    BRUSH_POSITION_END_X_Y_TEST
    BRUSH_POSITION_X_Y_TEST  
    BRUSH_POSITION_END_X_Y_TEST
    BRUSH_POSITION_X_Y_TEST   
    BRUSH_POSITION_END_X_Y_TEST
    BRUSH_POSITION_X_Y_TEST 
    #SET_NOZZLE_LEDS_OFF
    G90
    G0 Z10 F3600
    G0 X33.5 Y358 F3600
    G0 Z8 F1000


