[gcode_macro CATERPILLAR_BRUSH_FILAMENT]
# Comment
gcode:
    G90                                ; absolute positioning
    G0 Z10 F3600                                   
    BRUSH_POSITION_X_Y
    #SET_NOZZLE_LEDS_ON
    G0 Z1.5 F3600
    BRUSH_POSITION_END_X_Y
    BRUSH_POSITION_X_Y   
    BRUSH_POSITION_END_X_Y
    BRUSH_POSITION_X_Y   
    BRUSH_POSITION_END_X_Y
    BRUSH_POSITION_X_Y 
    SET_NOZZLE_LEDS_OFF
    G90
    G0 Z10 F3600
    G0 X33 Y358 F3600
    G0 Z8 F1000