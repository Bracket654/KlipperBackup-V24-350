[gcode_macro BRUSH_POSITION_END_X_Y]
# Comment
gcode:
    G90                                           ; absolute positioning
    G0 X120 Y358 F3600                               ; brush position

[gcode_macro BRUSH_POSITION_X_Y_SLOW]
# Comment
gcode:
    G90                                           ; absolute positioning
    G0 X80 Y358 F2000                                  ; brush position


[gcode_macro BRUSH_POSITION_END_X_Y_SLOW]
# Comment
gcode:
    G90                                           ; absolute positioning
    G0 X120 Y358 F2000                               ; brush position


[gcode_macro BRUSH_POSITION]
# Comment
gcode:
    CAT_SAFE_XY_TRANSIT_Z
    BRUSH_POSITION_X_Y
    G90                                           ; absolute positioning    
    G0 Z1.5



