[mcu caterpillar]

# CAT - fly Can v1.2 - CAN BUS:
canbus_uuid: 8c6500567c46


###### CAT - fly Can v1.2 - CAN BUS #######################################################
## Caterpillar - Ejection Assisted Purge System: CAT - fly Can v1.2 - CAN BUS
## https://mellow-3d.github.io/fly_ercf_v1.1_pins.html#sample-configuration-file-fly-ercf-easy-brd-v11cfg
## https://mellow-3d.github.io/fly_ercf_v1.1_pins.html#xt30-22-wiring
## This file contains common pin mappings for
[extruder_stepper caterpillar_track]
#extruder: extruder                 # Not Used In That Configuration
extruder:                           # Default: <No Value> - Configuration For Sync Caterpillar Stepper Motor with Extruder
step_pin: caterpillar:gpio7         # Default: caterpillar:gpio7
dir_pin: !caterpillar:gpio8         # Default: !caterpillar:gpio8  
enable_pin: !caterpillar:gpio6      # Default: !caterpillar:gpio6
rotation_distance: 45                  #50	            # Tune treadmill filament extrusion lenght ---> rotation_distance = <belt_pitch> * <number_of_teeth_on_pulley>
gear_ratio: 40:20                   # Default: 40:20 
microsteps: 16                      # Please do not go higher than 16, this can cause 'MCU Timer too close' issues under Klipper
full_steps_per_rotation: 200	    # 200 for 1.8 degree, 400 for 0.9 degree
#velocity: 10                       # Not Used In That Configuration
#accel: 100                         # Not Used In That Configuration

## Caterpillar Track Stepper Driver
## CAT - fly Can v1.2 - CAN BUS
[tmc2209 extruder_stepper caterpillar_track]
## NEMA17 motors, you'll usually set the stealthchop_threshold to 0
## and use higher current
uart_pin: caterpillar:gpio9        # Default: caterpillar:gpio9
#uart_address: 0                    # Default: 0 
interpolate: True                  # Default: True
run_current: 0.5                  # Default: 0.4 
hold_current: 0.1                 # Not Used In That Configuration        
sense_resistor: 0.110              # Default: 0.110 
stealthchop_threshold: 0           # Default: 0


[extruder_stepper caterpillar_conveyor_belt]
#extruder: extruder                 # Not Used In That Configuration
extruder:                           # Default: <No Value> - Configuration For Sync Caterpillar Stepper Motor with Extruder
step_pin: caterpillar:gpio2         # 
dir_pin: caterpillar:gpio1         #  
enable_pin: !caterpillar:gpio3      # 
rotation_distance: 5               #50	            # Tune conveyor belt travellng distance ---> rotation_distance = <belt_pitch> * <number_of_teeth_on_pulley>
gear_ratio: 40:20                   # Default: 40:20 
microsteps: 16                      # Please do not go higher than 16, this can cause 'MCU Timer too close' issues under Klipper
full_steps_per_rotation: 200	    # 200 for 1.8 degree, 400 for 0.9 degree
#velocity: 10                       # Not Used In That Configuration
#accel: 100                         # Not Used In That Configuration

## Caterpillar Track Stepper Driver
## CAT - fly Can v1.2 - CAN BUS
[tmc2209 extruder_stepper caterpillar_conveyor_belt]
## NEMA17 motors, you'll usually set the stealthchop_threshold to 0
## and use higher current
uart_pin: caterpillar:gpio0         # 
#uart_address: 0                   # Not Used In That Configuration 
interpolate: True                  # Default: True
run_current: 0.4                   # Default: 0.4 
#hold_current: 0.1                 # Not Used In That Configuration        
sense_resistor: 0.110              # Default: 0.110 
stealthchop_threshold: 0           # Default: 0


## Servo For Caterpillar Purge Trap Door
## CAT - fly Can v1.2 - CAN BUS
## Values are for the MG90S servo
[servo caterpillar_ejection_trap]
pin: caterpillar:gpio21            # caterpillar:gpio21
maximum_servo_angle: 180           # Default: 180 
minimum_pulse_width: 0.00085       # Default: 0.00085 
maximum_pulse_width: 0.00215       # Default: 0.00215



