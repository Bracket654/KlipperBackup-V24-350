#####################################################################################
# _CAT_PURGE_PRE_CAL
#
# https://github.com/AndrewEllis93/Print-Tuning-Guide/blob/main/articles/determining_max_volumetric_flow_rate.md
# mm3 = mm * 2.4    (Or, inversely)   mm = mm^3 / 2.4
#
[gcode_macro _CAT_PURGE_PRE_CAL_]
description: _CAT_PURGE_PRE_CAL
variable_purge_length_minimum: 30
variable_purge_length_maximum: 150
variable_purge_length: 150
variable_purge_length_modifier: 1.0
variable_purge_length_addition: 0

variable_cat_strip_dist: 35
variable_cat_strip_qty: 11
variable_cat_strip_max_qty: 15
variable_cat_strip_min_qty: 2
variable_cat_purge_volume_adj: 1.0
gcode:
   {% set park_vars = printer['gcode_macro _MMU_PARK'] %}
   {% set filament_diameter = printer.configfile.config.extruder.filament_diameter|float %}
   {% set filament_cross_section = (filament_diameter/2) ** 2 * 3.1415 %}
   {% set from_tool = printer.mmu.last_tool %}
   {% set to_tool = printer.mmu.tool %}
   {% set pos = printer.gcode_move.gcode_position %}
   {% set safe = printer['gcode_macro _BLOBIFIER_SAFE_DESCEND'] %}

   M118 MMU Purge Calculation:
   ###########################################################  Get Purge Volume From MMU   ############################################# <-------------------------------------------------------------------------------------------------   
   # Get purge volumes from the slicer (if set up right. see 
   # https://github.com/moggieuk/Happy-Hare/wiki/Gcode-Preprocessing)
   {% set pv = printer.mmu.slicer_tool_map.purge_volumes %}
    
   # ======================================================================================
   # ==================== DETERMINE PURGE LENGTH ==========================================
   # ======================================================================================

   {% if params.PURGE_LENGTH %} # =============== PARAM PURGE LENGTH ======================
      {action_respond_info("BLOBIFIER: param PURGE_LENGTH provided")}
      {% set purge_len = params.PURGE_LENGTH|float %}
   {% elif from_tool == to_tool and to_tool >= 0 %} # ==== TOOL DIDN'T CHANGE =============
      {action_respond_info("BLOBIFIER: Tool didn't change (T%s > T%s), %s" % (from_tool, to_tool, "priming" if purge_length_minimum else "skipping"))}
      {% set purge_len = 0 %}

   {% elif pv %} # ============== FETCH FROM HAPPY HARE (LIKELY FROM SLICER) ==============
      {% if from_tool < 0 and to_tool >= 0%}
         {action_respond_info("BLOBIFIER: from tool unknown. Finding largest value for T? > T%d" % to_tool)}
         {% set purge_vol = pv|map(attribute=to_tool)|max %}
      {% elif to_tool < 0 %}
         {action_respond_info("BLOBIFIER: tool(s) unknown. Finding largest value")}
         {% set purge_vol = pv|map('max')|max %}
      {% else %}
         {% set purge_vol = pv[from_tool][to_tool]|float * purge_length_modifier %}
         {action_respond_info("BLOBIFIER: Swapped T%s > T%s" % (from_tool, to_tool))}
      {% endif %}
      {% set purge_len = purge_vol / filament_cross_section %}

      {% set purge_len = purge_len + printer.mmu.extruder_filament_remaining + park_vars.retracted_length + purge_length_addition %}

   {% else %} # ========================= USE CONFIG VARIABLE =============================
      {action_respond_info("BLOBIFIER: No toolmap or PURGE_LENGTH. Using default")}
      {% set purge_len = purge_length|float + printer.mmu.extruder_filament_remaining + park_vars.retracted_length %}
   {% endif %}

   # ==================================== APPLY PURGE MINIMUM =============================
   {% set purge_len = [purge_len,purge_length_minimum]|max|round(0, 'ceil')|int %}
   {action_respond_info("BLOBIFIER: Purging %dmm of filament" % (purge_len))}   

   {% set purge_volume_req = (purge_len * 2.4)|round(3) %}
   M118 From MMU: Individual Strip Lenght: {purge_len} mm   Individual Lenght Volume: {purge_volume_req} mm^3

   ###########################################################   
   {% set strip_dist = cat_strip_dist|float %}
   {% set strip_qty = cat_strip_qty|int %}
   {% set strip_min_qty = cat_strip_min_qty|int %}
   {% set strip_max_qty = cat_strip_max_qty|int %}
   {% set purge_volume_adj = cat_purge_volume_adj|float %}
   {% set purge_volume_to_cat = 0 %}

   M118 Caterpillar Purge Calculation:
   
   M118 Individual Strip Lenght: {strip_dist} mm   Individual Lenght Volume: {(strip_dist * 2.4)|round(3)} mm^3

   {% set purge_volume = purge_volume_req|float %}
   {% set strip_qty = ((purge_volume / 2.4) / strip_dist) %}
   {% set strip_qty = ((purge_volume / 2.4) / strip_dist)|round|int %}
   M118 Purge Volume Requested: {purge_volume|round(3)} mm^3   Total Purge Lenght: {(purge_volume / 2.4)|round(3)} mm    Number Of Strip for Requested Volume: {strip_qty}
   
   {% set purge_volume = (purge_volume * purge_volume_adj)|float %}
   {% set strip_qty = ((purge_volume / 2.4) / strip_dist) %}
   {% set strip_qty = ((purge_volume / 2.4) / strip_dist)|round|int %}
   M118 Purge Volume Requested: {purge_volume|round(3)} mm^3   Total Purge Lenght: {(purge_volume / 2.4)|round(3)} mm    Number Of Strip for Requested Volume: {strip_qty}
   {% set strip_qty_req = strip_qty %}

   M118 Strip Requested Number: {strip_qty_req}  Minimum Volume: {(strip_qty_req * (strip_dist * 2.4))|round(3)} mm^3
   M118 Strip Minimum Number: {strip_min_qty}  Minimum Volume: {(strip_min_qty * (strip_dist * 2.4))|round(3)} mm^3
   M118 Strip Maximum Number: {strip_max_qty}  Maximum Volume: {(strip_max_qty * (strip_dist * 2.4))|round(3)} mm^3

   {% set purge_volume_to_cat = 0 %}
   {% if strip_qty < strip_min_qty %}
      {% set strip_qty = strip_min_qty %}
      {% set purge_volume_to_cat = (strip_qty * (strip_dist * 2.4))|float %}
      M118 Number Of Strip: {strip_qty}    Lenght To Caterpillar: {(strip_qty * strip_dist)|round(3)}   Volume To Caterpillar: {(strip_qty * (strip_dist * 2.4))|round(3)} mm^3
   {% elif strip_qty > strip_max_qty %}
      {% set strip_qty = strip_max_qty %}
      {% set purge_volume_to_cat = (strip_qty * (strip_dist * 2.4))|float %}
      M118 Number Of Strip: {strip_qty}    Lenght To Caterpillar: {(strip_qty * strip_dist)|round(3)}   Volume To Caterpillar: {(strip_qty * (strip_dist * 2.4))|round(3)} mm^3
   {% else %}
      {% set purge_volume_to_cat = (strip_qty * (strip_dist * 2.4))|float %}
      M118 Number Of Strip: {strip_qty}    Lenght To Caterpillar: {(strip_qty * strip_dist)|round(3)}   Volume To Caterpillar: {(strip_qty * (strip_dist * 2.4))|round(3)} mm^3
   {% endif %}

   {% set strip_qty = (strip_qty + 1) %}

   M118 Number Of Strip Requested: {strip_qty_req}       Number Of Strip Calculated: {strip_qty}

   SET_GCODE_VARIABLE MACRO=_CAT_PURGE_PRE_CAL VARIABLE=cat_strip_qty VALUE={strip_qty}              # 
   {% set purge_volume_to_cat = (strip_qty * (strip_dist * 2.4))|float %}
   M118 Total Number Of Strip to Caterpillar: {strip_qty}    Total Lenght To Caterpillar: {(strip_qty * strip_dist)|round(3)}   Total Volume To Caterpillar: {(strip_qty * (strip_dist * 2.4))|round(3)} mm^3






















