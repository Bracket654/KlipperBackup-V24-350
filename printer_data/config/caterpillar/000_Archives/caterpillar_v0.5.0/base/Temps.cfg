#####################################################################################
# _CAT_PURGE_PRE_CAL
#
# https://github.com/AndrewEllis93/Print-Tuning-Guide/blob/main/articles/determining_max_volumetric_flow_rate.md
# mm3 = mm * 2.4    (Or, inversely)   mm = mm3 / 2.4
#
[gcode_macro _CAT_PURGE_PRE_CAL]
description: _CAT_PURGE_PRE_CAL
gcode:
   {% set strip_init_dist_min = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_init_dist_min|float|abs %}        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - minimum initial Strip Lenght Default
   {% set strip_mid_dist_min = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_mid_dist_min|float|abs %}          # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - minimum middle Strip Lenght Default
   {% set strip_exit_dist_min = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_exit_dist_min|float|abs %}        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - minimum exit Strip Lenght Default
   {% set purge_volume_min = printer["gcode_macro _CAT_PARAMETERS"].cat_purge_volume_min|float|abs %}              # (mm^3) From _CAT_MUX_MERGE_FILAMENT_PARAM  - Minimum Filament Volume to be purged by Caterpillar
   {% set purge_volume_max = printer["gcode_macro _CAT_PARAMETERS"].cat_purge_volume_max|float|abs %}              # (mm^3) From _CAT_MUX_MERGE_FILAMENT_PARAM  - Maximum Filament Volume to be purged by Caterpillar
   {% set purge_volume = printer["gcode_macro _CAT_PARAMETERS"].cat_op_purge_volume_requested|float|abs %}         # (mm^3) From _CAT_MUX_MERGE_FILAMENT_PARAM  - From MMU Calculation and/or Slicer
   #{% set purge_volume_mmu = pv|map(attribute=to_tool)|max %}                                                      # (mm^3) From MMU Calculation and/or Slicer

   #MMU_CALC_PURGE_VOLUMES                                                            # Should It Be Done At Start or Now?
   #MMU_SLICER_TOOL_MAP PURGE_MAP=1
   #{% set purge_volume_slicer = printer.mmu.slicer_tool_map.purge_volumes %}         # Slicer Purge Volume: https://github.com/moggieuk/Happy-Hare/wiki/Tip-Forming-and-Purging#---purge-volumes

   #{% set purge_volume = purge_volume_slicer %}                                      # 

   {% set purge_volume = 150 %}

   M118 Cal Caterpillar Total Purge Volume Requested: {purge_volume|int}mm^3

   {% if purge_volume < purge_volume_min %}                                   #
      {% set purge_volume = purge_volume_min %}                               # 
                                                                              # Trim/Set Min/Max Purge Volume 
   {% elif purge_volume > purge_volume_max %}                                 #
      {% set purge_volume = purge_volume_max %}                               #

   {% else %}
      M118 Cal Caterpillar Total Purge Volume Set: {purge_volume|int}mm^3

   {% endif %}

   {% set purge_dist_total = (purge_volume / 2.4) %}                                                 # Convert Volume into Extrusion Lenght:  (Lenght = Volume / 2.4)
   M118 Cal Caterpillar Total Lenght Set: {purge_dist_total|int}mm

   {% if purge_dist_total <= (strip_init_dist_min + strip_mid_dist_min + strip_exit_dist_min) %}     # Is Purge Lenght smaller and/or equal Then Total of Initial/Middle/exit Minimum Purge Strip
      {% set individual_strip_number = 2 %}                                                          # Only 2 Strip used
      
      {% if purge_dist_total <= (strip_init_dist_min + strip_exit_dist_min) %}                       # 
         {% set strip_exit_dist = strip_exit_dist_min %}                                             # 
         {% set strip_mid_dist = 0 %}                                                                #   
         {% set strip_init_dist = strip_init_dist_min %}                                             # 
         
      {% else %}
         {% set strip_exit_dist = strip_exit_dist_min  %}                                            # 
         {% set strip_mid_dist = 0 %}                                                                # 
         {% set strip_init_dist = (purge_dist_total - strip_exit_dist) %}                            # 
         
         {% if strip_init_dist < strip_init_dist_min %}                                              # 
            {% set strip_init_dist = strip_init_dist_min %}                                          # 
         {% endif %}
            
      {% endif %}

   {% else %}                                                                                        # Is Purge Larger Then Total of Initial/Middle/exit Minimum Purge

      {% set individual_strip_number = 3 %}                                                          # 
      {% set strip_exit_dist = strip_exit_dist_min|int %}                                            # 
      {% set left_over_dist = (purge_dist_total - strip_exit_dist)|int %}                            # 
      {% set strip_mid_dist = (strip_mid_dist_min + (left_over_dist / 2))|int %}                     # 
      {% set strip_init_dist = (strip_init_dist_min + (left_over_dist / 2))|int %}                   # 

   {% endif %}

   SET_GCODE_VARIABLE MACRO=_CAT_PARAMETERS VARIABLE=cat_op_backup_strip_request VALUE={individual_strip_number|int}      # 
   SET_GCODE_VARIABLE MACRO=_CAT_PARAMETERS VARIABLE=cat_strip_exit_dist VALUE={strip_exit_dist|int}                      # 
   SET_GCODE_VARIABLE MACRO=_CAT_PARAMETERS VARIABLE=cat_strip_mid_dist VALUE={strip_mid_dist|int}                        # 
   SET_GCODE_VARIABLE MACRO=_CAT_PARAMETERS VARIABLE=cat_strip_init_dist VALUE={strip_init_dist|int}                      # 

   M118 Cal Caterpillar: Set Strip Number: {individual_strip_number}
   M118 Cal Caterpillar: Set Total Strip Lenght: {(strip_init_dist + strip_mid_dist + strip_exit_dist)|int}mm       Volume: {((strip_init_dist + strip_mid_dist + strip_exit_dist) * 2.4)|int}mm^3
   M118 Cal Caterpillar: Set Exit Strip Lenght: {strip_exit_dist|int}mm       Volume: {(strip_exit_dist * 2.4)|int}mm^3
   M118 Cal Caterpillar: Set Mid Strip Lenght: {strip_mid_dist|int}mm        Volume: {(strip_mid_dist * 2.4)|int}mm^3
   M118 Cal Caterpillar: Set Initial Strip Lenght: {strip_init_dist|int}mm    Volume: {(strip_init_dist * 2.4)|int}mm^3


