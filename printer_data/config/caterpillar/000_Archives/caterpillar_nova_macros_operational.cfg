# Caterpillar Tool Change/Purge Macro
[gcode_macro CAT_OP_TOOL_SELECT]
description: Tool Change Request AND/OR Purge Filament
  Usage: CAT_OP_TOOL_SELECT [TOOL=<op_requested_tool>]
variable_op_requested_tool: 0                           # Tool request from MMU or User: 0 = T0, 1 = T1, etc...
variable_op_xyz_return_move: False                      # Enable/Disable XYZ return Move - Default: Disable (False)
variable_mmu_swap_tool: False                           # If Tool Requested Loaded: Skip Swap Tool - Default: Do Not Swap Tool (False)
variable_cat_purge_filament: False                      # Enable/Disable Filament Purge -  Default: Do Not Purge Filament (False)

gcode:
  {% set TOOL = params.TOOL|default(op_requested_tool)|int %}                         # Select MMU Tool Number
  {% set mmu_disable = printer["gcode_macro _CAT_OP_STATE"].mmu_disable %}            # Verify MMU State

  # Caterpillar Enable/Disable State
  {% if caterpillar_enable %}                                                                         # Caterpillar Enable/Disable State
    {% set TOOL = params.TOOL|default(op_requested_tool)|int %}                                       # Tool request from MMU or User: 0 = T0, 1 = T1, etc...
    {% set op_actual_tool_selected = printer["gcode_macro _CAT_OP_STATE"].op_actual_tool_selected %}  # Does Tool as Been Selected - by User and/or Start Macro
    {% set op_actual_tool = printer["gcode_macro _CAT_OP_STATE"].op_actual_tool %}                    # Curent loaded Tool/Filament: 0 = T0, 1 = T1, etc...
    {% set op_first_tool_selected = printer["gcode_macro _CAT_OP_STATE"].op_first_tool_selected %}    # Does First Layer Tool as Been Selected by User: The user as to set the Initial Tool for First Layer...For now     
    {% set op_first_tool = printer["gcode_macro _CAT_OP_STATE"].op_first_tool %}                      # Wen User or Start Macro as set the First Layer Tool:  0 = T0, 1 = T1, etc...
    
    M118 Caterpillar Is Enable

    # MMU Tool Selected/Unknown State
    {% if op_actual_tool_selected %}                     # MMU Tool Selected/Unknown State
      M118 MMU Tool Selected

      # op_actual_tool and op_first_tool_selected
      {% if TOOL == op_actual_tool and op_first_tool_selected %}                                      # op_actual_tool and op_first_tool_selected
        M118 MMU Tool Swap Requested: Tool Is Already Selected - No Swap Required
      {% else %}                                                                                      # op_actual_tool and op_first_tool_selected
        M118 MMU Tool Swap Requested: Stanby!!!
        SET_GCODE_VARIABLE MACRO=CAT_OP_TOOL_SELECT VARIABLE=op_xyz_return_move VALUE={'True'}        # 
        SET_GCODE_VARIABLE MACRO=CAT_OP_TOOL_SELECT VARIABLE=mmu_swap_tool VALUE={'True'}             # 
      {% endif %}                                                                                     # op_actual_tool and op_first_tool_selected
      
    {% else %}                                           # MMU Tool Selected/Unknown State
      M118 MMU No Tool Selected: Selecting Tool 0        # 
      ERCF_CHANGE_TOOL TOOL={TOOL}                       # Select MMU Requested Tool ID
    {% endif %}                                          # MMU Tool Selected/Unknown State

    # op_xyz_return_move
    {% if op_xyz_return_move %}                                   # op_xyz_return_move
      # Set Actual Position & Limit Values
      {% set act_x = printer.toolhead.position.x|float %}         #                                                      
      {% set act_y = printer.toolhead.position.y|float %}         # 
      {% set act_z = printer.toolhead.position.z|float %}         # 
      {% set max_z = printer.toolhead.axis_maximum.z|float %}     # 
      {% set op_z_return = printer["gcode_macro _CAT_OP_STATE"].op_z_return_minimum %}                # 
      {% set cat_park_x = printer["gcode_macro _CAT_OP_STATE"].cat_park_x %}                          # 
      {% set cat_park_y = printer["gcode_macro _CAT_OP_STATE"].cat_park_y %}                          # 
      {% set cat_park_z = printer["gcode_macro _CAT_OP_STATE"].cat_park_z %}                          # 
      {% set z_safe = 5.0 %}                                                                          # 

      # act_x == cat_park_x and act_y == cat_park_y and act_z == cat_park_z
      {% if act_x == cat_park_x and act_y == cat_park_y and act_z == cat_park_z %}                    # act_x == cat_park_x and act_y == cat_park_y and act_z == cat_park_z
        M118 Tool Head Parked: No Move Requiered!!!
      {% else %}                                                                                      # act_x == cat_park_x and act_y == cat_park_y and act_z == cat_park_z
        # if op_print_in_progress and op_save_target_protected
        {% if op_print_in_progress and op_save_target_protected %}                    # if op_print_in_progress and op_save_target_protected
          M118 Print Return Values Protected!!!
        {% else %}
          M118 Tool Head Pre-Move Calculation: Stanby!!!

          # Set XYZ Return to Target Part
          {% set op_x_target = printer.toolhead.position.x|float %}       # Target x Coordinate for Resume print
          {% set op_y_target = printer.toolhead.position.y|float %}       # Target y Coordinate for Resume print
          {% set op_z_target = printer.toolhead.position.z|float %}       # Target z Coordinate for Resume print
          SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_x_target VALUE={op_x_target}      # Target x Coordinate for Resume print - To _CAT_OP_STATE
          SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_y_target VALUE={op_y_target}      # Target y Coordinate for Resume print - To _CAT_OP_STATE
          SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_z_target VALUE={op_z_target}      # Target z Coordinate for Resume print - To _CAT_OP_STATE

          ### op Fan Speed to _CAT_OP_STATE
          {% set op_cat_fan_speed_part = printer.fan.speed %}                                  # Actual Operational Part Fan Speed - Value for Resume print
          SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_x_target VALUE={op_cat_fan_speed_part}      # Actual Operational Part Fan Speed - Value for Resume print - To _CAT_OP_STATE

          # Calculate Safe XY Tool Head Side Hop 
        

          # Calculate Safe Transit Z Tool Head 
          {% if op_z_target < (max_z - 5.0) %}                        # Calculate Safe Transit Z Tool Head
            {% z_safe = 5.0 %}                                        #  
          {% else %}                                                  # Calculate Safe Transit Z Tool Head
            {% z_safe = max_z - op_z_target %}                        #  
          {% endif %}                                                 # Calculate Safe Transit Z Tool Head

          # Calculate if Global z_return_minimum need to be updated
          {% if (act_z + z_safe) > set z_return_min %}                                                   # Calculate if z_return_minimum need to be updated
            {% z_return_min = (act_z + z_safe) %}                                                        # 
            SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_z_return_minimum VALUE={z_return_min}     # Update Global z_return_minimum
          {% endif %}                                                                                    # Calculate if z_return_minimum need to be updated
          
          SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_xyz_return_move VALUE={'True'}             # Enable Return move to Park
        {% endif %}                                                   # if op_print_in_progress and op_save_target_protected

      {% endif %}                                                                                      # act_x == cat_park_x and act_y == cat_park_y and act_z == cat_park_z


      # op_xyz_return_move
      {% if op_xyz_return_move %}                                                       # op_xyz_return_move
        # if op_print_in_progress and op_save_target_protected
        {% if op_print_in_progress and op_save_target_protected %}                      # if op_print_in_progress and op_save_target_protected
          G91                                                                             # 
          G1 Z{z_safe} F900                                                               # --------> will need parameter variable for velocity
          G90                                                                             # 

        ### Move to park position    ### Make sure safe move above or bellow x safe transit

        {% else %}                                                                      # if op_print_in_progress and op_save_target_protected
          M118 Moving Tool Head To Park for Filament Swap and Purge - Stanby!!! 

          G1 E-0.5 F1800                                                                  # retract   --------> Get the value from the slicer GCode File

          ###### GCODE State COTSV   Protection if printer went in MMU Pause/Lock so that if a tool change is requested during a print, The return data wont be wiper
          ###### Same go for fan and other stats

          SAVE_GCODE_STATE NAME=COTSV                                                     # https://www.klipper3d.org/G-Codes.html?h=save_g#save_gcode_state
                                                                                        # GCode coordinate mode (absolute vs relative), Extrude mode (absolute vs relative), Origin, 
                                                                                        # Z offset, Speed and extrude overrides, Move speed, Current nozzle position, Relative extruder position

          G91                                                                             # 
          G1 Z{z_safe} F900                                                               # --------> will need parameter variable for velocity
          G90                                                                             # 

          _CAT_INBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ
          _CAT_ELEVATOR_POSITION_TO_PARK_POSITION

        {% endif %}                                                                     # if op_print_in_progress and op_save_target_protected

      {% endif %}                                                                       # op_xyz_return_move

    {% endif %}                                                     # op_xyz_return_move



#################################################################################################################################################################
    # mmu_swap_tool
    {% if mmu_swap_tool %}                                                                  # mmu_swap_tool
      M118 MMU Requesting T{op_actual_tool} ----> T{TOOL}
      ERCF_CHANGE_TOOL TOOL={TOOL}                                                          # Select MMU Requested Tool ID

      ##############IF then tool 0 is loaded?
      ############SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_actual_tool_selected VALUE={'True'}        # 
      ###############SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_actual_tool VALUE={0}        # 

      
      SET_GCODE_VARIABLE MACRO=CAT_OP_TOOL_SELECT VARIABLE=op_actual_tool VALUE={TOOL}      #

      
      
      M118 MMU T{TOOL} Selected                                                             #

      {% if printer.ercf.is_paused|int == 1 %}                                                     # Return to Print prep
        M118 MMU Pause Request: Stanby!!                                                           # 
        M118 You can't resume the print without unlocking the ERCF first.                          # 
        M118 Run CAT_MMU_UNLOCK and solve any issue before hitting Resume again                    # 
        M118 Then if you are printing: To resume: CAT_MMU_RESUME_PRINT                             # 
        _CAT_PURGE_POSITION_TO_BRUSH_POSITION                                                      # 
        _CAT_NOZZLE_CLEAN_SLOW_SHORT                                                               # 
        _CAT_BRUSH_POSITION_TO_PARK_POSITION                                                       # 
        SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_xyz_return_move VALUE={'False'}         # Disable Return move to Print
        SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_save_target_protected VALUE={'True'}    # Enable op_save_target_protected - Protect Value for Return to Print Target
        ###### GCODE State COTSV   Protection if printer went in MMU Pause/Lock so that if a tool change is requested during a print, The return data wont be wiper
        ###### Same go for fan and other stats
        
      {% endif %}                                                                                  # Return to Print prep
      
    {% endif %}                                                                             # mmu_swap_tool

#################################################################################################################################################################


    # Purge Filament
    {% if cat_purge_filament %}                                 # Purge Filament
      # Set Fan Speed for Purge
      M106 S{cat_fan_speed_part}                                                      # Set Part Cooling Fan speed for Purge
      
      # Do Purge Stuff



      # Finish to Purge Stuff

      # Return to Print prep
      {% if printer.ercf.is_paused|int == 1 %}                                                     # Return to Print prep
        M118 MMU Pause Request: Stanby!!                                                           # 
        _CAT_PURGE_POSITION_TO_BRUSH_POSITION                                                      # 
        _CAT_NOZZLE_CLEAN_SLOW_SHORT                                                               # 
        _CAT_BRUSH_POSITION_TO_PARK_POSITION                                                       # 
        M118 You can't resume the print without unlocking the ERCF first.                          # 
        M118 Run CAT_MMU_UNLOCK and solve any issue before hitting Resume again                    # 
        M118 Then if you are printing: To resume: CAT_MMU_RESUME_PRINT                             # 
        SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_xyz_return_move VALUE={'False'}         # Disable Return move to Print
        SET_GCODE_VARIABLE MACRO=_CAT_OP_STATE VARIABLE=op_save_target_protected VALUE={'True'}    # Enable op_save_target_protected - Protect Value for Return to Print Target
        ###### GCODE State COTSV   Protection if printer went in MMU Pause/Lock so that if a tool change is requested during a print, The return data wont be wiper
        ###### Same go for fan and other stats
      {% else %}                                                                                  # Return to Print prep
      _CAT_TIMELAPSE_TAKE_COLOR_CHANGE_FRAME                                                       # TimeLapse - Tool Swap Completed, Take Frame - This will capture individual color change in addition to Frame for each layer change
      {% endif %}                                                                                  # Return to Print prep
      
    {% endif %}                                                 # Purge Filament


    # op_xyz_return_move
    {% if op_xyz_return_move %}                                 # op_xyz_return_move
      # if op_print_in_progress and op_save_target_protected
      {% if op_print_in_progress and op_save_target_protected %}                      # if op_print_in_progress and op_save_target_protected
        M118 MMU Paused - Skip return move!!!
      {% else %} # if op_print_in_progress and op_save_target_protected
        M118 Tool Head Return to Print Position!!!
        _CAT_OUTBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ                                                             #
        {% if printer["gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE"].op_z_return_minimum < 10 %}   #
          _CAT_SAFE_XY_TRANSIT_Z_LOW_XY_IN_OUT                                                                     #   
        {% else %}                                                                                                 # 
          G90                                                                                                      # 
          G1 Z{printer["gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE"].op_z_return_minimum} F900    #     <-------- Need Variable for velocity #####################
        {% endif %}                                                                                                # 

        M106 S{printer["gcode_macro op_save_target_protected"].op_cat_fan_speed_part}                              # Set Part Cooling Fan speed back to Operational Speed

        G90                                                                         #
        G1 x{op_x_target} y{op_y_target} Z{op_z_target} F3600                       # <-------- Need Variable for velocity #####################   
       
        RESTORE_GCODE_STATE NAME=COTSV                                              #
        M118 Resuming Print!!!
      {% endif %}                                                                   # if op_print_in_progress and op_save_target_protected

    {% endif %}                                                # op_xyz_return_move


   ###### GCODE State COTSV   Protection if printer went in MMU Pause/Lock so that if a tool change is requested during a print, The return data wont be wiper
   ###### Same go for fan and other stats


  {% else %}                                           # Caterpillar Enable/Disable State
    M118 Caterpillar Is Disable
  {% endif %}                                          # Caterpillar Enable/Disable State


