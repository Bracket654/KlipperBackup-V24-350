# Purge Trap Full Open
[gcode_macro _CAT_PURGE_TRAP_OPEN]
gcode:
   SET_SERVO SERVO=caterpillar_ejection_trap ANGLE=180   # Move Servo
   G4 P2000                                              # Whait 2 Sec
   SET_SERVO SERVO=caterpillar_ejection_trap WIDTH=0.0   # Servo Power OFF


# Purge Trap Fully Close
[gcode_macro _CAT_PURGE_TRAP_CLOSE]
gcode:
   SET_SERVO SERVO=caterpillar_ejection_trap ANGLE=110   # Move Servo
   G4 P2000                                              # Whait 2 Sec
   SET_SERVO SERVO=caterpillar_ejection_trap WIDTH=0.0   # Servo Power OFF


# Engage Caterpillar Track
[gcode_macro _CAT_ENABLE_TRACK_SYNC]
gcode:
   SYNC_EXTRUDER_MOTION EXTRUDER="caterpillar_track" MOTION_QUEUE=extruder
   #G4 P100


# Disengage Caterpillar Track
[gcode_macro _CAT_DISABLE_TRACK_SYNC]
gcode:
   SYNC_EXTRUDER_MOTION EXTRUDER="caterpillar_track" MOTION_QUEUE=
   #G4 P100


# TimeLapse - Tool Swap Completed, Take Frame - This will capture individual 
# color change in addition to Frame for each layer change
[gcode_macro _CAT_TIMELAPSE_TAKE_COLOR_CHANGE_FRAME]
gcode:
   # If/Then TimeLapse Enable
   _TIMELAPSE_NEW_FRAME HYPERLAPSE={hyperlapse}


