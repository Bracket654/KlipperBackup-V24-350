
[gcode_macro CAT_SET_RESET]
gcode:
  SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_enable VALUE={'False'}
  _CAT_TOOL_SELECT_PURGE
  SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_enable VALUE={'True'}

[gcode_macro CAT_CATERPILLAR_ENABLE]
gcode:
  SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_enable VALUE={'True'}
  _CAT_TOOL_SELECT_PURGE
               
[gcode_macro CAT_CATERPILLAR_DISABLE]
gcode:
  SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_enable VALUE={'False'}
  _CAT_TOOL_SELECT_PURGE

[gcode_macro CAT_MMU_ENABLE]
gcode:
  SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=mmu_enable VALUE={'True'}
  _CAT_TOOL_SELECT_PURGE
               
[gcode_macro CAT_MMU_DISABLE]
gcode:
  SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=mmu_enable VALUE={'False'}
  _CAT_TOOL_SELECT_PURGE

[gcode_macro CAT_SET_FIRST_LAYER_MMU_TOOL]
gcode:
  SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=first_layer_tool VALUE={1}

[gcode_macro CAT_UNLOCK_MMU]
gcode:
  M118 MMU Enable
  
[gcode_macro CAT_HOME_MMU]
gcode:
  M118 MMU Home

[gcode_macro CAT_CLEAR_TRACK]
# Caterpillar Clear Track of all Strips
gcode:
   CAT_PURGE_TRAP_OPEN
   G90                                                                                                                                                                                                   # absolute positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={printer["gcode_macro _CAT_PARAMETERS"].cat_clear_track_lenght} VELOCITY={printer["gcode_macro _CAT_PARAMETERS"].cat_gap_velocity}   # Caterpillar Clear Strip
   CAT_PURGE_TRAP_CLOSE

[gcode_macro CAT_TIMELAPSE_TAKE_COLOR_CHANGE_FRAME]
# Caterpillar Clear Track of all Strips
gcode:
   _TIMELAPSE_NEW_FRAME HYPERLAPSE={hyperlapse}


