[gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE]
# Minimum Tool Head Return Z Height During Operational Print to avoid Colision with parts
# This value is there as a Safty if more then one parts are printed in Sequential Order - This mode is set in the slicer software
variable_op_x_target: 0                                 # 
