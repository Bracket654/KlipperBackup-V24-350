[gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE]
# Comments
variable_tx_target: 30
variable_ty_target: 30
variable_tz_target: 30
variable_tz_return: 30
gcode:
   {% set max_z = printer.toolhead.axis_maximum.z|float %}                          #
   {% set act_x = printer.toolhead.position.x|float %}                              #
   {% set act_y = printer.toolhead.position.y|float %}                              # 
   {% set act_z = printer.toolhead.position.z|float %}                              # 


   SET_GCODE_VARIABLE MACRO=_CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE VARIABLE=tx_target VALUE={act_x}   #              
   SET_GCODE_VARIABLE MACRO=_CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE VARIABLE=ty_target VALUE={act_y}   # 
   SET_GCODE_VARIABLE MACRO=_CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE VARIABLE=tz_target VALUE={act_z}   # 

       {% if act_z < (max_z - 5.0) %}                                                   # 
           {% set z_safe = 5.0 %}                                                       #  
       {% else %}                                                                       # 
           {% set z_safe = max_z - act_z %}                                             #  
       {% endif %}                                                                      # 

       G1 E-0.5 F1800                     # retract

       SAVE_GCODE_STATE NAME=PTC                                                        # 

       G91                                                                              # 
       G1 Z{z_safe} F900                                                                # 
       G90                                                                              # 

       {% set act_z = printer.toolhead.position.z|float %}                              #
       SET_GCODE_VARIABLE MACRO=_CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE VARIABLE=tz_return VALUE={act_z + z_safe}

       _CAT_INBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ
       _CAT_ELEVATOR_POSITION_TO_PARK_POSITION

       #G92 E0                                                                           # Zero Extruder

       _CAT_OPERATIONAL_PURGE_FILAMENT_TEMPERATURE


