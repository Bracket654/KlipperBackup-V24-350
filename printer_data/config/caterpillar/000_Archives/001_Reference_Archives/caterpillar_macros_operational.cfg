[gcode_macro CAT_PARK]
# CAT_MAC_UFM_001
# Comment
gcode:
   SAVE_GCODE_STATE NAME=PARK
   {% set max_z = printer.toolhead.axis_maximum.z|float %}                          # 
   {% set act_z = printer.toolhead.position.z|float %}                              # 

   {% if act_z < (max_z - 5.0) %}                                                   #####################################
       {% set z_safe = 5.0 %}                                                       #    
   {% else %}                                                                       # 
       {% set z_safe = max_z - act_z %}                                             #  
   {% set z_return = z_safe|float %}                                                #
   {% endif %}                                                                      #####################################

   G91                                                                              #
   G1 Z{z_safe} F900                                                                #

   _CAT_INBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ                                    # CAT_MAC_BCM_001    ##  
   _CAT_ELEVATOR_POSITION_TO_PARK_POSITION                                          # CAT_MAC_BCM_012    ##  
   RESTORE_GCODE_STATE NAME=PARK


[gcode_macro CAT_PURGE_AND_PARK]
# CAT_MAC_UFM_002
# TOOL: (Default: ACTUAL)
# Pass Variable: HIGH, MED, LOW
# HIGH (9 Strips), MED (6 Strips), LOW (3 Strips)
gcode:
   {% set max_z = printer.toolhead.axis_maximum.z|float %}                          # 
   {% set act_z = printer.toolhead.position.z|float %}                              # 

   {% if act_z < (max_z - 5.0) %}                                                   # 
       {% set z_safe = 5.0 %}                                                       #    
   {% else %}                                                                       # 
       {% set z_safe = max_z - act_z %}                                             #  
   {% set z_return = z_safe|float %}                                                #
   {% endif %}                                                                      # 

   #_CAT_STANDARD_RETRACK                                                            #

   G91                                                                              # 
   G1 Z{z_safe} F900                                                                # 

   _CAT_INBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ                                    # CAT_MAC_BCM_001    ## 
   #_CAT_PURGE_STRIPS_COUNT_CALCULATIONS                                             # 
   _CAT_ELEVATOR_POSITION_TO_PURGE_POSITION                                         # CAT_MAC_BCM_005    ## 
   
   _CAT_PURGE_FILAMENT                                                              # CAT_MAC_BCM_031    ## 
   
   _CAT_PURGE_POSITION_TO_BRUSH_POSITION                                            # 
   _CAT_NOZZLE_CLEAN_SLOW_SHORT                                                     # 
   _CAT_BRUSH_POSITION_TO_PARK_POSITION                                             # 

   G90
   G1 E1 F1800                      # unretract 

   G92 E0                                                                               # Zero Extruder


[gcode_macro CAT_CLEAN_NOZZLE_AND_PARK]
# CAT_MAC_UFM_003
#MACRO_0005A
# Comment
gcode:
   {% set max_z = printer.toolhead.axis_maximum.z|float %}                          # 
   {% set act_z = printer.toolhead.position.z|float %}                              # 

   {% if act_z < (max_z - 5.0) %}                                                   # 
       {% set z_safe = 5.0 %}                                                       #    
   {% else %}                                                                       # 
       {% set z_safe = max_z - act_z %}                                             #  
   {% set z_return = z_safe|float %}                                                #
   {% endif %}                                                                      # 

   G91                                                                              # 
   G1 Z{z_safe} F900                                                                #  

   _CAT_INBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ                                    #  CAT_MAC_BCM_001    ## 
   _CAT_ELEVATOR_POSITION_TO_BRUSH_POSITION                                         #  CAT_MAC_BCM_012    ## 
   
   _CAT_CLEAN_NOZZLE                                                                #  CAT_MAC_BCM_015    ## 

