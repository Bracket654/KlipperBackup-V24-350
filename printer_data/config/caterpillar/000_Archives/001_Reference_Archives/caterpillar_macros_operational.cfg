variable_op_z_target: 30                                # 
variable_op_z_return_minimum: 30                        # 
variable_cat_fan_speed_part: 0                          # 
variable_op_first_tool: 999                             # 999 = Unknown, 0 = T0, 1 = T1, etc...
variable_op_actual_tool: 999                            # 999 = Unknown
variable_mmu_disable: False                              # 
variable_bypass_requested: False                        # Bypass requested: by Start macro
variable_mmu_bypass_gate: False                         # Filament is loaded in Bypass Gate - Do not change tool
variable_tool_change_state_code: 0                      # 
variable_printer_mmu_status: 0                          # 
variable_cat_purge_strip_number: 2                      # Total number of strip to purge; minimum 2
variable_cat_purge_strip_max: 5                         # Total maximum number of strip to purge
gcode:


# Caterpillar Tool Change/Purge Macro
[gcode_macro CAT_OP_TOOL_SELECT]
description: Tool Change Request AND/OR Catarpillar Park
  Usage: CAT_OP_TOOL_SELECT [TOOL=<op_requested_tool>]
variable_op_requested_tool: 0                                                                           #
gcode:
  ################# Find all part Fan, Hot End Temperature, HVAC, And LED Setting, Others?:  Put them in variables
  # printer.fan.speed
  # Find ERCF Tool Status and Tool requested by Slicer GCode File
  # Endless spool mode and clog detection

  {% set op_fan_speed_part = printer.fan.speed %}             # Target Part Fan Speed for Resume print
  {% set cat_fan_speed_part = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].cat_fan_speed_part %}           # 
  {% set TOOL = params.TOOL|default(op_requested_tool)|int %}                                                      # 
  {% set mmu_disable = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].mmu_disable %}                         # 
  {% set mmu_bypass_gate = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].mmu_bypass_gate %}                 #  !!!Do not Request MMU Tool Change when in Bypass Gate Mode!!!!


  M118 Default: {op_requested_tool}
  
  {% if TOOL == 1 %}                                                    # ERCF
      M118 Enable
  {% else %}                                                                        # ERCF
