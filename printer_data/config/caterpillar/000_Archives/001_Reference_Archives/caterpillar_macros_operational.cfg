       G0 Z{printer["gcode_macro _CAT_PARAMETERS"].z_safe_transit_hight} F{printer["gcode_macro _CAT_PARAMETERS"].z_safe_transit_speed}                                                          # Z Safe Transit
       G0 X{printer["gcode_macro _CAT_PARAMETERS"].x_purge_park}  Y{printer["gcode_macro _CAT_PARAMETERS"].y_purge_park}  F{printer["gcode_macro _CAT_PARAMETERS"].xy_purge_park_speed}          # XY Purge Park                                                                                                                        # XY Purge Park Position

       G90                               # Absolute Positioning
       FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={printer["gcode_macro _CAT_PARAMETERS"].gap_lenght} VELOCITY={printer["gcode_macro _CAT_PARAMETERS"].cat_gap_velocity}   # Caterpillar Track UnSync - Move Gap

       ##### Initial Strip ###################################
   
       G0 Z{printer["gcode_macro _CAT_PARAMETERS"].z_purge_park_hight}  F{printer["gcode_macro _CAT_PARAMETERS"].xy_purge_park_speed}         # Z Purge Park Position
       G1 E{printer["gcode_macro _CAT_PARAMETERS"].unretract_op_lenght} F{printer["gcode_macro _CAT_PARAMETERS"].unretract_op_speed}          # Unretract Operational

       _CAT_ENABLE_TRACK_SYNC
       G1 E{printer["gcode_macro _CAT_PARAMETERS"].strip_lenght} F{printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velocity}                 # Purge Filament Strip - Standard Speed
   
       _CAT_DISABLE_TRACK_SYNC
       G92 E0                            # Zero Extruder
       G1 E-{printer["gcode_macro _CAT_PARAMETERS"].retract_lenght} F{printer["gcode_macro _CAT_PARAMETERS"].retract_op_speed}                # Retract Operational
   
       G91
       G1 Z{printer["gcode_macro _CAT_PARAMETERS"].cat_z_hop_hight}  F{printer["gcode_macro _CAT_PARAMETERS"].cat_z_hop_speed}                # Caterpillar Z Hop
   
       G90                               # Absolute Positioning
       FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={printer["gcode_macro _CAT_PARAMETERS"].gap_lenght} VELOCITY={printer["gcode_macro _CAT_PARAMETERS"].cat_gap_velocity}   # Caterpillar Track UnSync - Move Gap

       ##### Standard Strip ###################################
   
       G0 Z{printer["gcode_macro _CAT_PARAMETERS"].z_purge_park_hight}  F{printer["gcode_macro _CAT_PARAMETERS"].xy_purge_park_speed}         # Z Purge Park Position
       G1 E{printer["gcode_macro _CAT_PARAMETERS"].unretract_op_lenght} F{printer["gcode_macro _CAT_PARAMETERS"].unretract_op_speed}          # Unretract Operational

       _CAT_ENABLE_TRACK_SYNC
       G1 E{printer["gcode_macro _CAT_PARAMETERS"].strip_lenght} F{printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velocity}                 # Purge Filament Strip - Standard Speed
   
       _CAT_DISABLE_TRACK_SYNC
       G92 E0                            # Zero Extruder
       G1 E-{printer["gcode_macro _CAT_PARAMETERS"].retract_lenght} F{printer["gcode_macro _CAT_PARAMETERS"].retract_op_speed}                # Retract Operational
   
       G91
       G1 Z{printer["gcode_macro _CAT_PARAMETERS"].cat_z_hop_hight}  F{printer["gcode_macro _CAT_PARAMETERS"].cat_z_hop_speed}                # Caterpillar Z Hop
   
       G90                               # Absolute Positioning
       FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={printer["gcode_macro _CAT_PARAMETERS"].gap_lenght} VELOCITY={printer["gcode_macro _CAT_PARAMETERS"].cat_gap_velocity}   # Caterpillar Track UnSync - Move Gap

       ##### End Strip #######################################
   
       G0 Z{printer["gcode_macro _CAT_PARAMETERS"].z_purge_park_hight}  F{printer["gcode_macro _CAT_PARAMETERS"].xy_purge_park_speed}         # Z Purge Park Position
       G1 E{printer["gcode_macro _CAT_PARAMETERS"].unretract_op_lenght} F{printer["gcode_macro _CAT_PARAMETERS"].unretract_op_speed}          # Unretract Operational

       _CAT_ENABLE_TRACK_SYNC
       G1 E{printer["gcode_macro _CAT_PARAMETERS"].strip_lenght} F{printer["gcode_macro _CAT_PARAMETERS"].cat_strip_slow_velocity}            # Purge Filament Strip - Slow Speed


       _CAT_PURGE_TRAP_CLOSE 

       ###############   Restore :  part Fan, Hot End Temperature, HVAC, And LED Setting, Others?  #######################################################################################################

       #_TIMELAPSE_NEW_FRAME HYPERLAPSE={hyperlapse}                                                                                          # 

       _CAT_DISABLE_TRACK_SYNC
       G92 E0                             # Zero Extruder
       G1 E-{printer["gcode_macro _CAT_PARAMETERS"].retract_lenght} F{printer["gcode_macro _CAT_PARAMETERS"].retract_op_speed}                # Retract Operational

       G91
       G1 Z{printer["gcode_macro _CAT_PARAMETERS"].cat_z_hop_hight_exit1}  F{printer["gcode_macro _CAT_PARAMETERS"].cat_z_hop_speed}          # Caterpillar Z Hop Exit1

       ##### Return To Print ########################################
       
       {% if printer.ercf.is_paused|int == 1 %}                                        # 
           M118 You can't resume the print without unlocking the ERCF first.           # 
           M118 Run ERCF_UNLOCK and solve any issue before hitting Resume again        # 
           _CAT_PURGE_POSITION_TO_BRUSH_POSITION                                       # 
           _CAT_NOZZLE_CLEAN_SLOW_SHORT                                                # CAT_MAC_BCM_019
           _CAT_BRUSH_POSITION_TO_PARK_POSITION                                        # 
       {% else %}                                                                      #
           _CAT_OUTBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ
           {% if printer["gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE"].tz_return < 10 %}
               _CAT_SAFE_XY_TRANSIT_Z_LOW_XY_IN_OUT                                    #   
           {% else %}                                                                  # 
               G90                                                                     # 
               G1 Z{printer["gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE"].tz_return} F900
           {% endif %}                                                                 # 

           G90
           G1 x{printer["gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE"].tx_target} y{printer["gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE"].ty_target} Z{printer["gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE"].tz_target} F3600
       
           RESTORE_GCODE_STATE NAME=PTC                                                #
       {% endif %}                                                                     # 


