# Backend Caterpillar Tool Change/Purge Macro
[gcode_macro _CAT_TOOL_SELECT_PURGE]
description: Tool Change Request AND/OR Purge Filament
  Usage: _CAT_TOOL_SELECT_PURGE [TOOL=<requested_tool>] [CAT_STATE=<cat_enable>] [MMU_STATE=<mmu_enable>]

# Requested Tool swap
variable_requested_tool: 0                                 # Tool request from MMU and/or User: 0 = T0, 1 = T1, etc...
variable_th_mat_match_mat_load: False                      # Default: False - Get Value From: _CAT_TH_MATERIAL_ACTUAL - Is The Material In The Toolhead Match the Material being Loaded?

# Interlock Logic State
variable_cat_enable: False                                 # Default: False - Is Caterpillar Enable?
variable_mmu_enable: False                                 # Default: False - Is MMU Enable?
variable_mmu_tool_swap_required: False                     # Default: False - Is a Tool Swap required?
variable_printing: False                                   # Default: False - Is there a print in Progress?
variable_cat_move_pre_cal: False                           # Default: False - Do Pre-Move Calculation need to be Executed?
variable_cat_move_save_value: False                        # Default: False - Does Operational GCode Value need to be Executed?
variable_cat_move_to_park: False                           # Default: False - Does Tool Head need to Move to Park?
variable_cat_purge_material_swap: False                    # Default: False - Is a Filaments Purge between Two Different Material Required?
variable_mmu_tool_swap: False                              # Default: False - Does the MMU need to Swap Tool?
variable_cat_purge: False                                  # Default: False - Is a Filaments Purge Required?
variable_cat_op_return_print: False                        # Default: False - Does The Tool Head Need To Resume Printing?

# Gantry Safe Tool Head Move
variable_safe_z_Gantry_transit: 10                         # (mm) From Parameters - Safe Z Hight Transit for Purge Actions 
variable_safe_z_Gantry_transit_velo: 3600                  # (mm/sec) From Parameters - Gantry Velocity Z Transition

# Gantry Purge Position
variable_x_purge: 6                                        # (mm) From Parameters - Toolhead Purge Position X   
variable_y_purge: 358                                      # (mm) From Parameters - Toolhead Purge Position Y    
variable_xy_purge_velo: 3600                               # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position    
variable_z_purge: 5.2                                      # (mm) From Parameters - Toolhead Purge Position Z - The Toolhead resting on the Surface of the Caterpillar Track (GT2 Belt) - Also see: variable_cat_z_tool_gap_dist
variable_z_purge_velo: 3600                                # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position    

# Gantry Brush Position
variable_y_brush: 358                                      # (mm) From Parameters - Toolhead Brush Position Y   
variable_z_brush: 1.5                                      # (mm) From Parameters - Toolhead Brush Position Z 
variable_z_brush_velo: 3600                                # (mm/sec) From Parameters - Toolhead Brush Position Z   
variable_x_brush_start: 81                                 # (mm) From Parameters - Toolhead Brush Start Position X 
variable_x_brush_end: 120                                  # (mm) From Parameters - Toolhead Brush End Position X
variable_xy_brush_velo: 3600                               # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Brush Position
variable_xy_brush_slow_velo: 2000                          # (mm/sec) From Parameters - Toolhead Slow Velocity Transition XY To Brush Position 

# Tool Status
variable_actual_tool: 0                                    # Actual Loaded Tool Number - From _CAT_MUX_MERGE_FILAMENT_PARAM - 0 = T0, 1 = T1, etc...
variable_first_layer_tool: 0                               # First Layer Tool Number - From _CAT_MUX_MERGE_FILAMENT_PARAM - 0 = T0, 1 = T1, etc...

# Operational Z Safe Tool Head Go To Purge Transit
variable_op_safe_z_in_out_transit: 0                       # (mm) Calculation - Incremental Z For Save Transit Back/Fort Caterpillar and Printed Part ##### Key Variable #####
variable_preset_x_safe: 5                                  # (mm) From Parameters - Operational Snap Tool Head Move Value - X
variable_preset_y_safe: 5                                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Y 
variable_preset_z_safe: 5                                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Z 
variable_op_retract_dist: 0.5                              # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Operational Snap Tool Head Move Value - retract distance
variable_op_retract_velo: 1800                             # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Operational Snap Tool Head Move Value - retract velocity

# Operational Printed Part Resume Position
variable_op_part_fan_velo: 0                               # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Fan Part Velocity
variable_op_part_toolhead_temp: 0                          # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Toolhead Temperature
variable_op_pressure_advance: 0.040                        # (mm?) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Pressure Advance 
variable_op_pressure_advance_smooth: 0.040                 # (mm?) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Pressure Advance Smooth 
variable_op_z-offset: 0                                    # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Z-Offset  
variable_op_enclosure_temp: 0                              # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Enclosure Temperature
variable_op_speed_factor: 0                                # From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Speed Factore 
variable_op_extrusion_factor: 0                            # From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Extrusion Factore

# Caterpillar Setting
variable_cat_z_tool_gap_dist: 1                            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Gap Toolhead to Track(GT2 Belt) 
variable_cat_fila_extrude_temp: 0                          # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Toolhead Extruder Temperature
variable_cat_enclosure_temp: 0                             # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Enclosure Temperature
variable_cat_part_fan_velo: 0                              # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Part Fan Velocity 
variable_cat_pressure_advance: 0                           # (mm?) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Pressure Advance 
variable_cat_pressure_advance_smooth: 0                    # (mm?) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Pressure Advance Smooth 
variable_cat_z-offset: 0                                   # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Z-Offset  
variable_cat_enclosure_temp: 0                             # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Enclosure Temperature
variable_cat_speed_factor: 0                               # From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Speed Factore 
variable_cat_extrusion_factor: 0                           # From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Extrusion Factore 
variable_cat_strip_requested: 5                            # (Qty) From _CAT_MUX_MERGE_FILAMENT_PARAM - Number of Strip Requested
variable_cat_strip_quantity_min: 3                         # (Qty) From _CAT_MUX_MERGE_FILAMENT_PARAM - Minimum Strip Quantity
variable_cat_strip_quantity_max: 5                         # (Qty) From _CAT_MUX_MERGE_FILAMENT_PARAM - Maximum Strip Quantity
variable_cat_strip_dist: 30                                # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Lenght
variable_cat_strip_velo: 400                               # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity 
variable_cat_strip_velo_slow: 100                          # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity Slow 
variable_cat_strip_gap_dist: 5                             # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Lenght 
variable_cat_strip_gap_velo: 20                            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Velocity 
variable_cat_strip_clear_track_dist: 100                   # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Clear Out Lenght 
variable_cat_strip_clear_track_velo: 3600                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Clear Out Velocity  
variable_cat_retract_dist: 0.5                             # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance 
variable_cat_retract_velo: 1800                            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity 
variable_cat_retract_velo_slow: 900                        # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Slow 
variable_cat_retract_exit_dist: 1.5                        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance Exit 
variable_cat_retract_exit_velo: 3600                       # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Exit 
variable_cat_retract_exit_velo_slow: 2000                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Slow Exit  
variable_cat_unretract_dist: 0.5                           # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Distance  
variable_cat_unretract_velo: 1800                          # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity  
variable_cat_unretract_velo_slow: 900                      # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity Slow
variable_cat_unretract_exit_dist: 1                        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Distance Exit 
variable_cat_unretract_exit_velo: 3600                     # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity Exit
variable_cat_unretract_exit_velo_slow: 2000                # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity Slow Exit 
variable_cat_zhop_dist: 1                                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Distance 
variable_cat_zhop_velo: 27000                              # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Velocity  
variable_cat_zhop_exit_dist: 2                             # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Distance  
variable_cat_zhop_exit_velo: 27000                         # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Velocity 
gcode:
  # Tool Swap Request Value
  {% set TOOL = params.TOOL|default(requested_tool)|int %}                                  # Tool request from MMU and/or User: 0 = T0, 1 = T1, etc...
  {% set CAT_STATE = params.CAT_STATE|default(cat_enable) %}                                # Caterpillar - Enable/Disable Request
  {% set MMU_STATE = params.MMU_STATE|default(mmu_enable) %}                                # MMU - Enable/Disable Request

  # Is Caterpillar Enable?
  {% if cat_enable %}                                                            # Caterpillar Enable and All Parameters Set - Enable/Disable State
    M118 Caterpillar Enable and Ready
    
	# Is MMU Enable?
	{% if mmu_enable %}                                                               # mmu_enable - Enable/Disable State
	  M118 MMU Enable
      
	  # Is a Print In Progress?
      {% if printing %}                                                                               # Printing - Enable/Disable State
        
        ###################
        # Make decision If a Tool Swap and Purge, or Just a Purge                      <---------------------------------------        <---------------------------------------

        # Pull Values From: _CAT_TH_MATERIAL_ACTUAL

# variable_requested_tool: 0                                 # Tool request from MMU and/or User: 0 = T0, 1 = T1, etc...
# variable_op_requested_tool: 0                              # Tool request from Slicer: 0 = T0, 1 = T1, etc... 
# variable_th_mat_match_mat_load: False                      # Default: False - Get Value From: _CAT_TH_MATERIAL_ACTUAL - Is The Material In The Toolhead Match the Material being Loaded?
# variable_th_color_match_color_load: False                  # Default: False - Get Value From: _CAT_TH_COLOR_PURGE - Is The Material Color In The Toolhead Match the Material Color being Loaded?
# variable_mmu_tool_swap_required: False                     # Default: False - Is a Tool Swap required?
# variable_tool_loaded: False                                # Default: False - Is MMU Tool Loaded to the Toolhead?
# variable_cat_purge_material_swap: False                    # Default: False - Is a Filaments Purge between Two Different Material Required?
# variable_mmu_tool_swap: False                              # Default: False - Does the MMU need to Swap Tool?
# variable_cat_purge: False                                  # Default: False - Is a Filaments Purge Required?

#cat_move_pre_cal
#cat_move_save_value
#cat_move_to_park
#mmu_tool_swap
#cat_purge_material_swap
#cat_purge
#cat_op_return_print


        ###################


        # If/Then Argument
        SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_move_pre_cal VALUE={True}


        # If/Then Argument      
        SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=mmu_tool_swap VALUE={True}


        # If/Then Argument           
        SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_purge_material_swap VALUE={True} 


        # If/Then Argument           
        SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_purge VALUE={True} 


        # Get Actual Toolhead Position Values:
        {% set max_x = printer.toolhead.axis_maximum.x|float %}
        {% set max_y = printer.toolhead.axis_maximum.y|float %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set act_x = printer.toolhead.position.x|float %}
        {% set act_y = printer.toolhead.position.y|float %}
        {% set act_z = printer.toolhead.position.z|float %}

        # Print in Progress: Get curent position values and Calculate Safe Move Instructions
	    {% if cat_move_pre_cal %}                                 # cat_move_pre_cal - Enable/Disable State

          # Safe x Snap Move
          {% if act_x > preset_x_safe %}                                                   # Verify This codes <---------------------------------------
            {% set x_safe = preset_x_safe %}                                               # Verify This codes <---------------------------------------
          {% else %}                                                                       # Verify This codes <---------------------------------------
            {% set x_safe = max_x - act_x %}                                               # Verify This codes <---------------------------------------
          {% endif %} 

          # Safe y Snap Move
          {% if act_y > preset_y_safe %}                                                   # Verify This codes <---------------------------------------
            {% set y_safe = preset_y_safe %}                                               #  Verify This codes <---------------------------------------
          {% else %}                                                                       # Verify This codes <---------------------------------------
            {% set y_safe = max_y - act_y %}                                               #  Verify This codes <---------------------------------------
          {% endif %} 

          # Safe Z Snap Move
          {% if act_z < (max_z - preset_z_safe) %}                                         # Verify This codes <---------------------------------------
            {% set z_safe = preset_z_safe %}                                               # Verify This codes <---------------------------------------
          {% else %}                                                                       # Verify This codes <---------------------------------------
            {% set z_safe = max_z - act_z %}                                               # Verify This codes <---------------------------------------
          {% endif %} 

          # Safe Minimum Z Hight for XY Transit Move Calculation
          {% if (act_z + z_safe) > op_safe_z_in_out_transit %}                             # Verify This codes <---------------------------------------
            SET_GCODE_VARIABLE MACRO=_CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE VARIABLE=tz_return VALUE={act_z + z_safe}
          {% endif %} 

          SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=x_safe VALUE={x_safe}   # 
          SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=y_safe VALUE={y_safe}   # 
          SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=z_safe VALUE={z_safe}   # 

          SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=op_target_x VALUE={act_x}            # 
          SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=op_target_y VALUE={act_y}            # 
          SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=op_target_z VALUE={act_z + z_safe}   # 
          
          #SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_move_pre_cal VALUE={False}   # Set Toolhead move Pre-Calculation To Disable 
          SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_move_save_value VALUE={True}     # 

	    {% endif %}                                               # cat_move_pre_cal - Enable/Disable State
        
		# Does Operational Retract need to be excecuted ang Gcodes Stat Saved?
	    {% if cat_move_save_value %}                                # cat_move_save_value - Enable/Disable State
	      M118 Filament Retract and Save Operational GCode Values

          G1 E-{op_retract_dist} F{op_retract_velo}                                       # Operational Retract

          SAVE_GCODE_STATE NAME=CTSP                                                      # Save Curent Gcode State under CTSP

          # Save all Others: "Operational Printed Part Resume Position" that are not Saved under: SAVE_GCODE_STATE  <---------------------------------------

          SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_move_to_park VALUE={True}       # 

	    {% endif %}                                           # cat_move_save_value - Enable/Disable State
        
		# Does Tool Head need to Move to Park During Operational Printing?
	    {% if cat_move_to_park %}                                    # cat_move_to_park - Enable/Disable State
	      M118 Tool Head Move To Park From Operational Printing

          # Snap Save Move XYZ
          G91                                                                              # 
          G1 X{x_safe} Y{y_safe} Z{z_safe} F900                                            # 
          G90                                                                              # 

          _CAT_TH_INBOUND_VERTICAL_TRANSIT_TO_ELEVATOR_POSITION_XY
          _CAT_TH_INBOUND_SAVE_TRANSIT_XY_TO_ELEVATOR_POSITION_XY
          _CAT_TH_INBOUND_TOP_Z_ELEVATOR_TO_BASE_POSITION
          _CAT_TH_ELEVATOR_POSITION_TO_PARK_POSITION
          
	    {% endif %}                                                  # cat_move_to_park - Enable/Disable State

		# Does the MMU need to Swap Tool?
	    {% if mmu_tool_swap %}                                # mmu_tool_swap - Enable/Disable State
          M118 Swaping Filament

          # Pull and update all Value according to curent Filament Type and Color From:  _CAT_MUX_MERGE_FILAMENT_PARAM
          # Pull Values From: _CAT_TH_MATERIAL_ACTUAL
          # ---> Not sure:  SET_GCODE_VARIABLE MACRO=CAT_UPDATE_TOOL VARIABLE=actual_tool VALUE={TOOL}
          # ---> Not sure:  SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=requested_tool VALUE={TOOL}
          # ---> Not sure:  CAT_UPDATE_TOOL
          
		  # Is a Filaments Purge between Two Different Material Required?
		  {% if cat_purge_material_swap %}                                         # cat_purge_material_swap - Enable/Disable State 
		    M118 Material swap Between Two Material Necessary
            # Pull and update all Value according to Filament Type and Color From:  _CAT_MUX_MERGE_FILAMENT_PARAM
            _CAT_PURGE_MATERIAL_SWAP
            # Update Values To: _CAT_TH_MATERIAL_ACTUAL
            #-----> Replace Purge Quantity from purge number if it is a higher value then the color swap number
            
		  {% else %}                                                         # cat_purge_material_swap - Enable/Disable State 
		    M118 No Different Material swap Necessary
            # Pull and update all Value according to Filament Type and Color From:  _CAT_MUX_MERGE_FILAMENT_PARAM
            #------> Set purge to color tool swap purge
            
		  {% endif %}                                                        # cat_purge_material_swap - Enable/Disable State 

          # -----> Set quantity of strip to purge 

          # Set New Filament Type, Color, And Tool ID Values

      
	      {% if (printer.ercf.is_paused|int == 1) %}                                                      # mmu_pause - Enable/Disable State

            M118 Tool Head to Park Position
            M118 You can't resume the print without unlocking the MMU first.
            M118 The MMU is Paused: Solve any issue before activating MMU_RESUME

	      {% else %}                                                                                      # mmu_pause - Enable/Disable State

            SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_purge VALUE={True}

	      {% endif %}                                                                                     # mmu_pause - Enable/Disable State

	    {% else %}                                            # mmu_tool_swap - Enable/Disable State
		  M118 No swap necessary
          
	    {% endif %}                                           # mmu_tool_swap - Enable/Disable State
        
		# Is a Filaments Purge Required?
	    {% if cat_purge %}                                    # cat_purge - Enable/Disable State
	      M118 Filament Purge

          # Excucute Macro:  _CAT_MUX_MERGE_FILAMENT_PARAM

          # Pull all datas From:  _CAT_MUX_MERGE_FILAMENT_PARAM

          # Disable Clog Sensor For all purge, except the exit purge:  Re-enable clog Sensor for Exit Purge  (Provide Option ENABLE/DISABLE in Parameters)

          #Provide Logic For Filament Runout Sensor

          CAT_PURGE_TRAP_OPEN

          G92 E0                                                         # Zero Extruder  retract_op_speed

          ##### Strip Transit & Initial Gap #####
   
          G90                                                            # Absolute Positioning
          G1 E-{cat_retract_dist} F{cat_retract_velo}                    # Retract Operational
          G0 Z{safe_z_Gantry_transit} F{safe_z_Gantry_transit_velo}      # Z Safe Transit
          G0 X{x_purge} Y{y_purge} F{xy_purge_velo}                      # XY Purge Position 

          G90                                                            # Absolute Positioning
          FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

          ##### Initial Strip #####
   
          G0 Z{z_purge - cat_z_tool_gap_dist} F{z_purge_velo}            # Z Purge distance from Track (GT2 Timing Belt)
          G1 E{cat_unretract_dist} F{cat_unretract_velo}                 # Unretract Filament

          _CAT_ENABLE_TRACK_SYNC
          G1 E{cat_strip_dist} F{cat_strip_velo}                         # Purge Filament Strip - Standard Speed
   
          _CAT_DISABLE_TRACK_SYNC
          G92 E0                                                         # Zero Extruder
          G1 E-{cat_retract_dist} F{cat_retract_velo}                    # Retract Operational
   
          #G91
          #G1 Z{cat_zhop_dist}  F{cat_zhop_velo}                         # Caterpillar Z Hop
   
          G90                                                            # Absolute Positioning
          FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

		  # x Number Standard Purge Strip
		  {% for i in range(cat_strip_requested) %}
		    M118 Standard Purge Strip {1+i}
   
            G0 Z{z_purge - cat_z_tool_gap_dist} F{z_purge_velo}          # Z Purge distance from Track (GT2 Timing Belt)
            G1 E{cat_unretract_dist} F{cat_unretract_velo}               # Unretract Filament

            _CAT_ENABLE_TRACK_SYNC
            G1 E{cat_strip_dist} F{cat_strip_velo}                       # Purge Filament Strip - Standard Speed
   
            _CAT_DISABLE_TRACK_SYNC
            G92 E0                                                       # Zero Extruder
            G1 E-{cat_retract_dist} F{cat_retract_velo}                  # Retract Operational
   
            #G91
            #G1 Z{cat_zhop_dist}  F{cat_zhop_velo}                       # Caterpillar Z Hop
   
            G90                                                          # Absolute Positioning
            FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap
            
		  {% endfor %}
          
          M118 Exit Purge Strip

          # Return To Operational Print
          G0 Z{z_purge - cat_z_tool_gap_dist} F{z_purge_velo}           # Z Purge distance from Track (GT2 Timing Belt)
          G1 E{cat_unretract_dist} F{cat_unretract_velo}                # Unretract Operational

          _CAT_ENABLE_TRACK_SYNC
          G1 E{cat_strip_dist} F{cat_strip_velo_slow}                   # Purge Filament Strip - Slow Speed

          _CAT_DISABLE_TRACK_SYNC
          G92 E0                                                        # Zero Extruder
          G1 E-{cat_retract_exit_dist} F{cat_retract_exit_velo}         # Retract Operational

          G91
          G1 Z{cat_zhop_exit_dist} F{cat_zhop_exit_velo}                # Caterpillar Z Hop Exit Purge
          G90

          G92 E0                                                        # Zero Extruder

          ##### End Purge #####

          SET_GCODE_VARIABLE MACRO=_CAT_TOOL_SELECT_PURGE VARIABLE=cat_op_return_print VALUE={True}

          CAT_PURGE_TRAP_CLOSE

	    {% else %}                                             # cat_purge - Enable/Disable State
	      M118 No Filament Purge
          
	    {% endif %}                                            # cat_purge - Enable/Disable State

		# Does The Tool Head Need To Resume Printing?
	    {% if cat_op_return_print %}                                           # cat_op_return_print - Enable/Disable State
          # Return To Print? 
	      
	      {% if (printer.ercf.is_paused|int == 1) %}                        # Is The MMU Paused?
            M118 Tool Head to Park Position
            M118 You can't resume the print without unlocking the MMU first.
            M118 The MMU is Paused: Solve any issue before activating MMU_RESUME

          {% else %}                                                        # Is The MMU Paused?
            # MMU Operational: Returning To Print
            M118 Tool Head Reterning To Print

            _CAT_TH_OUTBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ
            _CAT_TH_ELEVATOR_POSITION_TO_SAFE_XY_OUTBOUND_TRANSIT_MIN_Z
            _CAT_TH_TRANSIT_MIN_Z_TO_XY_PRINT_POSITION
            _CAT_TH_TRANSIT_Z_TO_PRINT_POSITION

          {% endif %}                                                       # Is The MMU Paused?

	    {% endif %}                                                             # cat_op_return_print - Enable/Disable State

	  {% else %}                                                                                      # Printing - Enable/Disable State
        M118 There Is No Printing In Progress

	  {% endif %}                                                                                     # Printing - Enable/Disable State
	  
	{% else %}                                                                      # mmu_enable - Enable/Disable State
	  M118 The MMU is Disable
      
	{% endif %}                                                                     # mmu_enable - Enable/Disable State
	
  {% else %}                                                                        # Caterpillar Enable and All Parameters Set - Enable/Disable State
    M118 Initializing Caterpillar: Setting/Updating All Variables

    ################################################
    # Pull/Update Data From all Available Variable #
    ################################################
    
    _CAT_MMU_INTERFACE
    _CAT_SLICER_INTERFACE
    _CAT_TH_MATERIAL_ACTUAL
    _CAT_TH_COLOR_PURGE

    {% set tool_loaded = printer["gcode_macro _CAT_MMU_INTERFACE"].tool_loaded %}
    {% set actual_tool = printer["gcode_macro _CAT_MMU_INTERFACE"].actual_tool %}
    {% set first_layer_tool_valid = printer["gcode_macro _CAT_SLICER_INTERFACE"].first_layer_tool_valid %}       
    {% set first_layer_tool = printer["gcode_macro _CAT_SLICER_INTERFACE"].first_layer_tool %}
    {% set th_mat_match_mat_load = printer["gcode_macro _CAT_TH_MATERIAL_ACTUAL"].th_mat_match_mat_load %} 
    {% set th_color_match_color_load = printer["gcode_macro _CAT_TH_COLOR_PURGE"].th_color_match_color_load %} 

    _CAT_MMU_HOME

    {% if (printer.ercf.is_paused|int == 1) %}                        # Is The MMU Paused?
      M118 Tool Head to Park Position
      M118 You can't resume the print without unlocking the MMU first.
      M118 The MMU is Paused: Solve any issue before activating MMU_RESUME

    {% else %}                                                       # Is The MMU Paused?

      {% if tool_loaded %}                 # Is Material Loaded To Toolhead?

        M118 Error!

      {% else %}                           # Is Material Loaded To Toolhead?

        {% if first_layer_tool_valid %}      # First Layer Tool ID Valid?

          {% if th_mat_match_mat_load %}     # Is The Material In The Toolhead Match the Material being Loaded?

            {% if first_layer_tool != actual_tool %}   # The First Layer Tool Request Does Not Match The Actual Loaded Tool?
        
              MMU_CHANGE_TOOL TOOL={first_layer_tool}

            {% else %}                           # The First Layer Tool Request Does Not Match The Actual Loaded Tool?

              M118 First Layer Tool Already Loaded: T{first_layer_tool}

            {% endif %}                          # The First Layer Tool Request Does Not Match The Actual Loaded Tool?

          {% else %}                           # Is The Material In The Toolhead Match the Material being Loaded?

          {% endif %}                          # Is The Material In The Toolhead Match the Material being Loaded?

        {% else %}                           # First Layer Tool ID Valid?

        {% endif %}                          # First Layer Tool ID Valid?

      {% endif %}                           # Is Material Loaded To Toolhead?

    {% endif %}                                                     # Is The MMU Paused?

    M118 Caterpillar Set and Ready
    
  {% endif %}                                                                        # Caterpillar Enable and All Parameters Set - Enable/Disable State


[gcode_macro _CAT_ENABLE_TRACK_SYNC]
# Engage Caterpillar Track
gcode:
   SYNC_EXTRUDER_MOTION EXTRUDER="caterpillar_track" MOTION_QUEUE=extruder


[gcode_macro _CAT_DISABLE_TRACK_SYNC]
# Disengage Caterpillar Track
gcode:
   SYNC_EXTRUDER_MOTION EXTRUDER="caterpillar_track" MOTION_QUEUE=

