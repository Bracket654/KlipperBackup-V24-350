# Move Toolhead To CAT Park Position - Not Used During Printing Operation
[gcode_macro _CAT_TH_PARK_POSITION]
# Gantry Safe Tool Head Move
variable_safe_z_Gantry_transit: 10                         # (mm) From Parameters - Safe Z Hight Transit for Purge Actions 
variable_safe_z_Gantry_transit_velo: 3600                  # (mm/sec) From Parameters - Gantry Velocity Z Transition

# Gantry Park Position
variable_x_park: 34                                        # (mm) From Parameters - Toolhead Park Position X
variable_y_park: 358                                       # (mm) From Parameters - Toolhead Park Position Y
variable_xy_park_velo: 3600                                # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position  
variable_z_park: 6                                         # (mm) From Parameters - Toolhead Park Position Z 
variable_z_park_velo: 3600                                 # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position    

# Gantry Brush Position
variable_y_brush: 358                                      # (mm) From Parameters - Toolhead Brush Position Y   
variable_z_brush: 1.5                                      # (mm) From Parameters - Toolhead Brush Position Z 
variable_z_brush_velo: 3600                                # (mm/sec) From Parameters - Toolhead Brush Position Z   
variable_x_brush_start: 81                                 # (mm) From Parameters - Toolhead Brush Start Position X 
variable_x_brush_end: 120                                  # (mm) From Parameters - Toolhead Brush End Position X
variable_xy_brush_velo: 3600                               # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Brush Position
gcode:
  G90                                                            # absolute positioning
  G0 Z{safe_z_Gantry_transit} F{safe_z_Gantry_transit_velo}      # Z Safe Transit
  G0 X{x_brush_start} Y{y_brush} F{xy_brush_velo}                # Brush Position XY
  G0 Z{z_brush} F{z_brush_velo}
  G0 X{x_brush_end} Y{y_brush} F{xy_brush_velo}                  # Brush End Position XY
  G0 X{x_brush_start} Y{y_brush} F{xy_brush_velo}                # Brush Position XY
          
  G0 Z{safe_z_Gantry_transit} F{safe_z_Gantry_transit_velo}      # Z Safe Transit 
  G0 X{x_park} Y{y_park} F{xy_park_velo}                         # XY Gantry Park Position
  G0 Z{z_park} F{z_park_velo}                                    # Z Gantry Park Position

  G1 E{cat_unretract_exit_dist} F{cat_unretract_exit_velo_slow}  # Unretract Operational

  G92 E0                                                         # Zero Extruder


# Toolhead Transition Outbound From Purge To Elevator Position - Only Used During Printing Operation
[gcode_macro _CAT_TH_OUTBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ] 
# Gantry Safe Tool Head Move
variable_safe_z_Gantry_transit: 10                         # (mm) From Parameters - Safe Z Hight Transit for Purge Actions 
variable_safe_z_Gantry_transit_velo: 3600                  # (mm/sec) From Parameters - Gantry Velocity Z Transition

# Gantry Brush Position
variable_y_brush: 358                                      # (mm) From Parameters - Toolhead Brush Position Y   
variable_z_brush: 1.5                                      # (mm) From Parameters - Toolhead Brush Position Z 
variable_z_brush_velo: 3600                                # (mm/sec) From Parameters - Toolhead Brush Position Z   
variable_x_brush_start: 81                                 # (mm) From Parameters - Toolhead Brush Start Position X 
variable_x_brush_end: 120                                  # (mm) From Parameters - Toolhead Brush End Position X
variable_xy_brush_velo: 3600                               # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Brush Position
variable_xy_brush_slow_velo: 2000                          # (mm/sec) From Parameters - Toolhead Slow Velocity Transition XY To Brush Position
gcode:
  G90                                                                             # absolute positioning
  G0 Z{safe_z_Gantry_transit} F{safe_z_Gantry_transit_velo}                       # Z Safe Transit
  G0 X{x_brush_start} Y{y_brush} F{xy_brush_velo}                                 # Brush Position XY
  G0 Z{z_brush} F{z_brush_velo}
      
    # Restore all Others Operatinal Printing state that are not Saved under: SAVE_GCODE_STATE   <------------------ Will Need Code For That
            
    # restore all previous values under:  _CAT_MUX_MERGE_FILAMENT_PARAM
