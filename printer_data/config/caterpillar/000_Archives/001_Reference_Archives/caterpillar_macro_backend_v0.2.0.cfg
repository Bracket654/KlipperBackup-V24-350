  G0 X{x_brush_end} Y{y_brush} F{xy_brush_slow_velo}                                # Brush End Position XY


# Toolhead From Elevator Position To Minimum Safe Z Transit - Only Used During Printing Operation
[gcode_macro _CAT_TH_ELEVATOR_POSITION_TO_SAFE_XY_OUTBOUND_TRANSIT_MIN_Z]
# Gantry Safe Tool Head Move
variable_safe_z_Gantry_transit: 10                         # (mm) From Parameters - Safe Z Hight Transit for Purge Actions 
variable_safe_z_Gantry_transit_velo: 3600                  # (mm/sec) From Parameters - Gantry Velocity Z Transition 

# Gantry Low Z in/out Safe Tool Head Move
variable_op_safe_z_low_in_out: 10                          # (mm) From Parameters - Toolhead Below safe_z_Gantry_transit Value - Save Z Hight
variable_op_safe_z_low_z_in_out_velo: 3600                 # (mm/sec) From Parameters - Toolhead Below op_safe_z_low_in_out - TO/FROM Buildplate - Toolhead Velocity Transition Z
variable_op_safe_x_low_z_in_out: 120                       # (mm) From Parameters - Toolhead Below op_safe_z_low_in_out - TO/FROM Buildplate - Position X
variable_op_safe_y_low_z_in_out: 300                       # (mm) From Parameters - Toolhead Below op_safe_z_low_in_out - TO/FROM Buildplate - Position Y    
variable_op_safe_xy_low_z_in_out_velo: 3600                # (mm/sec) From Parameters - Toolhead Below op_safe_z_low_in_out - TO/FROM Buildplate - Toolhead Velocity Transition XY   
   
# Gantry Low Z in/out Safe Tool Head Move
variable_op_safe_x_high_z_in_out: 120                      # (mm) From Parameters - Toolhead Above op_safe_z_low_in_out - TO/FROM Buildplate - Position X 
variable_op_safe_y_high_z_in_out: 358                      # (mm) From Parameters - Toolhead Above op_safe_z_low_in_out - TO/FROM Buildplate - Position Y  
variable_op_safe_xy_high_z_in_out_velo: 3600               # (mm/sec) From Parameters - Toolhead Above op_safe_z_low_in_out - TO/FROM Buildplate - Toolhead Velocity Transition XY
variable_op_safe_z_high_z_in_out_velo: 3600                # (mm/sec) From Parameters - Toolhead Above op_safe_z_low_in_out - TO/FROM Buildplate - Toolhead Velocity Transition Z 

# Operational Z Safe Tool Head Go To Purge Transit
variable_op_safe_z_in_out_transit: 0                       # (mm) Calculation - Incremental Z For Save Transit Back/Fort Caterpillar and Printed Part ##### Key Variable #####
variable_op_safe_z_in_out_transit_velo: 3600               # (mm/sec) From Parameters - Z Elevator UP/Down velocity

# Operational Printed Part Resume Position
variable_op_target_x: 0                                    # (mm) Calculation - Ref: x_safe - Return To Printed Part X
variable_op_target_y: 0                                    # (mm) Calculation - Ref: y_safe - Return To Printed Part Y  
variable_op_target_z: 0                                    # (mm) Calculation - Ref: z_safe and op_safe_z_in_out_transit - Return To Printed Part Z
variable_op_target_XYZ_transit_velo: 1550                  # (mm/sec) From Parameters - XYZ Transit back to Part Velocity
gcode:
  {% if op_safe_z_in_out_transit < safe_z_Gantry_transit %}                                  # <------------------ Check This
    G0 Z{op_safe_z_low_in_out} F{op_safe_z_low_z_in_out_velo}                                # Actually its going To Be The Return Safe Z <------------------ Check This
    G0 X{op_safe_x_low_z_in_out} Y{op_safe_y_low_z_in_out} F{op_safe_xy_low_z_in_out_velo}   # XY step fwd to the porch

  {% else %}                                                                        # 
    G90                                                                             # absolute positioning
    G1 Z{op_safe_z_in_out_transit} F{op_safe_z_in_out_transit_velo}                 # Go up above safe_z_Gantry_transit
  {% endif %}                                                                       # 


