###### ERCF EASY BRD v1.1 - USB Port ######################################################
## Caterpillar - Ejection Assisted Purge System: Config file for the ERCF EASY BRD v1.1
## This file contains common pin mappings for the Seeeduino XIAO.
## To use this config, the firmware should be compiled for the
## SAMD21G18 with "Internal clock" and a "8KiB bootloader".
## This config sample assume you set the two J6 jumpers on 1-2 and 4-5, i.e. [..].[..]


## Caterpillar Track Stepper Motor
## ERCF EASY BRD v1.1
[extruder_stepper caterpillar_track]
#extruder: extruder                 # Not Used In That Configuration
extruder:                           # Default: <No Value> - Configuration For Sync Caterpillar Stepper Motor with Extruder
step_pin: caterpillar:PA4           # Default: caterpillar:PA4
dir_pin: !caterpillar:PA10          # Default: !caterpillar:PA10  
enable_pin: !caterpillar:PA2        # Default: !caterpillar:PA2
rotation_distance: 50	            # Tune treadmill filament extrusion lenght ---> rotation_distance = <belt_pitch> * <number_of_teeth_on_pulley>
gear_ratio: 40:20                   # Default: 40:20 
microsteps: 16                      # Please do not go higher than 16, this can cause 'MCU Timer too close' issues under Klipper
full_steps_per_rotation: 200	    # 200 for 1.8 degree, 400 for 0.9 degree
#velocity: 10                       # Not Used In That Configuration
#accel: 100                         # Not Used In That Configuration


## Caterpillar Track Stepper Driver
## ERCF EASY BRD v1.1
[tmc2209 extruder_stepper caterpillar_track]
## NEMA17 motors, you'll usually set the stealthchop_threshold to 0
## and use higher current
uart_pin: caterpillar:PA8          # Default: caterpillar:PA8 
uart_address: 0                    # Default: 0 
interpolate: True                  # Default: True
run_current: 0.4                   # Default: 0.4 
#hold_current: 0.1                 # Not Used In That Configuration        
sense_resistor: 0.110              # Default: 0.110 
stealthchop_threshold: 0           # Default: 0


## Servo For Caterpillar Purge Trap Door
## ERCF EASY BRD v1.1
## Values are for the MG90S servo
[servo caterpillar_ejection_trap]
pin: caterpillar:PA5               # Default: caterpillar:PA5
maximum_servo_angle: 180           # Default: 180 
minimum_pulse_width: 0.00085       # Default: 0.00085 
maximum_pulse_width: 0.00215       # Default: 0.00215


