[gcode_macro _CAT_PARAMETERS]

# Caterpillar Filament Color Factor
variable_tool_00_to_01: 5                         # Number of Strip
variable_tool_00_to_02: 5                         # Number of Strip
variable_tool_00_to_03: 5                         # Number of Strip
variable_tool_01_to_00: 5                         # Number of Strip
variable_tool_01_to_02: 5                         # Number of Strip
variable_tool_01_to_03: 5                         # Number of Strip
variable_tool_02_to_00: 5                         # Number of Strip
variable_tool_02_to_01: 5                         # Number of Strip
variable_tool_02_to_03: 5                         # Number of Strip
variable_tool_03_to_00: 5                         # Number of Strip
variable_tool_03_to_01: 5                         # Number of Strip
variable_tool_03_to_02: 5                         # Number of Strip


# Caterpillar Purge Strip Calculator
variable_tool_Initial_Purge: 7                    # Number of Strip For Initial Purge
variable_cat_purge_strip_number: 2                # Total number of strip to purge; minimum 2
variable_cat_purge_strip_max: 5                   # Total maximum number of strip to purge


# Caterpillar Tuning
variable_rotation_distance: 50                    # Default: 50 - Tune treadmill filament extrusion lenght ---> rotation_distance = <belt_pitch> * <number_of_teeth_on_pulley>
variable_cat_gap_velocity: 20                     # Gap Speed
variable_cat_strip_velocity: 400                  # Strip Purge Standard Speed
variable_cat_strip_slow_velocity: 100             # Strip Purge Slow Speed

# Caterpillar Filament Spec Fromm MMU
variable_retract_cat_lenght: 0.5                  # (mm) Retract Operational Lenght
variable_retract_cat_speed: 1800                  # Retract Operational Exit speed
variable_unretract_cat_lenght: 0.5                # (mm) Unetract Operational Lenght
variable_unretract_cat_speed: 1800                # Unretract Operational Speed
variable_cat_z_hop_hight: 1                       # Caterpillar Z Hop Hight
variable_cat_z_hop_speed: 27000                   # Caterpillar Z Hop Hight

variable_gap_lenght: 5                            # Filament Gap Lenght
variable_strip_lenght: 30                         # Filament Purge Strip Lenght
variable_cat_clear_track_lenght: 100              # Caterpillar Clear Strip Lenght
variable_retract_exit1_lenght: 1.5                # (mm) Retract Operational Lenght
variable_retract_exit1_speed: 3600                # Retract Operational Exit speed
variable_cat_z_hop_hight_exit1: 2                 # Caterpillar Z Hop Exit1 Hight
variable_cat_nozzle_gap: 0.2                      # (mm) Distance between end of Nozzle and Caterpillar Track


## XYZ Safe Transit - Swap/Pause/Resume ##
 # all acceleration and speed for those transit
 #Retract/Unretract
 # Z Hop
 # Etc...


## Z Safe Transit ##
variable_z_safe_transit_hight: 10                 # (mm) Z Safe Transit Hight
variable_z_safe_transit_speed: 3600               # (mm/s) Z Safe Transit speed


## Purge Park ##
variable_x_purge_park: 6                          # (mm) X Purge Park Position
variable_y_purge_park: 358                        # (mm) Y Purge Park Position
variable_xy_purge_park_speed: 3600                # (mm/s) XY Purge Park Speed
variable_z_purge_park_hight: 4                    # 4.2 # (mm) Z Purge Park Position
variable_z_purge_park_speed: 3600                 # (mm/s) Z Purge Park speed


## Safe Park ##
variable_x_safe_park: 34                       # (mm) x  Hight - Absolute Positioning
variable_y_safe_park: 358                      # (mm) y  Hight - Absolute Positioning
variable_xy_safe_park_speed: 3600              # (mm/s) xy  Speed


## Brush Park ##
variable_x_brush_park: 1.5                     # (mm) Z  Hight - Absolute Positioning
variable_y_brush_park: 1.5                     # (mm) Z  Hight - Absolute Positioning
variable_xy_brush_park_speed: 3600             # (mm/s) Z  Speed


## Purge Trap Door ##
variable_maximum_servo_angle: 180              # 
variable_servo_pulse_width_minimum: 0.00085    # 
variable_servo_pulse_width_maximum: 0.00215    # 
variable_servo_angle_open:                     # 
variable_servo_angle_close:                    # 
variable_servo_pause_open:                     # 
variable_servo_pause_close:                    # 


## Caterpillar Track Sync ##
variable_sync_post_cmd_pause:                    # 
variable_unsync_post_cmd_pause:                  # 


gcode:

