[gcode_macro _CAT_PARK_AND_RETURN]
# Comment
gcode: 
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set act_x = printer.toolhead.position.x|float %}                              # 
   {% set act_y = printer.toolhead.position.y|float %}                              # 
   {% set act_z = printer.toolhead.position.z|float %}                              # 

   {% if act_z < (max_z - 5.0) %}                                                   # 
       {% set z_safe = 5.0 %}                                                       #    
   {% else %}                                                                       # 
       {% set z_safe = max_z - act_z %}                                             #  
   {% set z_return = z_safe|float %}                                                #
   {% endif %}                                                                      # 

   G92 E0                                                                           # 
   G1 E-1.0 F1500.0                                                                 # 

   G91 
   G1 Z{z_safe} F900 

   _CAT_INBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ
   ### Pause for 1 sec
   _CAT_PARK_POSITION_TO_ELEVATOR_POSITION

  {% if z_return < 10.0 %}                                                           #
      _CAT_SAFE_XY_TRANSIT_Z_LOW_XY_IN_OUT
      G0 X{act_x} Y{act_y} F6000
      G91                                                                            #  
      G1 Z{act_z} F900 
  {% else %}                                                                         # 
      G91                                                                            # 
      G1 Z{z_return} F900                                                            #   
      G90                                                                            # 
