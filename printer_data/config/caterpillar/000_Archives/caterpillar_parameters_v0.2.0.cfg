[gcode_macro _CAT_PARAMETERS]

# Interlock Logic State
variable_cat_enable: True                                  # Wen Printer Start ENABLE/DISABLE CATERPILLAR (True = ENABLE)
variable_mmu_enable: True                                  # Wen Printer Start ENABLE/DISABLE CATERPILLAR MMU Functionality (True = ENABLE)

# Gantry Safe Tool Head Move
variable_safe_z_Gantry_transit: 10                         # (mm) From Parameters - Safe Z Hight Transit for Purge Actions 
variable_safe_z_Gantry_transit_velo: 3600                  # (mm/sec) From Parameters - Gantry Velocity Z Transition
variable_safe_xy_Gantry_transit_velo: 3600                 # (mm/sec) From Parameters - Gantry Velocity between XY Position

# Gantry Park Position
variable_x_park: 34                                        # (mm) From Parameters - Toolhead Park Position X 
variable_y_park: 358                                       # (mm) From Parameters - Toolhead Park Position Y  
variable_xy_park_velo: 3600                                # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position  
variable_z_park: 6                                         # (mm) From Parameters - Toolhead Park Position Z 
variable_z_park_velo: 3600                                 # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position   

# Gantry Purge Position
variable_x_purge: 6                                        # (mm) From Parameters - Toolhead Purge Position X   
variable_y_purge: 358                                      # (mm) From Parameters - Toolhead Purge Position Y    
variable_xy_purge_velo: 3600                               # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position    
variable_z_purge: 5.2                                      # (mm) From Parameters - Toolhead Purge Position Z - The Toolhead resting on the Surface of the Caterpillar Track (GT2 Belt) - Also see: variable_cat_z_tool_gap_dist
variable_z_purge_velo: 3600                                # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position    

# Gantry Brush Position
variable_y_brush: 358                                      # (mm) From Parameters - Toolhead Brush Position Y   
variable_z_brush: 1.5                                      # (mm) From Parameters - Toolhead Brush Position Z 
variable_z_brush_velo: 3600                                # (mm/sec) From Parameters - Toolhead Brush Position Z   
variable_x_brush_start: 81                                 # (mm) From Parameters - Toolhead Brush Start Position X 
variable_x_brush_end: 120                                  # (mm) From Parameters - Toolhead Brush End Position X
variable_xy_brush_velo: 3600                               # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Brush Position
variable_xy_brush_slow_velo: 2000                          # (mm/sec) From Parameters - Toolhead Slow Velocity Transition XY To Brush Position

# Gantry Low Z in/out Safe Tool Head Move
#variable_op_safe_z_low_in_out: 10                          # (mm) From Parameters - Toolhead Below safe_z_Gantry_transit Value - Save Z Hight
variable_op_safe_z_low_z_in_out_velo: 3600                 # (mm/sec) From Parameters - Toolhead Below op_safe_z_low_in_out - TO/FROM Buildplate - Toolhead Velocity Transition Z
variable_op_safe_x_low_z_in_out: 120                       # (mm) From Parameters - Toolhead Below op_safe_z_low_in_out - TO/FROM Buildplate - Position X
variable_op_safe_y_low_z_in_out: 300                       # (mm) From Parameters - Toolhead Below op_safe_z_low_in_out - TO/FROM Buildplate - Position Y    
variable_op_safe_xy_low_z_in_out_velo: 3600                # (mm/sec) From Parameters - Toolhead Below op_safe_z_low_in_out - TO/FROM Buildplate - Toolhead Velocity Transition XY   
   
# Gantry Low Z in/out Safe Tool Head Move
variable_op_safe_x_high_z_in_out: 120                      # (mm) From Parameters - Toolhead Above op_safe_z_low_in_out - TO/FROM Buildplate - Position X 
variable_op_safe_y_high_z_in_out: 358                      # (mm) From Parameters - Toolhead Above op_safe_z_low_in_out - TO/FROM Buildplate - Position Y  
variable_op_safe_xy_high_z_in_out_velo: 3600               # (mm/sec) From Parameters - Toolhead Above op_safe_z_low_in_out - TO/FROM Buildplate - Toolhead Velocity Transition XY
variable_op_safe_z_high_z_in_out_velo: 3600                # (mm/sec) From Parameters - Toolhead Above op_safe_z_low_in_out - TO/FROM Buildplate - Toolhead Velocity Transition Z 

# Operational Z Safe Tool Head Go To Purge Transit
variable_op_safe_z_in_out_transit_velo: 3600               # (mm/sec) From Parameters - Z Elevator UP/Down velocity
variable_preset_x_safe: 5                                  # (mm) From Parameters - Operational Snap Tool Head Move Value - X
variable_preset_y_safe: 5                                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Y 
variable_preset_z_safe: 5                                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Z 

# Operational Printed Part Resume Position
variable_op_target_XYZ_transit_velo: 1550                  # (mm/sec) From Parameters - XYZ Transit back to Part Velocity

################################ To Phase Out ASAP #########################################################

## Z Safe Transit ##
variable_z_safe_transit_hight: 10                 # (mm) Z Safe Transit Hight
variable_z_safe_transit_speed: 3600               # (mm/s) Z Safe Transit speed
variable_retract_op_lenght: 0.5                   # (mm) Retract Operational Lenght
variable_retract_op_speed: 1800                   # Retract Operational Exit speed
variable_unretract_op_lenght: 0.5                 # (mm) Unetract Operational Lenght
variable_unretract_op_speed: 1800                 # Unretract Operational Speed

## Purge Park ##
variable_x_purge_park: 6                          # (mm) X Purge Park Position
variable_y_purge_park: 358                        # (mm) Y Purge Park Position
variable_xy_purge_park_speed: 3600                # (mm/s) XY Purge Park Speed
variable_z_purge_park_hight: 4                  # 4.2 # (mm) Z Purge Park Position
variable_z_purge_park_speed: 3600                 # (mm/s) Z Purge Park speed

## Caterpillar/Extruder Track ##
variable_gap_lenght: 5                            # Filament Gap Lenght
variable_strip_lenght: 30                         # Filament Purge Strip Lenght
variable_cat_clear_track_lenght: 100              # Caterpillar Clear Strip Lenght
variable_cat_gap_velocity: 20                     # Gap Speed
variable_cat_strip_velocity: 400                  # Strip Purge Standard Speed
variable_cat_strip_slow_velocity: 100             # Strip Purge Slow Speed
variable_cat_z_hop_hight: 1                       # Caterpillar Z Hop Hight
variable_cat_z_hop_speed: 27000                   # Caterpillar Z Hop Hight
variable_retract_exit1_lenght: 1.5                # (mm) Retract Operational Lenght
variable_retract_exit1_speed: 3600                # Retract Operational Exit speed
variable_cat_z_hop_hight_exit1: 2                 # Caterpillar Z Hop Exit1 Hight
variable_retract_lenght: 0.5                        # (mm) Retract Standard Lenght
variable_retract_speed: 1800                      # Retract Standard speed
variable_unretract_lenght: 0.5                      # (mm) Unretract Standard Lenght
variable_unretract_speed: 1800                    # Unretract Standard speed

## Safe Park ##
variable_x_safe_park: 34                       # (mm) x  Hight - Absolute Positioning
variable_y_safe_park: 358                      # (mm) y  Hight - Absolute Positioning
variable_xy_safe_park_speed: 3600              # (mm/s) xy  Speed

## Brush Park ##
variable_x_brush_park: 1.5                     # (mm) Z  Hight - Absolute Positioning
variable_y_brush_park: 1.5                     # (mm) Z  Hight - Absolute Positioning
variable_xy_brush_park_speed: 3600             # (mm/s) Z  Speed

gcode:

