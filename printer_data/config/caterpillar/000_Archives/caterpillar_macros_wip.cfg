# Tool Change Request AND/OR Catarpillar Park
[gcode_macro CAT_OP_TOOL_SELECT]
description: Tool Change Request AND/OR Catarpillar Park
  Usage: CAT_OP_TOOL_SELECT [TOOL=<op_requested_tool>]
variable_op_requested_tool: 0                                                                           # 

gcode:
  ################# Find all part Fan, Hot End Temperature, HVAC, And LED Setting, Others?:  Put them in variables
  # printer.fan.speed
  # Find ERCF Tool Status and Tool requested by Slicer GCode File
  # Endless spool mode and clog detection

  {% set op_fan_speed_part = printer.fan.speed %}             # Target Part Fan Speed for Resume print
  {% set cat_fan_speed_part = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].cat_fan_speed_part %}           # 
  {% set TOOL = params.TOOL|default(op_requested_tool)|int %}                                                      # 
  {% set mmu_disable = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].mmu_disable %}                         # 
  {% set mmu_bypass_gate = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].mmu_bypass_gate %}                #  !!!Do not Request MMU Tool Change when in Bypass Gate Mode!!!!
  
  # mmu_disable
  {% if mmu_disable %}                                   # Caterpillar Enable/Disable
    {% set bypass_requested = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].bypass_requested %}             #  
    {% set op_first_tool = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].op_first_tool %}                   #  
    {% set op_actual_tool = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].op_actual_tool %}                 # 

##########################

    # bypass_requested
    {% if TOOL = op_actual_tool or bypass_requested %}    # Bypass requested: by Start macro or Tool Requested is same as Actual Tool
      {% if TOOL = op_actual_tool %}                             # Bypass due to: Tool Request same as Loaded Tool
        M118 MMU Tool Swap Requested is Already Selected - Continue Printing
      {% elif bypass_requested %}                         # Bypass due to: Request from Start Macro
        SET_GCODE_VARIABLE MACRO=_CAT_OP_PRE_TOOL_CHANGE_STATE VARIABLE=bypass_requested VALUE={False}               # Reset Bypass Request
        M118 MMU Bypass requested: by Start macro - Continue Printing      
      {% endif %}
    {% elif TOOL != op_actual_tool or mmu_bypass_gate %}  # Tool Change enable or MMU in Bypass gate mode
      {% set z_return_min = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].op_z_return_minimum %}             # 
      {% set act_x = printer.toolhead.position.x|float %}         #                                                      
      {% set act_y = printer.toolhead.position.y|float %}         # 
      {% set act_z = printer.toolhead.position.z|float %}         # 
      {% set max_z = printer.toolhead.axis_maximum.z|float %}     # 
      {% set op_x_target = printer.toolhead.position.x|float %}   # Target x Coordinate for Resume print
      {% set op_y_target = printer.toolhead.position.y|float %}   # Target y Coordinate for Resume print
      {% set op_z_target = printer.toolhead.position.z|float %}   # Target z Coordinate for Resume print

      # Calculate Safe Transit Z Tool Head 
      {% if op_z_target < (max_z - 5.0) %}                        # 
        {% set z_safe = 5.0 %}                                    #  
      {% else %}                                                  # 
        {% set z_safe = max_z - op_z_target %}                    #  
      {% endif %}                                                 # 

      # Calculate if z_return_minimum need to be updated
      {% if (act_z + z_safe) > z_return_min %}                    # 
        {% z_return_min = (act_z + z_safe) %}
        SET_GCODE_VARIABLE MACRO=_CAT_OP_PRE_TOOL_CHANGE_STATE VARIABLE=op_z_return_minimum VALUE={z_return_min}      #  

      # Update Actual Print State
      SET_GCODE_VARIABLE MACRO=_CAT_OP_PRE_TOOL_CHANGE_STATE VARIABLE=op_x_target VALUE={act_x}                       #                  
      SET_GCODE_VARIABLE MACRO=_CAT_OP_PRE_TOOL_CHANGE_STATE VARIABLE=op_y_target VALUE={act_y}                       # 
      SET_GCODE_VARIABLE MACRO=_CAT_OP_PRE_TOOL_CHANGE_STATE VARIABLE=op_z_target VALUE={act_z}                       # 
      SET_GCODE_VARIABLE MACRO=_CAT_OP_PRE_TOOL_CHANGE_STATE VARIABLE=op_fan_speed_part VALUE={op_fan_speed_part}     # 

      #############################################
      ### Tool Change Request Trigger Condition ###
      #############################################
      {% set printer_mmu_status = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].printer_mmu_status %}          # 
      {% set tool_change_state_code = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].tool_change_state_code %}  #  
      
      #######  Get as many setting from:  1 - the slicer file  2- ERCF   3 - Variable Caterpillar local file

      {% set retract_op_lenght = printer["gcode_macro _CAT_PARAMETERS"].retract_op_lenght %}                          # 
      {% set retract_op_speed = printer["gcode_macro _CAT_PARAMETERS"].retract_op_speed %}                            # 
      #{% set op_z_return_minimum = printer["gcode_macro _CAT_OP_PRE_TOOL_CHANGE_STATE"].op_z_return_minimum %}        # 
      {% set z_safe_transit_speed = printer["gcode_macro _CAT_PARAMETERS"].z_safe_transit_speed %}                    # 
      {% set x_purge_park = printer["gcode_macro _CAT_PARAMETERS"].x_purge_park %}                                    # 
      {% set y_purge_park = printer["gcode_macro _CAT_PARAMETERS"].y_purge_park %}                                    # 
      {% set xy_purge_park_speed = printer["gcode_macro _CAT_PARAMETERS"].xy_purge_park_speed %}                      # 
      {% set gap_lenght = printer["gcode_macro _CAT_PARAMETERS"].gap_lenght %}                                        # 
      {% set cat_gap_velocity = printer["gcode_macro _CAT_PARAMETERS"].cat_gap_velocity %}                            # 
      {% set z_purge_park_hight = printer["gcode_macro _CAT_PARAMETERS"].z_purge_park_hight %}                        # 
      {% set unretract_op_lenght = printer["gcode_macro _CAT_PARAMETERS"].unretract_op_lenght %}                      # 
      {% set unretract_op_speed = printer["gcode_macro _CAT_PARAMETERS"].unretract_op_speed %}                        # 
      {% set strip_lenght = printer["gcode_macro _CAT_PARAMETERS"].strip_lenght %}                                    # 
      {% set cat_strip_velocity = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velocity %}                        # 
      {% set retract_lenght = printer["gcode_macro _CAT_PARAMETERS"].retract_lenght %}                                # 
      {% set cat_z_hop_hight = printer["gcode_macro _CAT_PARAMETERS"].cat_z_hop_hight %}                              # 
      {% set cat_z_hop_speed = printer["gcode_macro _CAT_PARAMETERS"].cat_z_hop_speed %}                              #      
      {% set cat_purge_strip_number = printer["gcode_macro _CAT_PARAMETERS"].cat_purge_strip_number %}                #
      {% set cat_strip_slow_velocity = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_slow_velocity %}              # 
      {% set cat_z_hop_hight_exit1  = printer["gcode_macro _CAT_PARAMETERS"].cat_z_hop_hight_exit1 %}                 # 

     
      G1 E-0.5 F1800                                                                   # retract   --------> Get the value from the slicer GCode File

      SAVE_GCODE_STATE NAME=COTSV                                                      # https://www.klipper3d.org/G-Codes.html?h=save_g#save_gcode_state
                                                                                       # GCode coordinate mode (absolute vs relative), Extrude mode (absolute vs relative), Origin, 
                                                                                       # Z offset, Speed and extrude overrides, Move speed, Current nozzle position, Relative extruder position

      G91                                                                              # 
      G1 Z{z_safe} F900                                                                # --------> will need parameter variable for velocity
      G90                                                                              # 

      _CAT_INBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ
      _CAT_ELEVATOR_POSITION_TO_PARK_POSITION

      M106 S{cat_fan_speed_part}                                                      # Set Part Cooling Fan speed for Purge
   
      # Total Number Of Strips To Purge Pre-Calculations for ForLoop
      {% cat_purge_strip_number - 2 %}                                                                                   # 
      {% cat_purge_strip_max - 2 %}                                                                                      #      
      {% if cat_purge_strip_number < 0 or cat_purge_strip_number > cat_purge_strip_max %}                                # 
        {% if cat_purge_strip_number > cat_purge_strip_max %}                                                            # 
          {% cat_purge_strip_number = cat_purge_strip_max %}                                                             # 
        {% elif cat_purge_strip_number < 0 and cat_purge_strip_number <= cat_purge_strip_max %}                          # 
          {% cat_purge_strip_number = 0 %}                                                                               # 
        {% endif %}
      {% elif cat_purge_strip_number >= 0 and cat_purge_strip_number >= cat_purge_strip_max%}                            # 
        {% cat_purge_strip_number = cat_purge_strip_number %}  
      {% else %}
        {% cat_purge_strip_number = cat_purge_strip_max %}                                                               # 
      {% endif %}

      # Select appropriate actions
      {% if tool_change_state_code = 0 %}       # (Default) Park Tool Head - Caterpillar-Paused Requested
        M118 Park Tool Head - Caterpillar-Paused
      {% elif tool_change_state_code = 1 %}     # GCode Slicer File Tx request
        M118 Tool GCode Slicer File Tx requested

        TIMELAPSE_TAKE_FRAME HYPERLAPSE=True    # TimeLapse - Once on Park Position, Take Frame - This will capture individual color change in addition to Frame for each layer change

        # mmu Select new tool or mmu_bypass_gate
        {% if mmu_bypass_gate %}                # If bypass gate enable/selected:  do not request tool swap
          ERCF_CHANGE_TOOL TOOL={TOOL}                                                                                      # MMU Tool Change Request as selected from GCode
          SET_GCODE_VARIABLE MACRO=_CAT_OP_PRE_TOOL_CHANGE_STATE VARIABLE=op_actual_tool VALUE={TOOL}                       # Tool swap completed: set as actual Tool
        {% endif %}

        G92 E0                                  # Zero Extruder

        # Transit & Initial Strip Gap  
        G90                                                                           # Absolute Positioning
        G1 E-{retract_op_lenght} F{retract_op_speed}                                  # Retract Operational
        G0 Z{z_safe_transit_hight} F{z_safe_transit_speed}                            # Z Safe Transit
        G0 X{x_purge_park} Y{y_purge_park} F{xy_purge_park_speed}                     # XY Purge Park 

        _CAT_PURGE_TRAP_OPEN

        G90                                     # Absolute Positioning
        FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={gap_lenght} VELOCITY={cat_gap_velocity}         # Caterpillar Track UnSync - Move Gap

        # Initial First Strip  
        G0 Z{z_purge_park_hight} F{xy_purge_park_speed}                               # Z Purge Park Position
        G1 E{unretract_op_lenght} F{unretract_op_speed}                               # Unretract Operational

        _CAT_ENABLE_TRACK_SYNC
        G1 E{strip_lenght} F{cat_strip_velocity}                                      # Purge Filament Strip - Standard Speed
   
        _CAT_DISABLE_TRACK_SYNC
        G92 E0                                  # Zero Extruder
        G1 E-{retract_lenght} F{retract_op_speed}                                     # Retract Operational
   
        G91
        G1 Z{cat_z_hop_hight} F{cat_z_hop_speed}                                      # Caterpillar Z Hop
   
        G90                                     # Absolute Positioning
        FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={gap_lenght} VELOCITY={cat_gap_velocity}          # Caterpillar Track UnSync - Move Gap
        
        # Standard Strip  

        {% for i in range(cat_purge_strip_number) %}
          G0 Z{z_purge_park_hight}  F{xy_purge_park_speed}                            # Z Purge Park Position
          G1 E{unretract_op_lenght} F{unretract_op_speed}                             # Unretract Operational

          _CAT_ENABLE_TRACK_SYNC
          G1 E{strip_lenght} F{cat_strip_velocity}                                    # Purge Filament Strip - Standard Speed
   
          _CAT_DISABLE_TRACK_SYNC
          G92 E0                                 # Zero Extruder
          G1 E-{retract_lenght} F{retract_op_speed}                                   # Retract Operational
   
          G91
          G1 Z{cat_z_hop_hight} F{cat_z_hop_speed}                                    # Caterpillar Z Hop
   
          G90                                    # Absolute Positioning
          FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={gap_lenght} VELOCITY={cat_gap_velocity}         # Caterpillar Track UnSync - Move Gap
        {% endfor %}

        # End Strip
        G0 Z{z_purge_park_hight} F{xy_purge_park_speed}                               # Z Purge Park Position
        G1 E{unretract_op_lenght} F{unretract_op_speed}                               # Unretract Operational

        _CAT_ENABLE_TRACK_SYNC
        G1 E{strip_lenght} F{cat_strip_slow_velocity}                                 # Purge Filament Strip - Slow Speed

        _CAT_PURGE_TRAP_CLOSE 

        _CAT_DISABLE_TRACK_SYNC
        G92 E0                                   # Zero Extruder
        G1 E-{retract_lenght} F{retract_op_speed}                                     # Retract Operational

        G91
        G1 Z{cat_z_hop_hight_exit1}  F{cat_z_hop_speed}                               # Caterpillar Z Hop Exit1

        ##### Return To Print ########################################
 

        M118 T0 (ABS: Red) ----> T4 (ABS: Yellow)
        M118 T0 ----> T4 ----> 1/3 Strip
        M118 T0 ----> T4 ----> 2/3 Strip
        M118 T0 ----> T4 ----> 3/3 Strip
        M118 Purge Completed ----> Resume Print on T4 (ABS: Yellow)

        ###############   Restore :  part Fan, Hot End Temperature, HVAC, And LED Setting, Others?  #######################################################################################################
        
      {% elif tool_change_state_code = 2 %}     # GCode Slicer File M600
        M118 GCode Slicer File M600
      {% elif tool_change_state_code = 3 %}     # User via M600
        M118 User via M600
      {% elif tool_change_state_code = 4 %}     # Caterpillar User Pause Request
        M118 Caterpillar User Pause Request
      {% elif tool_change_state_code = 5 %}     # MMU Pause/Error/Clog/Run Out Sensors
        M118 MMU Pause/Error/Clog/Run Out Sensors
      {% endif %}
    {% endif %}
  {% else %}
    M118 MMU Disable By User
  {% endif %}

# Type of Exit Movement 

       
  {% if printer.ercf.is_paused|int == 1 %}                                      # 
    M118 You can't resume the print without unlocking the ERCF first.           # 
    M118 Run ERCF_UNLOCK and solve any issue before hitting Resume again        # 
    _CAT_PURGE_POSITION_TO_BRUSH_POSITION                                       # 
    _CAT_NOZZLE_CLEAN_SLOW_SHORT                                                # CAT_MAC_BCM_019
    _CAT_BRUSH_POSITION_TO_PARK_POSITION                                        # 
  {% else %}                                                                    #
    _CAT_OUTBOUND_TRANSIT_TO_ELEVATOR_POSITION_XYZ                                                   #
    {% if printer["gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE"].op_z_return_minimum < 10 %}   #
      _CAT_SAFE_XY_TRANSIT_Z_LOW_XY_IN_OUT                                      #   
    {% else %}                                                                  # 
      G90                                                                       # 
      G1 Z{printer["gcode_macro _CAT_OPERATIONAL_PURGE_FILAMENT_PRE_TOOL_CHANGE"].op_z_return_minimum} F900    #     <-------- Need Variable for velocity #####################
    {% endif %}                                                                 # 

    M106 S{op_fan_speed_part}                                                   # Set Part Cooling Fan speed back to Operational Speed

    G90
    G1 x{op_x_target} y{op_y_target} Z{op_z_target} F3600    #### <-------- Need Variable for velocity #####################   
       
    RESTORE_GCODE_STATE NAME=COTSV                                              #
  {% endif %}                                                                   # 


      
      

      ############  Need Logic for calculation of purge material - Stip purge number
      
       ############  In Pause macro, Put Logic to Send or Keep Park The Tool Head after end of Task
                 ##  Also logic to cancel the standard pause and go To Caterpillar Operation
       ############  In resume macro, Put logic to resume from Caterpilar Purge instead of normal resume

        ############  Put Logic if MMU go in Pause and Fault mode, and way to ext/resum print

      ############ Pre Script to determinate: -First Layer Tool, -How many purge Combo Required, -How many purge total
      ############ Macro to Test/tune numbers of purge combo before print base on Pre Script
      ############ Macro to Test/tune numbers of purge combo to test all possible combo




