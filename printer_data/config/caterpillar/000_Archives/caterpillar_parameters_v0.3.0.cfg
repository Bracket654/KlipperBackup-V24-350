[gcode_macro _CAT_PARAMETERS]

# Requested Tool swap
variable_requested_tool: 0                                 # Tool request from MMU and/or User: 0 = T0, 1 = T1, etc...
variable_th_mat_match_mat_load: False                      # Default: False - Get Value From: _CAT_TH_MATERIAL_ACTUAL - Is The Material In The Toolhead Match the Material being Loaded?

# Interlock Logic State
variable_cat_enable: False                                 # Default: False - Is Caterpillar Enable?
variable_mmu_enable: False                                 # Default: False - Is MMU Enable?
variable_mmu_tool_swap_required: False                     # Default: False - Is a Tool Swap required?
variable_printing: False                                   # Default: False - Is there a print in Progress?
variable_cat_move_pre_cal: False                           # Default: False - Do Pre-Move Calculation need to be Executed?
variable_cat_move_save_value: False                        # Default: False - Does Operational GCode Value need to be Executed?
variable_cat_move_to_park: False                           # Default: False - Does Tool Head need to Move to Park?
variable_cat_purge_material_swap: False                    # Default: False - Is a Filaments Purge between Two Different Material Required?
variable_mmu_tool_swap: False                              # Default: False - Does the MMU need to Swap Tool?
variable_cat_purge: False                                  # Default: False - Is a Filaments Purge Required?
variable_cat_op_return_print: False                        # Default: False - Does The Tool Head Need To Resume Printing?

# Gantry Safe Toolhead Move
variable_cat_safe_z: 13                                    # (mm) From Parameters - Safe Z Hight Transit for Purge Actions 
variable_cat_safe_z_velo: 3600                             # (mm/sec) From Parameters - Gantry Velocity Z Transition

# Gantry Toolhead Park Position
variable_x_park: 34                                        # (mm) From Parameters - Toolhead Park Position X
variable_y_park: 358                                       # (mm) From Parameters - Toolhead Park Position Y
variable_xy_park_velo: 3600                                # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position  
variable_z_park: 5                                         # (mm) From Parameters - Toolhead Park Position Z
variable_cat_direct_park_z: 6                              # (mm) From Parameters - Safe Z Hight Direct Park From/To Purge Position
variable_z_park_velo: 3600                                 # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position  
variable_x_bp_safe_park: 81                                # 
variable_y_bp_safe_park: 318                               # 
variable_xy_bp_safe_park_velo: 3600                        # 

# Gantry Toolhead Purge Position
variable_x_purge: 12                                        # (mm) From Parameters - Toolhead Purge Position X   
variable_y_purge: 358                                      # (mm) From Parameters - Toolhead Purge Position Y    
variable_xy_purge_velo: 3600                               # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position    
variable_z_purge: 0.35                                      # (mm) From Parameters - Toolhead Purge Position Z - The Toolhead resting on the Surface of the Caterpillar Track (GT2 Belt) - Also see: variable_cat_z_tool_gap_dist
variable_z_purge_velo: 3600                                # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position    

# Gantry Toolhead Brush Position
variable_y_brush: 354                                      # (mm) From Parameters - Toolhead Brush Position Y   
variable_z_brush: 10.4                                     # (mm) From Parameters - Toolhead Brush Position Z 
variable_z_brush_velo: 3600                                # (mm/sec) From Parameters - Toolhead Brush Position Z   
variable_x_brush_start: 68                                 # (mm) From Parameters - Toolhead Brush Start Position X 
variable_x_brush_end: 108                                  # (mm) From Parameters - Toolhead Brush End Position X
variable_xy_brush_velo: 3600                               # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Brush Position
variable_xy_brush_slow_velo: 2000                          # (mm/sec) From Parameters - Toolhead Slow Velocity Transition XY To Brush Position 

# Tool Status
variable_actual_tool: 0                                    # Actual Loaded Tool Number - From _CAT_MUX_MERGE_FILAMENT_PARAM - 0 = T0, 1 = T1, etc...
variable_first_layer_tool: 0                               # First Layer Tool Number - From _CAT_MUX_MERGE_FILAMENT_PARAM - 0 = T0, 1 = T1, etc...

# Operational Z Safe Tool Head Go To Purge Transit
variable_op_safe_z_in_out_transit: 0                       # (mm) Calculation - Incremental Z For Save Transit Back/Fort Caterpillar and Printed Part ##### Key Variable #####
variable_preset_x_safe: 5                                  # (mm) From Parameters - Operational Snap Tool Head Move Value - X
variable_preset_y_safe: 5                                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Y 
variable_preset_z_safe: 5                                  # (mm) From Parameters - Operational Snap Tool Head Move Value - Z 

variable_op_retract_dist: 0.5                              # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Operational Snap Tool Head Move Value - retract distance
variable_op_retract_velo: 1800                             # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Operational Snap Tool Head Move Value - retract velocity

# Operational Printed Part Resume Position
variable_op_part_fan_velo: 0                               # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Fan Part Velocity
variable_op_part_toolhead_temp: 0                          # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Toolhead Temperature
variable_op_pressure_advance: 0.040                        # (mm?) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Pressure Advance 
variable_op_pressure_advance_smooth: 0.040                 # (mm?) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Pressure Advance Smooth 
variable_op_z-offset: 0                                    # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Z-Offset  
variable_op_enclosure_temp: 0                              # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Enclosure Temperature
variable_op_speed_factor: 0                                # From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Speed Factore 
variable_op_extrusion_factor: 0                            # From _CAT_MUX_MERGE_FILAMENT_PARAM - Resume Print Extrusion Factore

# Caterpillar Setting
variable_cat_z_tool_gap_dist: 2.0                          # 2.2  (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Gap Toolhead to Track(GT2 Belt) 
variable_cat_fila_extrude_temp: 0                          # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Toolhead Extruder Temperature
variable_cat_enclosure_temp: 0                             # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Enclosure Temperature
variable_cat_part_fan_velo: 0                              # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Part Fan Velocity 
variable_cat_pressure_advance: 0                           # (mm?) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Pressure Advance 
variable_cat_pressure_advance_smooth: 0                    # (mm?) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Pressure Advance Smooth 
variable_cat_z-offset: 0                                   # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Z-Offset  
variable_cat_enclosure_temp: 0                             # (Cdeg) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Enclosure Temperature
variable_cat_speed_factor: 0                               # From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Speed Factore 
variable_cat_extrusion_factor: 0                           # From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Print Extrusion Factore 
variable_cat_strip_requested: 2                            # (Qty) From _CAT_MUX_MERGE_FILAMENT_PARAM - Number of Strip Requested
variable_cat_strip_quantity_min: 3                         # (Qty) From _CAT_MUX_MERGE_FILAMENT_PARAM - Minimum Strip Quantity
variable_cat_strip_quantity_max: 5                         # (Qty) From _CAT_MUX_MERGE_FILAMENT_PARAM - Maximum Strip Quantity
variable_cat_strip_dist: 50                                # 30 # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Lenght
variable_cat_strip_velo: 440                               # 300 / 480 / 400  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity 
variable_cat_strip_velo_slow: 150                          # 250 / 200 # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity Slow 
variable_cat_strip_gap_dist: 10                            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Lenght 
variable_cat_strip_gap_velo: 20                            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Velocity 
variable_cat_exit_strip_gap_dist: 15                       # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Lenght 
variable_cat_exit_strip_gap_velo: 20                       # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Velocity
variable_cat_strip_clear_track_dist: 100                   # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Clear Out Lenght 
variable_cat_strip_clear_track_velo: 30                    # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Clear Out Velocity  
variable_cat_retract_dist: 0.5                             # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance 
variable_cat_retract_velo: 1800                            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity 
variable_cat_retract_velo_slow: 900                        # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Slow 
variable_cat_retract_exit_dist: 1.5                        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance Exit 
variable_cat_retract_exit_velo: 3600                       # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Exit 
variable_cat_retract_exit_velo_slow: 2000                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Slow Exit  
variable_cat_unretract_dist: 0.5                           # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Distance  
variable_cat_unretract_velo: 1800                          # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity  
variable_cat_unretract_velo_slow: 900                      # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity Slow
variable_cat_unretract_exit_dist: 1                        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Distance Exit 
variable_cat_unretract_exit_velo: 3600                     # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity Exit
variable_cat_unretract_exit_velo_slow: 2000                # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity Slow Exit 
variable_cat_zhop_dist: 1                                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Distance 
variable_cat_zhop_velo: 27000                              # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Velocity  
variable_cat_zhop_exit_dist: 2                             # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Distance  
variable_cat_zhop_exit_velo: 27000                         # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Velocity
variable_cat_strip_clear_conveyor_velo: 10                 # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - conveyor belt Strip Extrusion Velocity
variable_cat_strip_clear_conveyor_dist: 50                # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - conveyor belt Strip Extrusion Distance

# Purge Trap Servo Setting
variable_cat_purge_trap_open: 180                         # (Deg) 
variable_cat_purge_trap_close: 110                        # (Deg) 
variable_cat_purge_trap_dwell: 2                          # (Sec) 

# X26  Z3

gcode:

