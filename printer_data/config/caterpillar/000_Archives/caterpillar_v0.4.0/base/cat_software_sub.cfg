variable_printing: False
variable_mm_transit_material: False
gcode:
   {% set cat_strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_dist %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Lenght
   {% set cat_strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_velo %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Velocity
   {% set cat_exit_strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_dist %}        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Lenght
   {% set cat_exit_strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_velo %}        # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Velocity 
   {% set cat_strip_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo %}                          # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity 
   {% set cat_strip_velo_slow = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo_slow %}                # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity Slow
   {% set cat_retract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_dist %}                      # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance
   {% set cat_retract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_velo %}                      # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity
   {% set z_purge_belt = printer["gcode_macro _CAT_PARAMETERS"].cat_z_purge_belt|float %}                               # (mm) From Parameters - Toolhead Purge Position Z - The Toolhead resting on the Surface of the Caterpillar Track (GT2 Belt) - Also see: variable_cat_z_tool_gap_dist
   {% set cat_z_tool_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_z_tool_gap_dist|float %}                     # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Gap Toolhead to Track(GT2 Belt)
   {% set z_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_z_purge_velo %}                          # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position
   {% set cat_unretract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_dist %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Distance 
   {% set cat_unretract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_velo %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity 
   {% set cat_zhop_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_dist %}                            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Distance  
   {% set cat_zhop_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_velo %}                            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Velocity
   {% set cat_retract_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_dist %}            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance Exit
   {% set cat_retract_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_velo %}            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Exit
   {% set cat_zhop_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_dist %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Distance 
   {% set cat_zhop_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_velo %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Velocity
   {% set cat_part_fan_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_part_fan_velo %}                    # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Part Fan Velocity 
   #{% set purge_volume_mmu = pv|map(attribute=to_tool)|max %}                                                # (mm^3) From MMU Calculation and/or Slicer

   {% set z_purge = z_purge_belt + cat_z_tool_gap_dist %}
   M118 z_purge_belt: {z_purge_belt}mm + cat_z_tool_gap_dist: {cat_z_tool_gap_dist}mm = z_purge: {z_purge}mm
  
   M118 _CAT_DIRECT_PURGE_FILAMENT

   SAVE_GCODE_STATE NAME=_CAT_PURGE_FILAMENT

   M118 Save Actual GCODE State

   #_CAT_PART_FAN_OP_STATE
   #M106 S{cat_part_fan_velo * 255}
   #M118 Set Fan Velocity to: {cat_part_fan_velo * 255}

   #SET_GCODE_OFFSET Z=0.0                                        # Reconsider Z Offset at this stage and insert it in the purge track gap in the formula
   #M118 Set Z Offset to: 0mm
   #{% set z_purge = (z_purge + cat_z_tool_gap_dist) %}           # 

   #_CAT_EXTRUSION_FACTOR_OP_STATE
   #M220 S100
   #M118 Set Extrusion Factor to: {cat_part_fan_velo * 255}

   #_CAT_PRESSURE_ADV_SAVE_OP_STATE
   #_CAT_PRESSURE_ADV_ST_SAVE_OP_STATE

   ##### Purge Pre-Calculation #####

   #SET_GCODE_VARIABLE MACRO=_CAT_PARAMETERS VARIABLE=cat_op_purge_volume_requested VALUE={purge_volume_mmu}     # 

   #_CAT_PURGE_PRE_CAL

   #{% set strip_quantity = printer["gcode_macro _CAT_PARAMETERS"].cat_op_backup_strip_request %}       # 
   #{% set cat_strip_init_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_init_dist %}          # (mm) From From Parameters - initial Strip Lenght 
   #{% set cat_strip_mid_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_mid_dist %}            # (mm) From From Parameters - middle Strip Lenght 
   #{% set cat_strip_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_exit_dist %}          # (mm) From From Parameters - exit Strip Lenght   

   {% set cat_strip_init_dist = 80 %}
   {% set cat_strip_mid_dist = 80 %}
   {% set cat_strip_exit_dist = 80 %} 
   
   #M118 Rx Caterpillar: Strip Quantity: {strip_quantity}
   M118 Rx Caterpillar: Initial Strip Lenght: {cat_strip_init_dist}mm    Volume: {cat_strip_init_dist * 2.4}mm^3
   M118 Rx Caterpillar: Mid Strip Lenght: {cat_strip_mid_dist}mm        Volume: {cat_strip_mid_dist * 2.4}mm^3
   M118 Rx Caterpillar: Exit Strip Lenght: {cat_strip_exit_dist}mm       Volume: {cat_strip_exit_dist * 2.4}mm^3

   ##### Initial Gap #####

   G92 E0                                                         # Zero Extruder  retract_op_speed  

   G90                                                            # Absolute Positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

   ##### Initial Strip #####
   M118 Initial Purge Strip
   
   G0 Z{z_purge} F{z_purge_velo}                                  # Z Purge distance from Track (GT2 Timing Belt)
   #G1 E{cat_unretract_dist} F{cat_unretract_velo}                 # Unretract Filament

   _CAT_ENABLE_TRACK_SYNC
   _CAT_ENABLE_CONVEYOR_BELT_SYNC
   M118 Purging Volume: {cat_strip_init_dist * 2.4}mm^3
   G1 E{cat_strip_init_dist} F{cat_strip_velo}                    # Purge Initial Filament Strip - Standard Speed
   
   _CAT_DISABLE_TRACK_SYNC
   _CAT_DISABLE_CONVEYOR_BELT_SYNC
   G92 E0                                                         # Zero Extruder
   G1 E-{cat_retract_dist} F{cat_retract_velo}                    # Retract Operational
   
   G91
   G1 Z{cat_zhop_dist}  F{cat_zhop_velo}                          # Caterpillar Z Hop
   
   G90                                                            # Absolute Positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

   ##### Mid Strip #####
   {% if strip_quantity == 3 %}
      M118 Mid Purge Strip
   
      G0 Z{z_purge} F{z_purge_velo}                                # Z Purge distance from Track (GT2 Timing Belt)
      G1 E{cat_unretract_dist} F{cat_unretract_velo}               # Unretract Filament

      _CAT_ENABLE_TRACK_SYNC
      _CAT_ENABLE_CONVEYOR_BELT_SYNC
      M118 Purging Volume: {cat_strip_mid_dist * 2.4}mm^3
      G1 E{cat_strip_mid_dist} F{cat_strip_velo}                   # Purge Filament Strip - Standard Speed
   
      _CAT_DISABLE_TRACK_SYNC
      _CAT_DISABLE_CONVEYOR_BELT_SYNC
      G92 E0                                                       # Zero Extruder
      G1 E-{cat_retract_dist} F{cat_retract_velo}                  # Retract Operational
   
      G91
      G1 Z{cat_zhop_dist}  F{cat_zhop_velo}                        # Caterpillar Z Hop
   
      G90                                                          # Absolute Positioning
      FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap
   
   {% else %}
      M118 Skip Mid Purge Strip
   
   {% endif %}

   ##### Multimaterial Extra Transit Purge Strip #####
   {% if mm_transit_material == True %}
      {% set svv = printer.save_variables.variables %}
      {% set pre_load_temp = svv.actualemperature %}
      
      # -----------------------------> ##### Multimaterial Extra Transit Purge Strip ##### <--------------------------------------------- ############################################################################
       M118 Multimaterial Extra Transit Purge Strip
      # Transit MM Purge GCODE

      # 2 Step Multimaterial Extra Transit Purge Strip

      # Lower the Temp if Necessary - Let temp follow while purging

      
      {% set mm_transit_material = False %} 
      

      
      # Lower the Temp if Necessary - wait for temp to lower before allowing the last purge
      
   {% endif %}

   ##### Exit Strip #####
   M118 Exit Purge Strip

   # Return To Operational Print
   G0 Z{z_purge} F{z_purge_velo}                                 # Z Purge distance from Track (GT2 Timing Belt)
   G1 E{cat_unretract_dist} F{cat_unretract_velo}                # Unretract Operational

   _CAT_ENABLE_TRACK_SYNC
   _CAT_ENABLE_CONVEYOR_BELT_SYNC
   M118 Purging Volume: {cat_strip_exit_dist} * 2.4}mm^3
   G1 E{cat_strip_exit_dist} F{cat_strip_velo_slow}              # Purge Filament Strip - Slow Speed

   _CAT_DISABLE_TRACK_SYNC
   _CAT_DISABLE_CONVEYOR_BELT_SYNC

   {% if printing == True %}                                     #    
      G92 E0                                                     # Zero Extruder
      G1 E-{cat_retract_exit_dist} F{cat_retract_exit_velo}      # Retract Operational

      G91
      G1 Z{cat_zhop_exit_dist} F{cat_zhop_exit_velo}             # Caterpillar Z Hop Exit Purge
      G90

      G92 E0                                                     # Zero Extruder

      ##### End Purge #####

   {% else %}
      G90                                                        # Absolute Positioning
      FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_exit_strip_gap_dist} VELOCITY={cat_exit_strip_gap_velo}     # Caterpillar Track UnSync - Move Gap

   {% endif %} 

   #_CAT_PRESSURE_ADV_RTN_OP_STATE
   #_CAT_PRESSURE_ADV_ST_RTN_OP_STATE

   #_CAT_PART_FAN_RTN_OP_STATE

   #_CAT_EXTRUSION_FACTOR_RTN_OP_STATE

   RESTORE_GCODE_STATE NAME=_CAT_PURGE_FILAMENT


