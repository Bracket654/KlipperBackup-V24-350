variable_print_safe_z_min: 25
#variable_safe_z_min: 0
variable_reset_safe_z_min: True
variable_mmu_z_min_mode: False
gcode:
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set cat_safe_z_min_default = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min|float  %}      # (mm) Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions in Gantry Zone
   {% set mmu_min_safe_z = printer["gcode_macro _MMU_PARK"].min_lifted_z|float  %}                      # (mm) From mmu_sequence.cfg : _MMU_PARK - Safe Z Hight Transit to avoid colision with printed part(s)
