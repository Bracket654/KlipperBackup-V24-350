gcode:
   SET_GCODE_VARIABLE MACRO=_CAT_MIN_SAFE_Z_STATUS VARIABLE=reset_safe_z_min VALUE={True}                     #
   {% set cat_safe_z_min_default = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}                   # (mm) Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions in Gantry Zone
   SET_GCODE_VARIABLE MACRO=_CAT_MIN_SAFE_Z_STATUS VARIABLE=print_safe_z_min VALUE={cat_safe_z_min_default}   #


#####################################################################################
# _CAT_MIN_SAFE_Z_STATUS
#
[gcode_macro _CAT_MIN_SAFE_Z_STATUS]
