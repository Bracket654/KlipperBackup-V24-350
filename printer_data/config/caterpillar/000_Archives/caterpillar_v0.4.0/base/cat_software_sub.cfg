   {% set act_z = printer.toolhead.position.z|float %}


#####################################################################################
# _CAT_MIN_REQ_STATUS 
#
[gcode_macro _CAT_MIN_REQ_STATUS]
description: _CAT_MIN_REQ_STATUS
variable_min_reqs_all_c: False
variable_homed: False
variable_qgl: False
variable_cal_z: False
gcode:
   {% if (printer.quad_gantry_level.applied == False) or (printer.z_calibration.last_query != True) or ("x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes) %}
      M118 Min Requirement Not Set!
      {% set min_reqs_all_c = False %}
         
      {% if ("x" not in printer.toolhead.homed_axes) or ("y" not in printer.toolhead.homed_axes) or ("z" not in printer.toolhead.homed_axes) %}
         M118 Need Homing
         {% set homed = False %}
      {% endif %}
            
      {% if printer.quad_gantry_level.applied == False %}
         M118 Need QGL
         {% set qgl = False %}
      {% endif %}
            
      {% if printer.z_calibration.last_query != True == False %}
         M118 Need Z Calibration
         {% set cal_z = False %}
      {% endif %}

   {% else %}
      M118 Min Requirement Set!
      {% set min_reqs_all_c = True %}

   {% endif %}


#####################################################################################
# _CAT_MIN_REQ_SETUP 
#
[gcode_macro _CAT_MIN_REQ_SETUP]
description: _CAT_MIN_REQ_SETUP
gcode:
   {% set nozzle_temp = printer.extruder.temperature %}
   {% set stby_nozzle_temp = printer["gcode_macro _CAT_PARAMETERS"].cat_stanby_nozzle_temp %}  

   _CAT_MIN_REQ_STATUS

   {% set homed = printer["gcode_macro _CAT_MIN_REQ_STATUS"].homed %}
   {% set qgl = printer["gcode_macro _CAT_MIN_REQ_STATUS"].qgl %}
   {% set cal_z = printer["gcode_macro _CAT_MIN_REQ_STATUS"].cal_z %}

   {% set temp_rtn = False %}

   {% if nozzle_temp > stby_nozzle_temp %}
      M118 Save Actual Nozle Temperature
      #SET_GCODE_VARIABLE MACRO=_CAT_NOZZLE_TEMP_STANBY_RTN_OP_STATE VARIABLE=cat_skip_rtn_nozzle_temp VALUE={1|int}        # 
      #_CAT_NOZZLE_TEMP_STANBY_OP_STATE
      {% set temp_rtn = True %}
   {% endif %}  
         
   {% if homed != True %}
      SET_GCODE_VARIABLE MACRO=_CAT_HOMING VARIABLE=temp_bypass VALUE={True}                                               # 
      _CAT_HOMING
      SET_GCODE_VARIABLE MACRO=_CAT_HOMING VARIABLE=temp_bypass VALUE={False}                                              # 
   {% endif %}

   {% if qgl != True %}
      SET_GCODE_VARIABLE MACRO=_CAT_QGL VARIABLE=temp_bypass VALUE={True}                                               #
      _CAT_QGL
      SET_GCODE_VARIABLE MACRO=_CAT_QGL VARIABLE=temp_bypass VALUE={False}                                              # 
   {% endif %}

   {% if cal_z != True %}
      SET_GCODE_VARIABLE MACRO=_CAT_CALIBRATE_Z VARIABLE=temp_bypass VALUE={True}                                               #
      _CAT_CALIBRATE_Z
      SET_GCODE_VARIABLE MACRO=_CAT_CALIBRATE_Z VARIABLE=temp_bypass VALUE={False}                                              # 
   {% endif %}

   _CAT_MIN_REQ_STATUS

   {% if temp_rtn == True %}
      M118 Return To Original Nozle Temperature
      #SET_GCODE_VARIABLE MACRO=_CAT_NOZZLE_TEMP_STANBY_RTN_OP_STATE VARIABLE=cat_skip_rtn_nozzle_temp VALUE={0|int}        # 
      #_CAT_NOZZLE_TEMP_STANBY_RTN_OP_STATE
   {% endif %}


#####################################################################################
# _CAT_KLICKY_Z_HOP
#
[gcode_macro _CAT_KLICKY_Z_HOP]
description: _CAT_KLICKY_Z_HOP
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions

   {% set z_hop_hight = 5 %}                                                                     # 
   {% set z_hop_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_velo %}                 # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position

   {% if act_z < cat_safe_z_min %}
      M118 Toolhead under Safe Z Gantry Transit
      G90                                                          # absolute positioning
      G0 Z{cat_safe_z_min + z_hop_hight} F{z_hop_velo}
         
   {% else %}
      M118 Toolhead above Safe Z Gantry Transit
      G90                                                          # absolute positioning
      G0 Z{act_z + z_hop_hight} F{z_hop_velo}

   {% endif %}


