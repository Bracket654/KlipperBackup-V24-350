####################################################################################
# Caterpillar Clear Track of all Strips
#
[gcode_macro _CAT_CLEAR_CATERPILLAR_TRACK]
description: Caterpillar Clear Track of all Strips
gcode:
   {% set velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_clear_track_velo %}        # (mm) Strip Clear Out Lenght
   {% set dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_clear_track_dist %}        # (mm/sec) Strip Clear Out Velocity

   _CAT_DISABLE_CONVEYOR_BELT_SYNC
   _CAT_DISABLE_TRACK_SYNC
   G90                                                                                       # absolute positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={dist} VELOCITY={velo}   # Caterpillar Track UnSync - Move Gap


#####################################################################################
# Caterpillar Clear Conveyor Belt of all Strips
#
[gcode_macro _CAT_CLEAR_CONVEYOR_BELT_TRACK]
description: Caterpillar Clear Conveyor Belt of all Strips
gcode:
   {% set velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_clear_conveyor_velo %}     # (mm) From Strip Clear Out Lenght
   {% set dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_clear_conveyor_dist %}     # (mm/sec) Strip Clear Out Velocity

   _CAT_DISABLE_TRACK_SYNC
   _CAT_DISABLE_CONVEYOR_BELT_SYNC
   G90                                                                                       # absolute positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_conveyor_belt" DISTANCE={dist} VELOCITY={velo}


#####################################################################################
# Engage Caterpillar Track
#
[gcode_macro _CAT_ENABLE_TRACK_SYNC]
description: Engage Caterpillar Track
gcode:
   SYNC_EXTRUDER_MOTION EXTRUDER="caterpillar_track" MOTION_QUEUE=extruder
   

#####################################################################################
# Disengage Caterpillar Track
#
[gcode_macro _CAT_DISABLE_TRACK_SYNC]
description: Disengage Caterpillar Track
gcode:
   SYNC_EXTRUDER_MOTION EXTRUDER="caterpillar_track" MOTION_QUEUE=


#####################################################################################
# Engage Conveyor Belt Track
#
[gcode_macro _CAT_ENABLE_CONVEYOR_BELT_SYNC]
description: Engage Conveyor Belt Track
gcode:
   SYNC_EXTRUDER_MOTION EXTRUDER="caterpillar_conveyor_belt" MOTION_QUEUE=extruder
   

#####################################################################################
# Disengage Conveyor Belt Track
#
[gcode_macro _CAT_DISABLE_CONVEYOR_BELT_SYNC]
description: Disengage Conveyor Belt Track
gcode:
   SYNC_EXTRUDER_MOTION EXTRUDER="caterpillar_conveyor_belt" MOTION_QUEUE=


#####################################################################################
# Homing XYZ
#
[gcode_macro _CAT_HOMING]
description: BlaBla
variable_temp_bypass: False
gcode:
   {% set z_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_velo %}     # (mm/sec) From Parameters - Gantry Velocity Z Transition 
   {% set nozzle_temp = printer.extruder.temperature %}
   {% set stby_nozzle_temp = printer["gcode_macro _CAT_PARAMETERS"].cat_stanby_nozzle_temp %}  

   {% if temp_bypass != True %}
      {% set temp_rtn = False %}

      {% if nozzle_temp > stby_nozzle_temp %}
         M118 Save Actual Nozle Temperature
         #SET_GCODE_VARIABLE MACRO=_CAT_NOZZLE_TEMP_STANBY_RTN_OP_STATE VARIABLE=cat_skip_rtn_nozzle_temp VALUE={1|int}        # 
         #_CAT_NOZZLE_TEMP_STANBY_OP_STATE
         {% set temp_rtn = True %}
      {% endif %}
   {% endif %}
 
   G28                                                                                                                        # 

   SET_GCODE_VARIABLE MACRO=_CAT_MIN_REQ_STATUS VARIABLE=homed VALUE={True}                                                   # 

   _CAT_MIN_REQ_STATUS

   {% if temp_bypass != True %}
      {% if temp_rtn == True %}
         M118 Return To Original Nozle Temperature
         #SET_GCODE_VARIABLE MACRO=_CAT_NOZZLE_TEMP_STANBY_RTN_OP_STATE VARIABLE=cat_skip_rtn_nozzle_temp VALUE={0|int}        # 
         #_CAT_NOZZLE_TEMP_STANBY_RTN_OP_STATE
      {% endif %}
   {% endif %}


#####################################################################################
# Conditional Homing XYZ
#
[gcode_macro _CAT_C_HOMING]
description: BlaBla
gcode:
   {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}  # Conditional G28 (home if not already homed)
      _CAT_HOMING

   {% else %}
      M118 Already Fully Homed

   {% endif %}


#####################################################################################
# CALIBRATE_Z
#
[gcode_macro _CAT_CALIBRATE_Z]
description: BlaBla
variable_temp_bypass: False
gcode:
   #_CAT_NOZZLE_TEMP_STANBY_OP_STATE
   M118 Calibrating Z
   CALIBRATE_Z
   G28 Z
   #_CAT_NOZZLE_TEMP_STANBY_RTN_OP_STATE

   SET_GCODE_VARIABLE MACRO=_CAT_MIN_REQ_STATUS VARIABLE=cal_z VALUE={True}            # 


#####################################################################################
# Conditional CALIBRATE_Z (CALIBRATE_Z if Z not calibrated)
#
[gcode_macro _CAT_C_CALIBRATE_Z]
description: BlaBla
gcode:
   {% if printer.z_calibration.last_query != True %}
      _CAT_CALIBRATE_Z

    {% else %}
       M118 Calibrate Z Already Completed
    
   {% endif %}


#####################################################################################
# Quad Gantry Level
#
[gcode_macro _CAT_QGL]
description: BlaBla
variable_temp_bypass: False
gcode:
   #_CAT_NOZZLE_TEMP_STANBY_OP_STATE
   QUAD_GANTRY_LEVEL
   G28 Z
   #_CAT_NOZZLE_TEMP_STANBY_RTN_OP_STATE

   SET_GCODE_VARIABLE MACRO=_CAT_MIN_REQ_STATUS VARIABLE=qgl VALUE={True}            # 
   

#####################################################################################
# Conditional Quad Gantry Level
#
[gcode_macro _CAT_C_QGL]
description: BlaBla
gcode:
    {% if printer.quad_gantry_level.applied == False %}
       _CAT_QGL

    {% else %}
       M118 Quad Gantry Level Already Completed
    
    {% endif %}


#####################################################################################
# Bed Mesh Calibration
#
[gcode_macro _CAT_BED_MESH]
description: BlaBla
gcode:
   BED_MESH_CLEAR
   #_CAT_NOZZLE_TEMP_STANBY_OP_STATE
   BED_MESH_CALIBRATE PROFILE="default"
   #_CAT_NOZZLE_TEMP_STANBY_RTN_OP_STATE


#####################################################################################
# Conditional Bed Mesh Calibration
#
[gcode_macro _CAT_C_BED_MESH]
description: BlaBla
gcode:
   {% if default in printer.bed_mesh.profiles %}
      BED_MESH_PROFILE LOAD=default

   {% else %}
      _CAT_BED_MESH
      
   {% endif %}
  
