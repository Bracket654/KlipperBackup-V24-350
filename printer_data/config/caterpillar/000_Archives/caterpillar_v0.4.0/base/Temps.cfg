#####################################################################################
# Purge Filament using Caterpillar
#
[gcode_macro _CAT_DIRECT_PURGE_FILAMENT]
description: _CAT_DIRECT_PURGE_FILAMENT
gcode:
   {% set purge_volume_default = printer["gcode_macro _CAT_PARAMETERS"].purge_volume_default %}              # (mm^3) From _CAT_PURGE_PRE_CAL - Default Filament Volume to be purged by Caterpillar
   {% set cat_retract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_dist %}                      # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance
   {% set cat_retract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_velo %}                      # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity
   {% set cat_strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_dist %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Lenght
   {% set cat_strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_velo %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Velocity
   {% set cat_exit_strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_dist %}        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Lenght
   {% set cat_exit_strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_velo %}        # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Velocity 
   {% set z_purge = printer["gcode_macro _CAT_PARAMETERS"].z_purge %}                                        # (mm) From Parameters - Toolhead Purge Position Z - The Toolhead resting on the Surface of the Caterpillar Track (GT2 Belt) - Also see: variable_cat_z_tool_gap_dist
   {% set cat_z_tool_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_z_tool_gap_dist %}                # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Gap Toolhead to Track(GT2 Belt)
   {% set z_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].z_purge_velo %}                              # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position
   {% set cat_unretract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_dist %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Distance 
   {% set cat_unretract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_velo %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity 
   {% set cat_strip_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo %}                          # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity 
   {% set cat_zhop_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_dist %}                            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Distance  
   {% set cat_zhop_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_velo %}                            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Velocity
   {% set cat_strip_velo_slow = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo_slow %}                # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity Slow 
   {% set cat_retract_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_dist %}            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance Exit
   {% set cat_retract_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_velo %}            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Exit
   {% set cat_zhop_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_dist %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Distance 
   {% set cat_zhop_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_velo %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Velocity
   {% set cat_part_fan_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_part_fan_velo %}                    # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Part Fan Velocity 
   
   M118 Filament Purge

   _CAT_DIRECT_OVER_TRACK

   SAVE_GCODE_STATE NAME=CAT_PURGE
   
   _CAT_PART_FAN_OP_STATE
   M106 S{cat_part_fan_velo}


   ##### Purge Pre-Calculation #####

   #########  If then Default Purge Volume or User Defined Volume #########
   SET_GCODE_VARIABLE MACRO=_CAT_PURGE_PRE_CAL=purge_volume_requested VALUE={purge_volume_default}

   _CAT_PURGE_PRE_CAL

   {% set cat_strip_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_dist %}                          # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Lenght 
   {% set cat_strip_requested = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_requested %}                # (Qty) From _CAT_MUX_MERGE_FILAMENT_PARAM - Number of Strip Requested  


   ##### Initial Gap #####

   G92 E0                                                         # Zero Extruder  retract_op_speed  

   G90                                                            # Absolute Positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

   ##### Initial Strip #####
   
    G0 Z{z_purge + cat_z_tool_gap_dist} F{z_purge_velo}            # Z Purge distance from Track (GT2 Timing Belt)
    G1 E{cat_unretract_dist} F{cat_unretract_velo}                 # Unretract Filament

    _CAT_ENABLE_TRACK_SYNC
    _CAT_ENABLE_CONVEYOR_BELT_SYNC
    G1 E{cat_strip_dist} F{cat_strip_velo}                         # Purge Filament Strip - Standard Speed
   
    _CAT_DISABLE_TRACK_SYNC
    _CAT_DISABLE_CONVEYOR_BELT_SYNC
    G92 E0                                                         # Zero Extruder
    G1 E-{cat_retract_dist} F{cat_retract_velo}                    # Retract Operational
   
    G91
    G1 Z{cat_zhop_dist}  F{cat_zhop_velo}                         # Caterpillar Z Hop
   
    G90                                                            # Absolute Positioning
    FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

    # x Number Standard Purge Strip
    {% for i in range(cat_strip_requested) %}
       M118 Standard Purge Strip {1+i}
   
       G0 Z{z_purge + cat_z_tool_gap_dist} F{z_purge_velo}          # Z Purge distance from Track (GT2 Timing Belt)
       G1 E{cat_unretract_dist} F{cat_unretract_velo}               # Unretract Filament

       _CAT_ENABLE_TRACK_SYNC
       _CAT_ENABLE_CONVEYOR_BELT_SYNC
       G1 E{cat_strip_dist} F{cat_strip_velo}                       # Purge Filament Strip - Standard Speed
   
       _CAT_DISABLE_TRACK_SYNC
       _CAT_DISABLE_CONVEYOR_BELT_SYNC
       G92 E0                                                       # Zero Extruder
       G1 E-{cat_retract_dist} F{cat_retract_velo}                  # Retract Operational
   
       G91
       G1 Z{cat_zhop_dist}  F{cat_zhop_velo}                       # Caterpillar Z Hop
   
       G90                                                          # Absolute Positioning
       FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap
            
   {% endfor %}
          
   M118 Exit Purge Strip

   # Return To Operational Print
   G0 Z{z_purge + cat_z_tool_gap_dist} F{z_purge_velo}           # Z Purge distance from Track (GT2 Timing Belt)
   G1 E{cat_unretract_dist} F{cat_unretract_velo}                # Unretract Operational

   _CAT_ENABLE_TRACK_SYNC
   _CAT_ENABLE_CONVEYOR_BELT_SYNC
   G1 E{cat_strip_dist} F{cat_strip_velo_slow}                   # Purge Filament Strip - Slow Speed

   _CAT_DISABLE_TRACK_SYNC
   _CAT_DISABLE_CONVEYOR_BELT_SYNC
   G92 E0                                                        # Zero Extruder
   G1 E-{cat_retract_exit_dist} F{cat_retract_exit_velo}         # Retract Operational

   G91
   G1 Z{cat_zhop_exit_dist} F{cat_zhop_exit_velo}                # Caterpillar Z Hop Exit Purge
   G90

   G92 E0                                                        # Zero Extruder

   G90                                                          # Absolute Positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_exit_strip_gap_dist} VELOCITY={cat_exit_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

   ##### End Purge #####

   _CAT_PART_FAN_RTN_OP_STATE
   
   RESTORE_GCODE_STATE NAME=CAT_PURGE







#####################################################################################
# Purge Filament using Caterpillar Pre Mod
#
[gcode_macro _CAT_DIRECT_PURGE_FILAMENT]
description: _CAT_DIRECT_PURGE_FILAMENT
gcode:
   {% set purge_volume_default = printer["gcode_macro _CAT_PARAMETERS"].purge_volume_default %}              # (mm^3) From _CAT_PURGE_PRE_CAL - Default Filament Volume to be purged by Caterpillar
   {% set cat_retract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_dist %}                      # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance
   {% set cat_retract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_velo %}                      # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity
   {% set cat_strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_dist %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Lenght
   {% set cat_strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_gap_velo %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Gap Velocity
   {% set cat_exit_strip_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_dist %}        # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Lenght
   {% set cat_exit_strip_gap_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_exit_strip_gap_velo %}        # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Exit Strip Gap Velocity 
   {% set z_purge = printer["gcode_macro _CAT_PARAMETERS"].z_purge %}                                        # (mm) From Parameters - Toolhead Purge Position Z - The Toolhead resting on the Surface of the Caterpillar Track (GT2 Belt) - Also see: variable_cat_z_tool_gap_dist
   {% set cat_z_tool_gap_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_z_tool_gap_dist %}                # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Gap Toolhead to Track(GT2 Belt)
   {% set z_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].z_purge_velo %}                              # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position
   {% set cat_unretract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_dist %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Distance 
   {% set cat_unretract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_velo %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Unretract Velocity 
   {% set cat_strip_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo %}                          # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity 
   {% set cat_zhop_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_dist %}                            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Distance  
   {% set cat_zhop_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_velo %}                            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Velocity
   {% set cat_strip_velo_slow = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_velo_slow %}                # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Extrusion Velocity Slow 
   {% set cat_retract_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_dist %}            # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance Exit
   {% set cat_retract_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_velo %}            # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Exit
   {% set cat_zhop_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_dist %}                  # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Distance 
   {% set cat_zhop_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_zhop_exit_velo %}                  # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Zhop Exit Velocity
   {% set cat_part_fan_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_part_fan_velo %}                    # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Part Fan Velocity 


 
   {% set safe_z_Gantry_transit = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z %}                       # (mm) From Parameters - Safe Z Hight Transit for Purge Actions
   {% set safe_z_Gantry_transit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_velo %}             # (mm/sec) From Parameters - Gantry Velocity Z Transition
   {% set x_purge = printer["gcode_macro _CAT_PARAMETERS"].x_purge %}                                        # (mm) From Parameters - Toolhead Purge Position X
   {% set y_purge = printer["gcode_macro _CAT_PARAMETERS"].y_purge %}                                        # (mm) From Parameters - Toolhead Purge Position Y
   {% set xy_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_purge_velo %}                            # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position 
   
   M118 Filament Purge

   ##### Transit & Initial setup/backup ##### 
   #G90                                                            # Absolute Positioning
   #G1 E-{cat_retract_dist} F{cat_retract_velo}                    # Retract Operational
   #G0 Z{safe_z_Gantry_transit} F{safe_z_Gantry_transit_velo}      # Z Safe Transit
   #G0 X{x_purge} Y{y_purge} F{xy_purge_velo}                      # XY Purge Position
   _CAT_DIRECT_OVER_TRACK

   SAVE_GCODE_STATE NAME=CAT_PURGE
   
   _CAT_PART_FAN_OP_STATE
   M106 S{cat_part_fan_velo}

   #NOZZLE_LED_ON
   
   #SET_PIN PIN=caselight VALUE=0.00
   #SET_PIN PIN=caselight VALUE=1.00
   
   set_nozzle_leds_off
   #SET_LED LED="sb_leds" RED=0 GREEN=0 BLUE=0 WHITE=0.1 SYNC=0 TRANSMIT=1
   #set_logo_leds_off
   
   #SET_LED LED="sb_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
   #set_nozzle_leds_on


   ##### Purge Pre-Calculation #####

   #########  If then Default Purge Volume or User Defined Volume #########
   SET_GCODE_VARIABLE MACRO=_CAT_PURGE_PRE_CAL=purge_volume_requested VALUE={purge_volume_default}

   _CAT_PURGE_PRE_CAL

   {% set cat_strip_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_dist %}                          # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Strip Lenght 
   {% set cat_strip_requested = printer["gcode_macro _CAT_PARAMETERS"].cat_strip_requested %}                # (Qty) From _CAT_MUX_MERGE_FILAMENT_PARAM - Number of Strip Requested  


   ##### Initial Gap #####

   G92 E0                                                         # Zero Extruder  retract_op_speed  

   G90                                                            # Absolute Positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

   ##### Initial Strip #####
   
    G0 Z{z_purge + cat_z_tool_gap_dist} F{z_purge_velo}            # Z Purge distance from Track (GT2 Timing Belt)
    G1 E{cat_unretract_dist} F{cat_unretract_velo}                 # Unretract Filament

    _CAT_ENABLE_TRACK_SYNC
    _CAT_ENABLE_CONVEYOR_BELT_SYNC
    G1 E{cat_strip_dist} F{cat_strip_velo}                         # Purge Filament Strip - Standard Speed
   
    _CAT_DISABLE_TRACK_SYNC
    _CAT_DISABLE_CONVEYOR_BELT_SYNC
    G92 E0                                                         # Zero Extruder
    G1 E-{cat_retract_dist} F{cat_retract_velo}                    # Retract Operational
   
    G91
    G1 Z{cat_zhop_dist}  F{cat_zhop_velo}                         # Caterpillar Z Hop
   
    G90                                                            # Absolute Positioning
    FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

    # x Number Standard Purge Strip
    {% for i in range(cat_strip_requested) %}
       M118 Standard Purge Strip {1+i}
   
       G0 Z{z_purge + cat_z_tool_gap_dist} F{z_purge_velo}          # Z Purge distance from Track (GT2 Timing Belt)
       G1 E{cat_unretract_dist} F{cat_unretract_velo}               # Unretract Filament

       _CAT_ENABLE_TRACK_SYNC
       _CAT_ENABLE_CONVEYOR_BELT_SYNC
       G1 E{cat_strip_dist} F{cat_strip_velo}                       # Purge Filament Strip - Standard Speed
   
       _CAT_DISABLE_TRACK_SYNC
       _CAT_DISABLE_CONVEYOR_BELT_SYNC
       G92 E0                                                       # Zero Extruder
       G1 E-{cat_retract_dist} F{cat_retract_velo}                  # Retract Operational
   
       G91
       G1 Z{cat_zhop_dist}  F{cat_zhop_velo}                       # Caterpillar Z Hop
   
       G90                                                          # Absolute Positioning
       FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_strip_gap_dist} VELOCITY={cat_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap
            
   {% endfor %}
          
   M118 Exit Purge Strip

   # Return To Operational Print
   G0 Z{z_purge + cat_z_tool_gap_dist} F{z_purge_velo}           # Z Purge distance from Track (GT2 Timing Belt)
   G1 E{cat_unretract_dist} F{cat_unretract_velo}                # Unretract Operational

   _CAT_ENABLE_TRACK_SYNC
   _CAT_ENABLE_CONVEYOR_BELT_SYNC
   G1 E{cat_strip_dist} F{cat_strip_velo_slow}                   # Purge Filament Strip - Slow Speed

   _CAT_DISABLE_TRACK_SYNC
   _CAT_DISABLE_CONVEYOR_BELT_SYNC
   G92 E0                                                        # Zero Extruder
   G1 E-{cat_retract_exit_dist} F{cat_retract_exit_velo}         # Retract Operational

   G91
   G1 Z{cat_zhop_exit_dist} F{cat_zhop_exit_velo}                # Caterpillar Z Hop Exit Purge
   G90

   G92 E0                                                        # Zero Extruder

   G90                                                          # Absolute Positioning
   FORCE_MOVE STEPPER="extruder_stepper caterpillar_track" DISTANCE={cat_exit_strip_gap_dist} VELOCITY={cat_exit_strip_gap_velo}   # Caterpillar Track UnSync - Move Gap

   ##### End Purge #####

   _CAT_PART_FAN_RTN_OP_STATE
   
   RESTORE_GCODE_STATE NAME=CAT_PURGE































