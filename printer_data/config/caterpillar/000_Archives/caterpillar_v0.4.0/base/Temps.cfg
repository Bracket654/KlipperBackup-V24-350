#####################################################################################
# BlaBla - 
#
[gcode_macro _CAT_MMU_UPDATE_HEIGHT]
description: BlaBla - 
variable_timelapse_new_frame_z: 10
gcode:
   {% set height = params.HEIGHT|default(0)|float %}
   {% set park_vars = printer['gcode_macro _MMU_PARK'] %}
   {% set max_z = [park_vars.min_lifted_z, printer.gcode_move.gcode_position.z, height]|max %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set safe_z_Gantry_transit = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z %}                       # (mm) From Parameters - Safe Z Hight Transit for Purge Actions

   {% if act_z < safe_z_Gantry_transit %} 
      SET_GCODE_VARIABLE MACRO=_MMU_PARK VARIABLE=min_lifted_z VALUE={safe_z_Gantry_transit} 
      
   {% else %}                         
      SET_GCODE_VARIABLE MACRO=_MMU_PARK VARIABLE=min_lifted_z VALUE={max_z}
      SET_GCODE_VARIABLE MACRO=_CAT_MMU_UPDATE_HEIGHT VARIABLE=timelapse_new_frame_z VALUE={max_z}
   {% endif %}


