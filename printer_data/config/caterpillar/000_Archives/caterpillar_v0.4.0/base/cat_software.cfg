#####################################################################################
# _CAT_SAFE_MOVE_INBOARD 
#
[gcode_macro _CAT_SAFE_MOVE_INBOARD]
description: _CAT_SAFE_MOVE_INBOARD
variable_printing: False
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set x_park = printer["gcode_macro _CAT_PARAMETERS"].x_park %}                              # (mm) From Parameters - Toolhead Park Position X
   {% set y_park = printer["gcode_macro _CAT_PARAMETERS"].y_park %}                              # (mm) From Parameters - Toolhead Park Position Y
   {% set xy_park_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_velo %}                  # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position 
   {% set z_park = printer["gcode_macro _CAT_PARAMETERS"].z_park %}                              # (mm) From Parameters - Toolhead Park Position Z    
   {% set z_park_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_velo %}                    # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position
   {% set x_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_gantry_zone_limit %}    # (mm) X - safe Z Transit Zone - X Limit
   {% set y_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_gantry_zone_limit %}    # (mm) Y - safe Z Transit Zone - Y Limit   
   {% set x_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_zt_zone_limit %}            # (mm) X - safe Z Transit Zone - X Limit
   {% set y_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_zt_zone_limit %}            # (mm) Y - safe Z Transit Zone - Y Limit
   {% set xy_zt_point_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_zt_point_velo %}          # XY Velocity - Build Plate safe Z Transit Position 
   {% set min_reqs_all_c = printer["gcode_macro _CAT_MIN_REQ_STATUS"].min_reqs_all_c %}
   {% set safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}                         # (mm) Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions in Gantry Zone
   {% set print_safe_z_min = printer["gcode_macro _CAT_MIN_SAFE_Z_STATUS"].cat_print_safe_z_min %}      # (mm) From _CAT_MIN_SAFE_Z_STATUS - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions

   {% set x_park_purge = printer["gcode_macro _CAT_PARAMETERS"].x_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position X
   {% set y_park_purge = printer["gcode_macro _CAT_PARAMETERS"].y_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position Y
   {% set z_park_purge = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position Z
   {% set xy_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_purge_velo %}      # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position
   {% set z_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge_velo %}        # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position  
 
   {% set inbound_move_xyz_snap_move = printer["gcode_macro _CAT_PARAMETERS"].cat_inbound_move_xyz_snap_move %}      # 
   {% set inbound_move_retract = printer["gcode_macro _CAT_PARAMETERS"].cat_inbound_move_retract %}                  # 
   {% set preset_x_safe = printer["gcode_macro _CAT_PARAMETERS"].cat_preset_x_safe %}                                # 
   {% set preset_y_safe = printer["gcode_macro _CAT_PARAMETERS"].cat_preset_y_safe %}                                # 
   {% set preset_z_safe = printer["gcode_macro _CAT_PARAMETERS"].cat_preset_z_safe %}                                # 
   {% set retract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_dist %}                                  # 
   {% set retract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_velo %}                                  # 

   {% set op_x_target = printer["gcode_macro _CAT_PARAMETERS"].cat_op_x_target %}                # 
   {% set op_y_target = printer["gcode_macro _CAT_PARAMETERS"].cat_op_y_target %}                #   

   {% if min_reqs_all_c != True %}                                                               # 
      M118 Min Requirement Not Set!
      _CAT_MIN_REQ_SETUP
   {% endif %}  

   {% if act_y >= y_zt_zone_limit and act_x >= x_zt_zone_limit %}                                # Is Toolhead In The Print Zone?
      M118 Toolhead is in Print Zone

      {% if printing == True %}                                                                  # 
         # Calculate Safe Transit x Tool Head
         {% if act_x < (max_x/2) %}
            {% set x_safe = (act_x + preset_x_safe) %}
         {% else %} 
            {% set x_safe = (act_x - preset_x_safe) %}
         {% endif %} 

         # Calculate Safe Transit y Tool Head
         {% if act_y < (max_y/2) %}
            {% set y_safe = (act_y + preset_y_safe) %}
         {% else %} 
            {% set y_safe = (act_y - preset_y_safe) %}
         {% endif %} 

         # Calculate Safe Transit z Tool Head
         _CAT_MIN_SAFE_Z_STATUS 
         {% set safe_z_min = printer["gcode_macro _CAT_MIN_SAFE_Z_STATUS"].print_safe_z_min %}  # 
      
         {% if preset_z_safe <= (max_z - safe_z_min) %}
            {% set z_safe = (safe_z_min + preset_z_safe) %}
         {% else %} 
            {% if (safe_z_min + preset_z_safe) < max_z %}
               {% set z_safe = (safe_z_min + (max_z - safe_z_min)) %}
            {% else %}
               {% set z_safe = max_z %}
            {% endif %}
         {% endif %} 

         {% set safe_z_min = z_safe %}

         SAVE_GCODE_STATE NAME=PRINT_SAFE_MOVE_INBOARD                        # https://www.klipper3d.org/G-Codes.html?h=save_g#save_gcode_state

         G90                                                                  # absolute positioning
         G1 E-{retract_dist} F{retract_velo}                                  # Retract Operational   

         G0 X{x_safe} Y{y_safe} Z{safe_z_min} F{z_park_purge_velo}            # XYZ Snap Move

         SET_GCODE_VARIABLE MACRO=_CAT_PARAMETERS VARIABLE=cat_op_x_target VALUE={printer.toolhead.position.x|float}                         # Save Actual X fot safe Return to Print
         SET_GCODE_VARIABLE MACRO=_CAT_PARAMETERS VARIABLE=cat_op_y_target VALUE={printer.toolhead.position.y|float}                         # Save Actual y fot safe Return to Print
         SET_GCODE_VARIABLE MACRO=_CAT_MIN_SAFE_Z_STATUS VARIABLE=print_safe_z_min VALUE={printer.toolhead.position.y|float}                 # 

      {% else %}
         
         {% if act_z < safe_z_min %}
            M118 Toolhead under Safe Z Gantry Transit
            G90                                                          # absolute positioning
            G0 Z{safe_z_min} F{xy_park_purge_velo}                       # 
         
         {% else %}
            M118 Toolhead above Safe Z Gantry Transit

         {% endif %}
 
      {% endif %} 

      G90                                                                # absolute positioning
      G0 X{x_park_purge} Y{y_park_purge} F{xy_park_purge_velo}           # XY Purge Position

   {% else %} 
      M118 Toolhead is not in Print Zone

   {% endif %}


#####################################################################################
# _CAT_SAFE_RETURN_TO_PRINT
#
[gcode_macro _CAT_SAFE_RETURN_TO_PRINT]
description: _CAT_SAFE_RETURN_TO_PRINT
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set mmu_safe_z = printer["gcode_macro _MMU_PARK"].min_lifted_z %}                                # (mm) From mmu_sequence.cfg : _MMU_PARK - Safe Z Hight Transit to avoid colision with printed part(s)
   {% set x_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_gantry_zone_limit %}          # (mm) X - safe Z Transit Zone - X Limit
   {% set y_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_gantry_zone_limit %}          # (mm) Y - safe Z Transit Zone - Y Limit   
   {% set x_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_zt_zone_limit %}                  # (mm) X - safe Z Transit Zone - X Limit
   {% set y_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_zt_zone_limit %}                  # (mm) Y - safe Z Transit Zone - Y Limit
   {% set z_zt_point_velo = printer["gcode_macro _CAT_PARAMETERS"].z_zt_point_velo %}                  # (mm/sec) Z Velocity - Build Plate safe Z Transit Position 
   {% set op_x_target = printer["gcode_macro _CAT_PARAMETERS"].cat_op_x_target %}                      # 
   {% set op_y_target = printer["gcode_macro _CAT_PARAMETERS"].cat_op_y_target %}                      # 
   {% set unretract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_dist %}                # 
   {% set unretract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_unretract_velo %}                # 
   {% set retract_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_dist %}                    # 
   {% set retract_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_velo %}                    # 
   {% set cat_retract_exit_dist = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_dist %}      # (mm) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Distance Exit
   {% set cat_retract_exit_velo = printer["gcode_macro _CAT_PARAMETERS"].cat_retract_exit_velo %}      # (mm/sec) From _CAT_MUX_MERGE_FILAMENT_PARAM - Caterpillar Retract Velocity Exit

   {% set x_park_purge = printer["gcode_macro _CAT_PARAMETERS"].x_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position X
   {% set y_park_purge = printer["gcode_macro _CAT_PARAMETERS"].y_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position Y
   {% set z_park_purge = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge %}                  # (mm) From Parameters - Toolhead Purge Position Z
   {% set xy_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_purge_velo %}      # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Purge Position
   {% set z_park_purge_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_purge_velo %}        # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Purge Position  

   {% set safe_z_min = printer["gcode_macro _CAT_MIN_SAFE_Z_STATUS"].print_safe_z_min %}

   ##### End Purge #####

   #_CAT_PRESSURE_ADV_RTN_OP_STATE
   #_CAT_PRESSURE_ADV_ST_RTN_OP_STATE

   _CAT_PART_FAN_RTN_OP_STATE

   _CAT_EXTRUSION_FACTOR_RTN_OP_STATE

   G92 E0                                                        # Zero Extruder
   G1 E-{cat_retract_exit_dist} F{cat_retract_exit_velo}         # Retract Operational
      
   G90                                                                                        # absolute positioning      
   G0 X{x_park_purge} Y{y_park_purge} Z{print_safe_z_min} F{z_park_purge_velo}                # 
   G0 X{op_x_target} Y{op_y_target} F{z_park_purge_velo}                                      # 

   G1 E{unretract_dist} F{unretract_velo}                                                     # UnretractOperational         
   RESTORE_GCODE_STATE NAME=PRINT_SAFE_MOVE_INBOARD                                           # https://www.klipper3d.org/G-Codes.html?h=save_g#save_gcode_state


#####################################################################################
# Move Toolhead To CAT Park Position - 
#
[gcode_macro _CAT_PARK_POSITION]
description: Safe Move Toolhead To CAT Park Position
gcode:
   {% set act_x = printer.toolhead.position.x|float %}
   {% set act_y = printer.toolhead.position.y|float %}
   {% set act_z = printer.toolhead.position.z|float %}
   {% set max_x = printer.toolhead.axis_maximum.x|float %}
   {% set max_y = printer.toolhead.axis_maximum.y|float %}
   {% set max_z = printer.toolhead.axis_maximum.z|float %}
   {% set x_park = printer["gcode_macro _CAT_PARAMETERS"].x_park %}                              # (mm) From Parameters - Toolhead Park Position X
   {% set y_park = printer["gcode_macro _CAT_PARAMETERS"].y_park %}                              # (mm) From Parameters - Toolhead Park Position Y
   {% set xy_park_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_park_velo %}                  # (mm/sec) From Parameters - Toolhead Velocity Transition XY To Park Position 
   {% set z_park = printer["gcode_macro _CAT_PARAMETERS"].z_park %}                              # (mm) From Parameters - Toolhead Park Position Z    
   {% set mmu_safe_z = printer["gcode_macro _MMU_PARK"].min_lifted_z %}                          # (mm) From mmu_sequence.cfg : _MMU_PARK - Safe Z Hight Transit to avoid colision with printed part(s)
   {% set cat_safe_z_min = printer["gcode_macro _CAT_PARAMETERS"].cat_safe_z_min %}              # (mm) From Parameters - Safe Z Hight Minimum Absolute Safe XY Transit for Purge Actions
   {% set z_park_velo = printer["gcode_macro _CAT_PARAMETERS"].z_park_velo %}                    # (mm/sec) From Parameters - Toolhead Velocity Transition Z To Park Position
   {% set x_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_gantry_zone_limit %}    # (mm) X - safe Z Transit Zone - X Limit
   {% set y_gantry_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_gantry_zone_limit %}    # (mm) Y - safe Z Transit Zone - Y Limit   
   {% set x_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].x_zt_zone_limit %}            # (mm) X - safe Z Transit Zone - X Limit
   {% set y_zt_zone_limit = printer["gcode_macro _CAT_PARAMETERS"].y_zt_zone_limit %}            # (mm) Y - safe Z Transit Zone - Y Limit
   {% set xy_zt_point_velo = printer["gcode_macro _CAT_PARAMETERS"].xy_zt_point_velo %}          # XY Velocity - Build Plate safe Z Transit Position 

   {% if (act_x == x_park) and (act_y == y_park) and (act_z == z_park) %}                        # Toolhead Already in Park Position?     
      _CAT_MIN_REQ_STATUS

   {% else %}
      _CAT_SAFE_MOVE_INBOARD
      _CAT_DIRECT_PARK
      
   {% endif %}


