# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBCan]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 901b3e25c9ba

[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: EBBCan: PA2

[adxl345]
cs_pin: EBBCan: PB12
spi_software_sclk_pin: EBBCan: PB10
spi_software_mosi_pin: EBBCan: PB11
spi_software_miso_pin: EBBCan: PB2
axes_map: z,-y,x

[resonance_tester]
probe_points: 174, 174, 25
accel_chip: adxl345

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 32
rotation_distance: 22.6789511
gear_ratio: 50:10
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA3
min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 180
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982

##  Try to keep pressure_advance below 1.0
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040
#pressure_advance: 0.050
#################
##  0.4mm Nozle:
pressure_advance: 0.040 
#pressure_advance: 0.050                      # PLA maybe: 0.0625 
#pressure_advance_smooth_time: 0.040         # PLA
#pressure_advance: 0.000                     # PLA+
#pressure_advance_smooth_time: 0.000         # PLA+
#pressure_advance: 0.0                       # PETG
#pressure_advance_smooth_time: 0.000         # PETG
#pressure_advance: 0.0                       # ABS
#pressure_advance_smooth_time: 0.000         # ABS
#pressure_advance: 0.0                       # ABS+
#pressure_advance_smooth_time: 0.000         # ABS+

max_extrude_only_distance: 200      # added for ERCF
max_extrude_cross_section: 50.0     # added for ERCF

# sensor_type:MAX31865
# sensor_pin: EBBCan: PA4
# spi_bus: spi1
# rtd_nominal_r: 100
# rtd_reference_r: 430
# rtd_num_of_wires: 2

[tmc2240 extruder]
cs_pin: EBBCan: PA15
spi_software_sclk_pin: EBBCan: PB10
spi_software_mosi_pin: EBBCan: PB11
spi_software_miso_pin: EBBCan: PB2
driver_TPFD: 0
run_current: 0.650
stealthchop_threshold: 0
interpolate: false

[heater_fan hotend_fan]
##  Hotend Fan - FAN1
pin: EBBCan: PA0
heater: extruder
heater_temp: 50.0
max_power: 1.0
kick_start_time: 0.5
#heater_temp: 28.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

[fan]
##  Print Cooling Fan
pin: EBBCan: PA1
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

#[heater_fan 4W_FAN0]
#pin: EBBCan: PB14
#tachometer_pin: EBBCan: PB15
#tachometer_ppr: 1

## Ref: stealthburner_leds.cfg for neopixel
#[neopixel hotend_rgb]
#pin: EBBCan:PD3

[probe]
pin: ^!EBBCan: PB9
x_offset: 0     # Scipt Default: 0
y_offset: 0     # Scipt Default: 25.0
z_offset: 0     # Scipt Default: 0
speed: 10     # Default: 10.0   was at: 6.0
samples: 3 # Default: 3   
samples_result: median
sample_retract_dist: 3.0    # Default: 3.0  was at: 5.0
samples_tolerance: 0.01         # 0.05   # Default: 0.006   # how much of a difference there can be before it triggers a retest, there is a default if you don't specify
samples_tolerance_retries: 3  # Default: 5
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

