[fan_generic exhaust_fan]
##  Exhaust fan - FAN3 - Manual Control/G Code Control
pin: PD13
max_power: 1.0
kick_start_time: 0.5
#shutdown_speed: 0.0
#kick_start_time: 5.0
#heater: enclosure_temp
#heater_temp: 60
#fan_speed: 1.0

[fan_generic outside_exhaust_fan]
##  Exhaust fan - FAN5 - Manual Control/G Code Control
pin: PD15
max_power: 1.0
kick_start_time: 0.5

[temperature_sensor hvac_temp]
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: Generic 3950
sensor_pin: PF6
max_temp: 100

#####################################################################
#   Servo Motor Control
#####################################################################

#   PWM output pin controlling the servo. This parameter must be
#   provided.
#maximum_servo_angle: 180
#   The maximum angle (in degrees) that this servo can be set to. The
#   default is 180 degrees.
#minimum_pulse_width: 0.001
#   The minimum pulse width time (in seconds). This should correspond
#   with an angle of 0 degrees. The default is 0.001 seconds.
#maximum_pulse_width: 0.002
#   The maximum pulse width time (in seconds). This should correspond
#   with an angle of maximum_servo_angle. The default is 0.002
#   seconds.
#initial_angle:
#   Initial angle (in degrees) to set the servo to. The default is to
#   not send any signal at startup.
#initial_pulse_width:
#   Initial pulse width time (in seconds) to set the servo to. (This
#   is only valid if initial_angle is not set.) The default is to not
#   send any signal at startup.
[servo eap_servo]
pin: PG12
maximum_servo_angle: 180
minimum_pulse_width: 0.00050
maximum_pulse_width: 0.00250