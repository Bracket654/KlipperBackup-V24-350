[gcode_macro VENT_CHAMBER]
gcode:
    SAVE_GCODE_STATE NAME=VENT
    EXAUST_VALVE_OPEN
    SET_FAN_SPEED FAN=outside_exhaust_fan SPEED=1   # 100%
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1   # 100%
    SET_FAN_SPEED FAN=under_bed_carbon_filter SPEED=1   # 100%
    M106 S255
    RESTORE_GCODE_STATE NAME=VENT

[gcode_macro VENT_CHAMBER_OFF]
gcode:
    SAVE_GCODE_STATE NAME=VENTOFF
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0   # 0%
    SET_FAN_SPEED FAN=under_bed_carbon_filter SPEED=0   # 0%
    EXAUST_VALVE_CLOSE
    M106 S0
    RESTORE_GCODE_STATE NAME=VENTOFF

[gcode_macro CHAMBER_TEMP_WARMUP]
gcode:
    SAVE_GCODE_STATE NAME=CHAMBER_TEMP_WARMUP
    SET_FAN_SPEED FAN=outside_exhaust_fan SPEED=1   # 100%
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.3   # 30%
    SET_FAN_SPEED FAN=under_bed_carbon_filter SPEED=0.2   # 20%
    EXAUST_VALVE_AJAR_3
    M106 S0
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=110
    RESTORE_GCODE_STATE NAME=CHAMBER_TEMP_WARMUP

[gcode_macro CHAMBER_OP_TEMP]
gcode:
    SAVE_GCODE_STATE NAME=HEATCHAMBER
    SET_FAN_SPEED FAN=outside_exhaust_fan SPEED=1   # 100%
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.6   # 60%
    SET_FAN_SPEED FAN=under_bed_carbon_filter SPEED=0.2   # 20%
    EXAUST_VALVE_OPEN
    RESTORE_GCODE_STATE NAME=HEATCHAMBER

[gcode_macro EXAUST_VALVE_OPEN]
# Valve Full Open
gcode:
  SET_SERVO SERVO=eap_servo ANGLE=133
  G4 P600
  SET_SERVO SERVO=eap_servo ANGLE=180
  G4 P2000
  SET_SERVO SERVO=eap_servo WIDTH=0.0   # Servo Off

